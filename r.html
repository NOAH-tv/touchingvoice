<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:#0f0722;font-family:'NanumSquare',sans-serif;color:#fff;}
::-webkit-scrollbar{width:0;height:0;}
img{display:block;}
button{font-family:'NanumSquare',sans-serif;cursor:pointer;}
input{font-family:'NanumSquare',sans-serif;}
@keyframes ringPulse{0%{transform:translate(-50%,-50%) scale(.45);opacity:.7}100%{transform:translate(-50%,-50%) scale(1.75);opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes ctaGlowA{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.22),0 14px 36px rgba(160,107,255,.55),0 0 48px rgba(224,92,255,.35)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.32),0 18px 52px rgba(160,107,255,.8),0 0 80px rgba(224,92,255,.6)}}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes screenIn{from{transform:translateY(16px)}to{transform:translateY(0)}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orbBreath{0%,100%{transform:scale(1);box-shadow:0 0 60px rgba(224,92,255,.5),0 0 0 0 rgba(224,92,255,.4)}50%{transform:scale(1.06);box-shadow:0 0 90px rgba(224,92,255,.8),0 0 0 24px rgba(224,92,255,0)}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
#app{min-height:100vh;background:radial-gradient(130% 80% at 50% 0%,#3d1c72 0%,#250f49 44%,#150a2b 100%);display:flex;justify-content:center;}
.col{width:100%;max-width:460px;min-height:100vh;position:relative;display:flex;flex-direction:column;}
.scr{flex:1;display:flex;flex-direction:column;animation:screenIn .45s cubic-bezier(.16,1,.3,1);}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:linear-gradient(180deg,rgba(21,10,43,.92),rgba(21,10,43,0));backdrop-filter:blur(8px);}
.topbar img{height:18px;opacity:.95;}
.badge{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);}
.badge b{font-weight:800;font-size:11px;letter-spacing:.5px;color:#e8dbff;white-space:nowrap;}
.btn-primary{width:100%;height:60px;border:none;border-radius:18px;font-weight:800;font-size:17px;letter-spacing:1px;color:#fff;background:linear-gradient(135deg,#7b3bff,#e05cff);box-shadow:0 14px 40px rgba(123,59,255,.5);transition:opacity .25s;}
.btn-primary:disabled{opacity:.45;}
.btn-ghost{width:100%;height:48px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:transparent;color:#bcaee0;font-weight:700;font-size:14px;}
.field-label{font-weight:800;font-size:11px;letter-spacing:1px;color:#b29ce0;margin-bottom:8px;}
.input{width:100%;height:52px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:0 16px;color:#fff;font-size:15px;outline:none;}
.input:focus{border-color:#e05cff;}
</style>
</head>

// ── local data store (IndexedDB) — 참가자별 전체 데이터 누적 ──
function openDB(){ return new Promise(function(res,rej){ var rq=indexedDB.open('tv_voice',1); rq.onupgradeneeded=function(){ rq.result.createObjectStore('records',{keyPath:'id',autoIncrement:true}); }; rq.onsuccess=function(){res(rq.result);}; rq.onerror=function(){rej(rq.error);}; }); }
function dbAdd(rec){ return openDB().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('records','readwrite'); var rq=tx.objectStore('records').add(rec); var id=null; rq.onsuccess=function(){ id=rq.result; }; tx.oncomplete=function(){res(id);}; tx.onerror=function(){rej(tx.error);}; }); }); }
function dbAll(){ return openDB().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('records','readonly'); var q=tx.objectStore('records').getAll(); q.onsuccess=function(){res(q.result||[]);}; q.onerror=function(){rej(q.error);}; }); }); }
function dbPut(rec){ return openDB().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('records','readwrite'); tx.objectStore('records').put(rec); tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; }); }); }
function dataURLToBlob(u){ var parts=u.split(','); var mime=(parts[0].match(/:(.*?);/)||[])[1]||'image/png'; var bin=atob(parts[1]); var len=bin.length; var arr=new Uint8Array(len); for(var i=0;i<len;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }

function exportAll(){
  if(typeof JSZip==='undefined'){ alert('압축 모듈을 불러오지 못했습니다. (인터넷이 필요할 수 있어요)'); return; }
  dbAll().then(function(recs){
    if(!recs.length){ alert('저장된 데이터가 없습니다.'); return; }
    var zip=new JSZip(), root=zip.folder('터칭보이스_데이터');
    var csv='\uFEFF순번,이름,나이,성별,노래,보이스타입,외향성,성실성,우호성,신경성,개방성,배음풍부도,발음명확도,스펙트럼밸런스,일시\n';
    recs.forEach(function(r,i){
      var idx=String(i+1).padStart(3,'0');
      var safe=String(r.name||'익명').replace(/[\\/:*?"<>|]/g,'_');
      var date=(r.timestamp||'').slice(0,10);
      var f=root.folder(idx+'_'+safe+'_'+date);
      var sc=r.scores||{}, m=r.metrics||{};
      csv+=[idx,r.name,r.age,r.gender,r.song,r.type,sc.E,sc.C,sc.A,sc.N,sc.O,m.harmonic,m.articulation,m.balance,r.timestamp].map(csvCell).join(',')+'\n';
      f.file('결과.json', JSON.stringify({name:r.name,age:r.age,gender:r.gender,song:r.song,type:r.type,scores:sc,metrics:m,timestamp:r.timestamp},null,2));
      if(r.reportPng) f.file('레포트.png', r.reportPng);
      if(r.audio) f.file('녹음.wav', r.audio);
    });
    root.file('전체결과.csv', csv);
    zip.generateAsync({type:'blob'}).then(function(blob){ var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='터칭보이스_데이터_'+new Date().toISOString().slice(0,10)+'.zip'; document.body.appendChild(a); a.click(); setTimeout(function(){a.remove();},100); });
  });
}

// ── seeded questions ──
function seededShuffle(arr, seed){ var a=arr.slice(); var s=seed; for(var i=a.length-1;i>0;i--){ s=(s*1664525+1013904223)&0xffffffff; var j=Math.abs(s)%(i+1); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function makeSeed(name,count){ var h=(name||'guest').split('').reduce(function(a,c){return a*31+c.charCodeAt(0);},7); return Math.abs(h+count*999983+Date.now()%100000); }
function buildQuestions(){
  var seed=makeSeed('guest',S.count); var qs=[];
  DOMAINS.forEach(function(d,di){
    var pool=POOLS[d.code].map(function(q){ return Array.isArray(q)?{t:q[0],r:true}:{t:q,r:false}; });
    var picked=seededShuffle(pool,seed+di+1).slice(0,5);
    picked.forEach(function(q,qi){ qs.push({id:d.code+'-'+qi,code:d.code,color:d.color,t:q.t,r:q.r}); });
  });
  return qs;
}

// 관리자 인증 (검증은 Apps Script 서버에서 수행 — 비밀번호는 클라이언트에 없음)
// ════════════════════════════════════════
var ADMIN_TOKEN_KEY='tv_admin_token';
var ACCESS_TOKEN='tv-scy-72a3da7c2fd012ec05e4e9d67e3b0bf396d4ea58';  // 백엔드와 반드시 동일해야 함
function getAdminToken(){
  try{ var raw=sessionStorage.getItem(ADMIN_TOKEN_KEY); if(!raw) return null;
    var o=JSON.parse(raw); if(!o||!o.token||!o.exp||Date.now()>o.exp){ sessionStorage.removeItem(ADMIN_TOKEN_KEY); return null; }
    return o.token;
  }catch(e){ return null; }
}
function setAdminToken(token,ttlMs){ try{ sessionStorage.setItem(ADMIN_TOKEN_KEY,JSON.stringify({token:token,exp:Date.now()+(ttlMs||8*3600*1000)})); }catch(e){} }
function adminLogout(){ try{ sessionStorage.removeItem(ADMIN_TOKEN_KEY); }catch(e){} S.step='login'; render(); }
// 관리자 자격(클라이언트 측 소프트 게이트). 비밀번호는 평문 대신 SHA-256 해시로만 보관.
var ADMIN_USER='scytv01';
var ADMIN_PASS_HASH='fc785515fd30b41e4f56e98db98073a40e83c75596cebcd9d4b35330fd927dac';
function _sha256Hex(s){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');
  });
}
function adminLogin(){
  var u=$('admUser'), p=$('admPass'), btn=$('admBtn'), msg=$('admMsg');
  if(!u||!p) return;
  var user=u.value.trim(), pass=p.value;
  if(!user||!pass){ if(msg) msg.textContent='아이디와 비밀번호를 입력하세요.'; return; }
  if(btn){ btn.disabled=true; btn.textContent='확인 중…'; } if(msg) msg.textContent='';
  _sha256Hex(pass).then(function(h){
    if(user===ADMIN_USER && h===ADMIN_PASS_HASH){
      setAdminToken(ACCESS_TOKEN, 8*3600*1000); S.step='splash'; render();

function manageLogoutBtn(st){
  var ex=$('admLogout');
  if(st==='login'){ if(ex&&ex.parentNode) ex.parentNode.removeChild(ex); return; }
  if(!ex){

}

function render(){
  var col=$('col'); var st=S.step; var html='';
  if(st==='login'){ col.innerHTML=loginView(); setupLogin(); manageLogoutBtn(st); window.scrollTo(0,0); return; }
  if(st!=='splash') html+=topbar();
  if(st==='splash') html+=splashView();
  else if(st==='survey') html+=surveyView();
  else if(st==='result') html+=resultView();
  else if(st==='info') html+=infoView();
  else if(st==='record') html+=recordView();
  else if(st==='gen') html+=genView();
  else if(st==='report') html+=reportView();
  col.innerHTML=html;
  if(st==='survey') setupSurvey();
  if(st==='record') setupRecord();
  if(st==='report') setupReport();
  if(st==='info') setTimeout(validateInfo,0);
  if(st==='splash') renderDataRow();
  manageLogoutBtn(st);
  window.scrollTo(0,0);
}
function go(step){ S.step=step; render(); }

function start(){ S.questions=buildQuestions(); S.answers={}; S.scores=null; go('survey'); }

function surveyView(){
  var groups='';
  DOMAINS.forEach(function(d){
    groups+='<div style="display:flex;align-items:center;gap:10px;padding:20px 4px 10px"><span style="width:9px;height:9px;border-radius:50%;background:'+d.color+';box-shadow:0 0 10px '+d.color+'"></span><span style="font-weight:800;font-size:13px;color:#fff;letter-spacing:.5px">'+d.name+'</span><span style="font-weight:400;font-size:11px;color:#7d6bb0">Big5</span></div>';
    S.questions.filter(function(q){return q.code===d.code;}).forEach(function(q){
      var btns='';
      for(var v=1;v<=5;v++){ btns+='<button class="lk" data-q="'+q.id+'" data-v="'+v+'" data-color="'+q.color+'" style="flex:1;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);color:#9d8fc4;font-weight:800;font-size:14px;transition:all .15s">'+v+'</button>'; }
      groups+='<div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:16px 16px 14px;margin-bottom:9px">'+
        '<div style="font-weight:400;font-size:14.5px;line-height:1.6;color:#f0eaff;margin-bottom:14px">'+esc(q.t)+'</div>'+
        '<div style="display:flex;gap:6px">'+btns+'</div>'+
        '<div style="display:flex;justify-content:space-between;margin-top:7px;padding:0 2px"><span style="font-size:10px;color:#7d6bb0">전혀 아니다</span><span style="font-size:10px;color:#7d6bb0">매우 그렇다</span></div>'+
      '</div>';
    });
  });
  return '<div class="scr">'+
    '<div style="position:sticky;top:50px;z-index:30;padding:14px 22px 12px;background:linear-gradient(180deg,rgba(21,10,43,.96),rgba(21,10,43,.6))">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><span style="font-weight:800;font-size:13px;color:#e8dbff">간이 성격 검사</span><span id="qcount" style="font-weight:800;font-size:12px;color:#9d8fc4">0 / 25</span></div>'+
      '<div style="height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden"><div id="qprog" style="height:100%;border-radius:3px;background:linear-gradient(90deg,#6be3ff,#b06bff,#ff5cc8);width:0%;transition:width .4s cubic-bezier(.16,1,.3,1)"></div></div>'+
    '</div>'+
    '<div style="padding:8px 18px 24px">'+groups+'</div>'+
    '<div style="position:sticky;bottom:0;padding:14px 18px 22px;background:linear-gradient(0deg,#180b30 55%,rgba(24,11,48,0))"><button id="qsubmit" class="btn-primary" disabled onclick="submitSurvey()">모든 문항에 답해주세요</button></div>'+
  '</div>';
}
function setupSurvey(){
  var col=$('col');
  col.querySelectorAll('.lk').forEach(function(b){
    b.addEventListener('click',function(){
      var qid=b.getAttribute('data-q'), v=parseInt(b.getAttribute('data-v'),10), color=b.getAttribute('data-color');
      S.answers[qid]=v;
      col.querySelectorAll('.lk[data-q="'+qid+'"]').forEach(function(x){ x.style.background='rgba(255,255,255,.05)'; x.style.color='#9d8fc4'; x.style.border='1px solid rgba(255,255,255,.13)'; x.style.boxShadow='none'; });
      b.style.background=color; b.style.color='#1a0b2e'; b.style.border='1px solid '+color; b.style.boxShadow='0 0 18px '+color+'66';
      var n=Object.keys(S.answers).length;
      $('qcount').textContent=n+' / 25';
      $('qprog').style.width=Math.round(n/25*100)+'%';
      var sb=$('qsubmit'); if(n>=25){ sb.disabled=false; sb.textContent='결과 보기 →'; } else { sb.disabled=true; sb.textContent='모든 문항에 답해주세요'; }
    });
  });
}
function submitSurvey(){
  if(Object.keys(S.answers).length<25) return;
  var scores={};
  DOMAINS.forEach(function(d){ var sum=0; S.questions.filter(function(q){return q.code===d.code;}).forEach(function(q){ var v=S.answers[q.id]||3; sum+=q.r?(6-v):v; }); scores[d.code]=Math.round(((sum/5-1)/4)*100); });
  S.scores=scores; go('result');
}

function resultView(){
  var dom=dominant();
  var list=DOMAINS.map(function(d){return Object.assign({},d,{score:S.scores[d.code]});}).sort(function(a,b){return b.score-a.score;});
  var bars='';
  list.forEach(function(d,i){
    bars+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:15px">'+
      '<div style="width:24px;height:24px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#9d8fc4">'+(i+1)+'</div>'+
      '<div style="width:60px;flex-shrink:0;font-weight:700;font-size:14px;color:#fff">'+d.name+'</div>'+
      '<div style="flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden"><div style="height:100%;border-radius:6px;width:'+d.score+'%;background:linear-gradient(90deg,'+d.color+'99,'+d.color+');box-shadow:0 0 12px '+d.color+'88;transform-origin:left;animation:barGrow .9s '+(i*.08)+'s cubic-bezier(.16,1,.3,1) both"></div></div>'+
      '<div style="width:44px;text-align:right;flex-shrink:0;font-weight:800;font-size:14px;color:'+d.color+'">'+d.score+'%</div>'+
    '</div>';
  });
  return '<div class="scr" style="padding:8px 18px 26px">'+
    '<div style="font-weight:900;font-size:24px;letter-spacing:-.5px;text-align:center;margin:4px 0 2px">간이 성격 검사 결과</div>'+
    '<div style="font-weight:400;font-size:12.5px;color:#9d8fc4;text-align:center;margin-bottom:14px">이제 목소리를 더해 진짜 레포트를 완성해요</div>'+
    '<div style="border-radius:24px;padding:30px 26px;background:linear-gradient(135deg,'+dom.color+'40,'+dom.color+'12);border:1px solid '+dom.color+'55;text-align:center;margin-top:6px;animation:pop .5s cubic-bezier(.16,1,.3,1)">'+
      '<div style="font-weight:800;font-size:11px;letter-spacing:2px;color:'+dom.color+';margin-bottom:10px">당신의 보이스 타입</div>'+
      '<div style="font-weight:900;font-size:30px;letter-spacing:-.5px;color:#fff;margin-bottom:12px">'+dom.type+'</div>'+
      '<div style="font-weight:400;font-size:13.5px;line-height:1.8;color:#e0d5f5">'+(dom.score>=50?dom.high:dom.low)+'</div>'+
    '</div>'+
    '<div style="margin-top:18px;border-radius:20px;padding:24px 22px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)"><div style="font-weight:800;font-size:11px;letter-spacing:1px;color:#9d8fc4;margin-bottom:18px">BIG 5 성격 점수</div>'+bars+'</div>'+
    '<button class="btn-primary" style="margin-top:18px" onclick="go(\'info\')">목소리 녹음하러 가기 →</button>'+
    '<button class="btn-ghost" style="margin-top:10px" onclick="go(\'splash\')">처음으로</button>'+
  '</div>';
}

function publish(){
  if(S.blob && !S.wavSaved){ try{ downloadAudio(); S.wavSaved=true; }catch(e){} }
  go('gen');

  (function wait(){

    tries++; setTimeout(wait,100);
  })();
  function proceed(){
    // QR은 로컬 데이터만으로 즉시 생성 (드라이브 업로드와 무관 → 항상 나옴)

// 파형(peaks)을 48포인트·1자리로 압축 (QR 길이 절약, 실제 파형 유지)
function encodePeaks(peaks){
  if(!peaks||!peaks.length) return '';
  var n=48, out='';
  for(var i=0;i<n;i++){ var idx=Math.round(i*(peaks.length-1)/(n-1)); var v=Math.max(0,Math.min(9,Math.round((peaks[idx]||0)*9))); out+=v; }
  return out;
}
// 결과 데이터를 실은 폰 결과페이지(r.html) URL 생성 — QR이 이걸 가리킴
function buildResultURL(){
  var m=S.metrics||{}, fp=(m.freqPct)||{}, sc=S.scores||{}, q=[];
  function add(k,v){ q.push(k+'='+encodeURIComponent(v)); }
  if(S.name) add('nm',S.name);
  if(S.age) add('ag',S.age);
  if(S.gender) add('g',S.gender);
  if(S.song) add('sg',S.song);
  ['E','C','A','N','O'].forEach(function(k){ add(k, Math.round(sc[k]||0)); });
  add('f0',m.F0||0); add('f1',m.F1||0); add('f2',m.F2||0); add('f3',m.F3||0); add('f4',m.F4||0); add('f5',m.F5||0);
  add('rm',m.rms||0); add('dr',m.dr||0); add('hn',m.hnr||0); add('jt',m.jitter||0); add('sh',m.shimmer||0);
  add('b0',fp.hz100||0); add('b1',fp.hz300||0); add('b2',fp.hz600||0); add('b3',fp.hz1200||0); add('b4',fp.hz2500||0); add('b5',fp.hz4000||0); add('b6',fp.hz5500||0); add('b7',fp.hz7000||0); add('b8',fp.hz8000||0);
  var pk=encodePeaks(m.peaks); if(pk) add('pk',pk);
  return location.origin + '/r.html?' + q.join('&');
}

function syncPending(){

/* ── 음향 데이터 → BIG5 음성 발현 점수 (인벤터 구조, 보정상수는 코퍼스로 튜닝) ── */
var VOICE_K={ RMS_ref:0.04, RMS_opt:0.03, DR_lo:8, DR_hi:20, FRONT_ref:0.15, JIT_ceil:5, SHI_ceil:10,
  HNR_lo:10, HNR_hi:25, WARM_ref:0.78, OVER_ceil:15, TOP_ref:42, F3_lo:2400, F3_hi:3000, F2_lo:800, F2_hi:2900 };
function _clip(x,a,b){ return Math.max(a,Math.min(b,x)); }
function voiceBig5(m){
  if(!m||!m.freqPct){ return {E:50,C:50,A:50,N:50,O:50,ok:false}; }
  var K=VOICE_K, fp=m.freqPct, g=function(k){return fp[k]||0;};
  var Etot=g('hz100')+g('hz300')+g('hz600')+g('hz1200')+g('hz2500')+g('hz4000')+g('hz5500')+g('hz7000')+g('hz8000')||1;
  var front=(g('hz2500')+g('hz4000'))/Etot;
  var warm=(g('hz300')+g('hz600'))/Etot;
  var top=g('hz4000')+g('hz5500')+g('hz7000')+g('hz8000');
  var hiDist=(g('hz2500')+g('hz4000')+g('hz5500')+g('hz7000')+g('hz8000'))/Etot;
  var RMS_n=_clip((m.rms||0)/K.RMS_ref,0,1);
  var DR_n=_clip(((m.dr||0)-K.DR_lo)/(K.DR_hi-K.DR_lo),0,1);
  var FR_n=_clip(front/K.FRONT_ref,0,1);
  var JIT_n=_clip((m.jitter||0)/K.JIT_ceil,0,1);
  var SHI_n=_clip((m.shimmer||0)/K.SHI_ceil,0,1);
  var HNR_n=_clip(((m.hnr||0)-K.HNR_lo)/(K.HNR_hi-K.HNR_lo),0,1);
  var WARM_n=_clip(warm/K.WARM_ref,0,1);
  var over=(m.shimmer||0)*(1+hiDist); var OVER_n=_clip(over/K.OVER_ceil,0,1);
  var RMSt=Math.abs((m.rms||0)-K.RMS_opt); var RMSt_n=_clip(RMSt/K.RMS_opt,0,1);
  var TOP_n=_clip(top/K.TOP_ref,0,1);
  var F3_n=_clip(((m.F3||0)-K.F3_lo)/(K.F3_hi-K.F3_lo),0,1);
  var F2_n=_clip(((m.F2||0)-K.F2_lo)/(K.F2_hi-K.F2_lo),0,1);
  var n100=function(x){return Math.round(_clip(x,0,1)*100);};
  return {
    E:n100((RMS_n+DR_n+FR_n)/3),
    C:n100(((1-JIT_n)+(1-SHI_n)+HNR_n)/3),
    A:n100((WARM_n+HNR_n-OVER_n)/2),
    N:n100((JIT_n+SHI_n+RMSt_n+(1-HNR_n))/4),
    O:n100((TOP_n+F3_n+F2_n)/3),
    ok:true
  };
}

/* ── 갭 분석: G_i = B_i(자기보고) − V_i(음성 발현) ── */
function buildGapAnalysis(pScores, vScores){
  var codes=['E','C','A','N','O'];
  var gaps=[];
  codes.forEach(function(c){
    var p=pScores[c], v=vScores[c], gap=p-v; // B - V
    gaps.push({code:c,name:P_META[c].name,color:P_META[c].color,icon:P_META[c].icon,p:p,v:v,gap:gap});
  });
  gaps.sort(function(a,b){return Math.abs(b.gap)-Math.abs(a.gap);});
  return gaps;
}
// 전체 정합도 M = 100 - 평균|갭| (Noah 스펙: 평균|갭| 20.4 → 80%)
function matchScore(gaps){
  var s=0; gaps.forEach(function(g){ s+=Math.abs(g.gap); });
  return Math.max(0,Math.round(100 - s/gaps.length));
}

// 캔버스 텍스트 줄바꿈 (공백 기준)
function wrapCanvasText(ctx,text,maxW){
  var words=text.split(' '), lines=[], cur='';
  for(var i=0;i<words.length;i++){
    var test=cur?cur+' '+words[i]:words[i];
    if(ctx.measureText(test).width>maxW && cur){ lines.push(cur); cur=words[i]; }
    else cur=test;
  }
  if(cur) lines.push(cur);
  return lines;
}

function synthesisComment(gaps){
  var aligned=gaps.filter(function(g){return Math.abs(g.gap)<10;});
  var hidden=gaps.filter(function(g){return g.gap>=20;});   // 성향≫목소리
  var expressed=gaps.filter(function(g){return g.gap<=-20;}); // 목소리≫성향
  var lines=[];
  if(aligned.length>=2) lines.push('당신의 '+aligned.map(function(g){return g.name;}).join('·')+' 영역은 성향과 목소리가 잘 정렬돼 있습니다.');
  if(hidden.length>0) lines.push(hidden.map(function(g){return g.name;}).join('·')+' 영역은 내면의 잠재력이 목소리에 아직 다 담기지 않았어요 — 조금만 훈련하면 빠르게 채워지는 가장 큰 성장 기회입니다.');
  if(expressed.length>0) lines.push(expressed.map(function(g){return g.name;}).join('·')+'은(는) 목소리가 이미 성향보다 앞서 발현되고 있어요. 당신도 모르게 음색에 먼저 드러나는 자연스러운 강점입니다.');
  lines.push('전체 정합도는 '+matchScore(gaps)+'% — 터칭보이스 코칭으로 더 높일 수 있어요.');
  return lines.join(' ');
}

        '💡 성장 방향 · '+pm.grow+
      '</div>'
    );

  // 종합
  html+=rCard(
    rLabel('✨ 종합 성격 프로필')+
    '<div style="font-weight:700;font-size:13px;color:#e8dbff;line-height:1.8">'+

    '</div>'
  );
  return html;
}

/* ─────────────────────────────────────────
   PART 2: 목소리 발달 레포트
───────────────────────────────────────── */
function renderVoiceReport(){
  if(!S.scores) return '<div style="color:#9d8fc4;padding:20px;text-align:center">검사 결과가 없어요.</div>';
  var m=S.metrics||{};
  var vs=voiceBig5(m);
  var gaps=buildGapAnalysis(S.scores, vs);
  var M=matchScore(gaps);
  var byCode={}; gaps.forEach(function(g){ byCode[g.code]=g; });
  var order=['E','C','A','N','O'];
  var biggest=gaps[0];
  var html='';

  // 헤더 — 정합도
  html+='<div style="background:linear-gradient(135deg,rgba(176,107,255,.25),rgba(91,227,255,.1));border-radius:20px;padding:22px 18px;margin-bottom:16px;border:1px solid rgba(176,107,255,.3)">';
  html+='<div style="font-weight:800;font-size:9px;letter-spacing:2px;color:#b06bff;margin-bottom:6px">VOICE × PERSONALITY · 내 목소리의 성격</div>';
  html+='<div style="display:flex;align-items:flex-end;gap:12px;margin-bottom:10px">';
  html+='<div style="font-weight:900;font-size:48px;color:#fff;line-height:1">'+M+'<span style="font-size:20px;color:#9d8fc4">%</span></div>';
  html+='<div style="padding-bottom:4px"><div style="font-weight:700;font-size:14px;color:#e8dbff">성격–목소리 정합도</div><div style="font-weight:400;font-size:11px;color:#9d8fc4">성향과 목소리가 얼마나 맞아떨어지는지</div></div>';
  html+='</div>';
  html+=rBar(M,'linear-gradient(90deg,#b06bff,#5be3ff)',10);
  html+='<div style="margin-top:10px;font-weight:400;font-size:11.5px;color:#bcaee0;line-height:1.6">각 성격 특성이 당신의 <b style="color:#e8dbff">목소리에 얼마나 발현</b>되는지를 보여줍니다. 점수의 높낮이는 좋고 나쁨이 아니라 <b style="color:#e8dbff">표현의 결</b>이에요.</div>';
  if(!S.blob) html+='<div style="margin-top:8px;font-weight:400;font-size:11px;color:#7d6bb0">⚠️ 음성 녹음이 없어 추정값으로 표시됩니다</div>';
  html+='</div>';

  // 각 성격축 — 목소리 발현
  order.forEach(function(code){
    var g=byCode[code], pm=P_META[code], gc=gapComment(g.gap);
    var voiceDesc = g.v>=55 ? pm.hi : pm.lo;
    html+='<div style="background:rgba(255,255,255,.05);border:1px solid '+pm.color+'33;border-radius:18px;padding:18px 16px;margin-bottom:12px">';
    // 타이틀 + 목소리 발현 점수
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">';
    html+='<span style="font-size:18px">'+pm.icon+'</span>';
    html+='<div style="flex:1"><div style="font-weight:800;font-size:14px;color:#fff">목소리의 '+pm.name+'</div><div style="font-weight:400;font-size:10.5px;color:#9d8fc4">'+pm.desc+'</div></div>';
    html+='<div style="font-weight:900;font-size:26px;color:'+pm.color+';line-height:1">'+g.v+'<span style="font-size:13px">%</span></div>';
    html+='</div>';
    // 서술
    html+='<div style="font-weight:400;font-size:12px;color:#bcaee0;line-height:1.65;margin:8px 0 12px">'+voiceDesc+'</div>';
    // 듀얼바
    html+='<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">';
    html+='<div style="display:flex;align-items:center;gap:8px"><div style="font-weight:700;font-size:10px;color:#9d8fc4;width:42px;text-align:right;flex-shrink:0">성향</div><div style="flex:1">'+rBar(g.p,pm.color,7)+'</div><div style="font-weight:800;font-size:12px;color:'+pm.color+';width:32px;text-align:right">'+g.p+'%</div></div>';
    html+='<div style="display:flex;align-items:center;gap:8px"><div style="font-weight:700;font-size:10px;color:#9d8fc4;width:42px;text-align:right;flex-shrink:0">목소리</div><div style="flex:1">'+rBar(g.v,gc.color,7)+'</div><div style="font-weight:800;font-size:12px;color:'+gc.color+';width:32px;text-align:right">'+g.v+'%</div></div>';
    html+='</div>';
    // 갭 상태 + 코멘트
    html+='<div style="display:flex;align-items:center;gap:8px;background:'+gc.bg+';border-radius:10px;padding:10px 12px">';
    html+='<div style="background:'+gc.color+'22;border-radius:7px;padding:3px 8px;font-weight:700;font-size:10px;color:'+gc.color+';white-space:nowrap;flex-shrink:0">'+gc.label+'</div>';
    html+='<div style="font-weight:400;font-size:11px;color:#cfc2ec;line-height:1.55">'+gc.msg+'</div>';
    html+='</div>';
    html+='</div>';
  });

  // 성장 포인트 요약
  var growMsg = biggest.gap>=10
    ? '<b style="color:'+P_META[biggest.code].color+'">'+P_META[biggest.code].name+'</b>이(가) 성향에 비해 목소리에 가장 덜 발현돼 있어요. 조금만 연습하면 가장 크게 좋아질 영역입니다.'
    : biggest.gap<=-10
    ? '<b style="color:'+P_META[biggest.code].color+'">'+P_META[biggest.code].name+'</b>은(는) 목소리가 성향보다 앞서 발현되는 자연스러운 강점이에요.'
    : '성향과 목소리가 전반적으로 잘 맞아떨어지고 있어요. 안정적인 표현 채널을 가지고 있습니다.';
  html+=rCard(
    rLabel('🌱 가장 큰 성장 포인트','#6bff9d')+
    '<div style="font-weight:400;font-size:13px;color:#e8dbff;line-height:1.8">'+growMsg+'</div>'
  );
  return html;
}

function renderGapReport(){

  var m=S.metrics||{};

  var matchPct=matchScore(gaps);

  // 헤더
  html+='<div style="background:linear-gradient(135deg,rgba(255,206,92,.2),rgba(107,255,157,.1));border-radius:20px;padding:22px 18px;margin-bottom:16px;border:1px solid rgba(255,206,92,.3)">';

  html+='<div style="display:flex;align-items:flex-end;gap:12px;margin-bottom:6px">';

  gaps.forEach(function(g){
    var gc=gapComment(g.gap);
    html+='<div style="background:'+gc.bg+';border:1px solid '+gc.color+'33;border-radius:16px;padding:16px;margin-bottom:10px">';
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">';

    html+='</div>';
    // 두 막대 비교
    html+='<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">';
    html+='<div style="display:flex;align-items:center;gap:8px">';
    html+='<div style="font-weight:700;font-size:10px;color:#9d8fc4;width:44px;text-align:right;flex-shrink:0">성향</div>';
    html+='<div style="flex:1">'+rBar(g.p,P_META[g.code].color,7)+'</div>';
    html+='<div style="font-weight:800;font-size:12px;color:'+P_META[g.code].color+';width:30px;text-align:right">'+g.p+'%</div>';
    html+='</div>';
    html+='<div style="display:flex;align-items:center;gap:8px">';
    html+='<div style="font-weight:700;font-size:10px;color:#9d8fc4;width:44px;text-align:right;flex-shrink:0">목소리</div>';
    html+='<div style="flex:1">'+rBar(g.v,gc.color,7)+'</div>';
    html+='<div style="font-weight:800;font-size:12px;color:'+gc.color+';width:30px;text-align:right">'+g.v+'%</div>';
    html+='</div>';
    html+='</div>';
    html+='<div style="font-weight:400;font-size:11px;color:#bcaee0;line-height:1.65">'+gc.msg+'</div>';
    html+='</div>';
  });

  // 결론 카드
  html+='<div style="background:linear-gradient(135deg,rgba(107,255,157,.15),rgba(176,107,255,.1));border:1px solid rgba(107,255,157,.3);border-radius:20px;padding:20px 18px;margin-top:4px">';
  html+=rLabel('🌟 터칭보이스 종합 결론','#6bff9d');
  html+='<div style="font-weight:400;font-size:13px;color:#e8dbff;line-height:1.85">'+synthesis+'</div>';
  html+='<div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);font-weight:400;font-size:11px;color:#9d8fc4;line-height:1.7">본 레포트는 자기보고 성격검사와 음성 스펙트럼 분석을 통합한 코칭 참고 자료입니다. 임상 진단이나 채용·인사 평가의 단독 근거가 아닙니다. · TouchingVoice × 서초유스센터</div>';
  html+='</div>';
  return html;

}

  S.name=_rpStr('nm')||''; S.age=_rpStr('ag')||''; S.gender=_rpStr('g')||''; S.song=_rpStr('sg')||'';
  S.scores={E:_rpNum('E'),C:_rpNum('C'),A:_rpNum('A'),N:_rpNum('N'),O:_rpNum('O')};
  S.metrics={
    F0:_rpNum('f0'),F1:_rpNum('f1'),F2:_rpNum('f2'),F3:_rpNum('f3'),F4:_rpNum('f4'),F5:_rpNum('f5'),
    rms:_rpNum('rm'),dr:_rpNum('dr'),hnr:_rpNum('hn'),jitter:_rpNum('jt'),shimmer:_rpNum('sh'),
    freqPct:{hz100:_rpNum('b0'),hz300:_rpNum('b1'),hz600:_rpNum('b2'),hz1200:_rpNum('b3'),hz2500:_rpNum('b4'),hz4000:_rpNum('b5'),hz5500:_rpNum('b6'),hz7000:_rpNum('b7'),hz8000:_rpNum('b8')},

  };
