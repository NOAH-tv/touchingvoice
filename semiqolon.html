 '19:23':{source:'xx.xxiii',background:'하나님을 목자와 손님을 맞는 주인으로 그리는 신뢰의 시예요. 쉼터에서 어두운 골짜기를 지나, 하나님의 집을 소망하는 흐름이에요.',verses:[
  [1,1,'목자라는 비유는 양에게 필요한 것을 돌보는 관계를 보여줘요. 부족함이 없다는 고백의 중심은 소유보다 하나님에 대한 신뢰예요.','지금 내게 가장 필요한 돌봄은 무엇인가요?'],
  [2,2,'푸른 풀밭과 잔잔한 물은 양이 먹고 쉬는 자리예요. 주석은 이를 하나님이 주시는 돌봄과 마음의 쉼으로 풀어요.','오늘 하나님께 맡기고 잠시 쉬고 싶은 일은 무엇인가요?'],
  [3,3,'회복과 인도하심이 함께 나와요. 의의 길은 편하기만 한 길보다, 목자를 따라 바르게 살아가는 길을 가리켜요.','오늘 다시 바로잡고 싶은 작은 선택이 있나요?'],
  [4,4,'골짜기를 피한다는 약속보다 그 안에서도 함께하신다는 고백이에요. 지팡이와 막대기는 목자의 보호와 인도를 떠올리게 해요.','두려운 일 앞에서 어떤 도움을 구하고 싶나요?'],
  [5,5,'장면이 목초지에서 식탁으로 바뀌어요. 원수 앞에서도 차려진 상은 위협에 빼앗기지 않는 하나님의 환대와 돌봄을 보여줘요.','불편한 상황 속에서도 받은 돌봄이 있었나요?'],
  [6,6,'지나온 돌봄이 앞으로의 신뢰로 이어져요. 하나님의 집에 머문다는 소망은 그분과 함께하는 삶을 향해 있어요.','오늘도 이어가고 싶은 감사 한 가지는 무엇인가요?']
 ]},
 '40:11':{source:'xxxii.xi',background:'세례 요한의 질문과 예수님을 받아들이지 않는 이들의 반응이 이어져요. 장 끝에서 예수님은 지친 사람들을 자신에게 초대하세요.',verses:[[28,28,'짐은 삶의 수고뿐 아니라 죄와 스스로 의로워지려는 부담까지 떠올리게 해요. 쉼은 이어지는 29–30절처럼 예수님께 배우는 삶과 연결돼요.','혼자 감당하려 했던 짐 중 무엇을 맡기고 싶나요?']]},
 '43:14':{source:'xxxv.xiv',background:'떠나심을 앞둔 예수님이 불안해하는 제자들을 위로하세요. 아버지께로 가는 길과 성령의 도움을 약속하는 고별 말씀의 한 부분이에요.',verses:[[27,27,'예수님의 평안은 상황이 잠잠해지는 것만을 뜻하지 않아요. 떠나신 뒤에도 제자들을 돌보시겠다는 약속 안에서 이 말을 들을 수 있어요.','지금 평안이 가장 필요한 일은 무엇인가요?']]},
 '19:46':{source:'xx.xlvi',background:'자연과 나라들이 흔들리는 장면 속에서 하나님을 피난처로 고백하는 시예요. 공동체는 혼란보다 크신 하나님의 임재를 바라봐요.',verses:[[1,1,'피난처는 위험이 없다는 뜻보다 위험 속에서 의지할 곳이 있다는 뜻이에요. 도움이 가까이 있다는 고백이 뒤의 두려운 장면을 받쳐줘요.','혼자 버티던 일에서 어떤 도움을 구할 수 있을까요?']]},
 '50:4':{source:'xlii.iv',background:'바울은 공동체의 화합과 기도하는 삶을 권하고, 자신을 도운 이들에게 감사를 전해요. 염려와 여러 형편 속에서 믿음으로 사는 법이 이어져요.',verses:[
  [7,7,'앞선 6절의 감사와 기도에 이어지는 약속이에요. 평안이 마음과 생각을 지킨다는 말은 모든 답을 아는 것보다 하나님께 맡기는 신뢰를 가리켜요.','오늘의 염려 하나를 어떤 말로 기도하고 싶나요?'],
  [13,13,'앞선 11–12절에서 바울은 궁핍과 풍족함 속의 자족을 이야기해요. 이 힘은 모든 소원을 이루는 능력보다 여러 형편을 견디며 살아가는 힘이에요.','지금의 형편 안에서 감당하고 싶은 한 걸음은 무엇인가요?']
 ]},
 '19:62':{source:'xx.lxii',background:'위협과 거짓말 속에서 하나님만을 의지하겠다고 고백하는 시예요. 사람의 지위나 재물에 기대기보다 하나님께 마음을 쏟으라고 권해요.',verses:[[1,1,'잠잠히 기다림은 감정을 숨기는 일이 아니에요. 구원의 근거를 하나님께 두고 자신의 일과 시간을 그분께 맡기는 태도로 읽을 수 있어요.','기다리는 동안 하나님께 솔직히 말하고 싶은 마음은 무엇인가요?']]},
 '23:26':{source:'xxiv.xxvi',background:'구원과 심판의 흐름 안에서 유다의 노래가 나와요. 백성은 하나님을 견고한 성과 반석으로 고백하며 어려움 속에서도 기다려요.',verses:[[3,3,'평강의 근거는 굳센 의지 자체보다 하나님을 신뢰하는 데 있어요. 이어지는 4절은 그분을 영원한 반석으로 부르며 이 신뢰를 설명해요.','흔들리는 생각 중 하나님께 맡기고 싶은 것은 무엇인가요?']]},
 '19:136':{source:'xx.cxxxvi',background:'창조와 출애굽, 광야와 땅의 선물을 돌아보는 감사의 노래예요. 매 절의 반복은 역사 속 하나님의 변함없는 사랑을 기억하게 해요.',verses:[[1,1,'감사는 그날의 기분보다 하나님의 선하심에서 시작돼요. 반복되는 인자하심은 지나간 한 번의 호의가 아니라 계속되는 사랑을 가리켜요.','돌아보니 감사한 돌봄 하나가 떠오르나요?']]},
 '52:5':{source:'xliv.v',background:'주님의 오심을 기다리는 공동체에 깨어 살라고 권하는 장이에요. 서로 돌보고, 기도하고, 좋은 것을 분별하는 일상으로 이어져요.',verses:[[18,18,'기뻐함·기도·감사는 16–18절에서 함께 나와요. 주석은 여러 형편 속에서도 하나님의 돌보심을 기억하며 감사하는 삶으로 풀어요.','지금의 하루에서 작게라도 감사할 한 가지는 무엇인가요?']]},
 '19:100':{source:'xx.c',background:'온 땅을 기쁨의 예배로 초대하는 짧은 감사의 시예요. 하나님이 우리를 지으시고 기르신다는 고백이 찬양의 이유가 돼요.',verses:[[4,4,'문과 뜰은 함께 예배하러 나아가는 장면을 보여줘요. 감사와 찬송은 이어지는 5절의 선하심과 신실하심을 기억하는 응답이에요.','오늘 하나님께 드리고 싶은 감사 한마디는 무엇인가요?']]},
 '19:103':{source:'xx.ciii',background:'자신의 영혼에게 시작한 찬양이 온 피조물의 찬양으로 넓어져요. 용서와 돌봄, 인간의 연약함을 아시는 하나님의 긍휼을 기억하는 시예요.',verses:[[2,2,'잊지 말라는 말 뒤에 용서·회복·구원의 은혜가 구체적으로 이어져요. 찬양은 받은 은혜를 하나씩 기억하는 데서 시작돼요.','당연하게 지나쳤던 은혜가 하나 있나요?']]},
 '59:1':{source:'li.i',background:'시험 속의 인내와 지혜를 구하는 태도에서 시작해, 말씀을 듣고 실천하는 삶으로 이어져요. 유혹의 근원과 좋은 선물의 근원을 구별해요.',verses:[[17,17,'앞에서는 하나님이 악으로 유혹하지 않으신다고 설명해요. 빛들의 아버지와 변하지 않는다는 표현은 좋은 것을 주시는 하나님의 신실함을 강조해요.','요즘 내가 받은 좋은 것을 어떻게 나눌 수 있을까요?']]},
 '19:118':{source:'xx.cxviii',background:'위기에서 건짐받은 감사가 공동체의 예배와 찬양으로 이어지는 시예요. 버림받은 돌을 세우시는 하나님의 구원을 노래해요.',verses:[[24,24,'이날은 앞선 절의 놀라운 구원 사건과 연결돼요. 주석은 버림받은 돌의 높아짐을 그리스도의 구원에 연결하며 기쁨의 이유를 설명해요.','오늘 내가 기억하고 싶은 구원의 은혜는 무엇인가요?']]},
 '51:3':{source:'xliii.iii',background:'그리스도 안의 새 삶을 옷을 갈아입는 모습에 비유해요. 분노와 거짓을 벗고 사랑과 용서를 입으며, 일상의 관계에서 실천하도록 권해요.',verses:[[17,17,'말과 행동을 예수님의 이름으로 한다는 것은 그분을 의지하며 그분께 맞게 살아가는 뜻이에요. 앞의 사랑·평화·말씀과 감사가 일상으로 이어져요.','오늘 내 말이나 행동 하나를 어떻게 바꿔보고 싶나요?']]},
 '23:41':{source:'xxiv.xli',background:'하나님이 역사를 다스리심을 드러내며 우상의 무력함과 대조하는 장이에요. 선택한 종 이스라엘에게 버리지 않았다는 위로가 주어져요.',verses:[[10,10,'두려워하지 말라는 말에는 함께함·힘 주심·도우심·붙드심이 따라와요. 담대함의 근거를 자신의 강함보다 하나님의 동행에 두어요.','도움이 필요하다고 솔직히 말하고 싶은 일이 있나요?']]},
 '6:1':{source:'vii.i',background:'모세가 죽은 뒤 여호수아가 백성을 이끌 책임을 받아요. 요단을 건너기 전, 말씀을 따르는 삶과 하나님의 동행이 함께 강조돼요.',verses:[[9,9,'강하고 담대하라는 명령은 앞선 말씀 묵상과 순종의 권면에 이어져요. 어디로 가든 함께하신다는 약속이 새로운 책임을 감당할 근거예요.','새로운 일 앞에서 오늘 할 수 있는 작은 순종은 무엇인가요?']]},
 '19:27':{source:'xx.xxvii',background:'위협 속의 신뢰와 하나님의 얼굴을 찾는 간구가 함께 있는 시예요. 담대한 고백 뒤에도 기도와 기다림이 계속돼요.',verses:[[1,1,'빛·구원·생명의 능력은 하나님이 어떤 분인지 고백하는 말이에요. 두려움을 모르는 사람의 선언보다, 두려움 속에서 의지할 분을 밝히는 고백이에요.','두려울 때 다시 기억하고 싶은 약속은 무엇인가요?']]},
 '55:1':{source:'xlvii.i',background:'바울은 디모데의 믿음을 기억하며 받은 은사를 다시 일깨우라고 권해요. 고난 속에서도 복음을 부끄러워하지 말라는 격려가 이어져요.',verses:[[7,7,'능력과 함께 사랑과 절제가 놓여 있어요. 담대함은 세게 밀어붙이는 태도보다, 어려움 속에서 사랑하며 분별해 행동하는 힘과 연결돼요.','오늘 용기와 사랑을 함께 담아 하고 싶은 말은 무엇인가요?']]},
 '23:40':{source:'xxiv.xl',background:'위로의 선포와 주님의 길을 준비하라는 말로 시작해요. 크신 창조주를 바라보며, 잊혔다고 느끼는 백성에게 새 힘을 약속해요.',verses:[[31,31,'바로 앞에서 청년도 지치지만 하나님은 피곤하지 않으신다고 대조해요. 앙망함은 스스로 버티기보다 하나님께 소망을 두고 힘을 얻는 태도예요.','지금 힘이 필요한 일과 잠시 쉬어야 할 일은 무엇인가요?']]},
 '5:31':{source:'vi.xxxi',background:'모세가 마지막을 준비하며 여호수아와 백성을 격려하는 장이에요. 지도자가 바뀌어도 말씀을 듣고 하나님을 의지하도록 이끌어요.',verses:[[6,6,'두려움 없는 능력을 요구하기보다 떠나지 않으시는 하나님을 바라보게 해요. 백성에게 주어진 격려는 이어서 여호수아에게도 전해져요.','낯선 시작 앞에서 하나님께 맡기고 싶은 마음은 무엇인가요?']]},
 '1:1':{source:'ii.i',background:'성경의 첫 장은 하나님이 말씀으로 세상에 질서와 생명을 주시는 이야기예요. 창조의 반복과 선하다는 선언이 인간의 창조까지 이어져요.',verses:[
  [1,2,'하늘과 땅의 시작을 하나님께 돌려요. 비어 있고 어두운 모습에서도 하나님의 영이 일하시는 장면이 이어져요.','아직 정돈되지 않은 내 삶의 어느 부분을 맡기고 싶나요?'],
  [3,5,'말씀하심에 빛이 생기고 빛과 어둠이 나뉘어요. 주석은 이 장면을 하나님이 사람의 마음을 밝혀 새롭게 하시는 일에도 연결해요.','오늘 내 마음에 빛이 필요한 자리는 어디인가요?'],
  [6,13,'물과 땅이 나뉘고 땅에 식물이 자라며 살아갈 자리가 마련돼요. 주석은 일상의 먹을거리도 창조주의 선물로 바라보게 해요.','매일 누리면서 잊고 있던 선물은 무엇인가요?'],
  [14,19,'해와 달과 별도 하나님이 만드신 피조물로 등장해요. 때와 계절을 밝히는 빛들은 창조의 질서 안에 놓여 있어요.','오늘 내 시간은 어디에 쓰이고 있나요?'],
  [20,25,'물과 하늘과 땅에 다양한 생명이 채워져요. 작은 생명까지 창조주의 지혜와 돌보심 안에 있다는 시선으로 읽을 수 있어요.','오늘 소중히 돌볼 작은 생명이나 관계가 있나요?'],
  [26,28,'사람을 하나님의 형상으로 지으셨다는 말은 특별한 존엄과 맡겨진 책임을 함께 보여줘요. 주석은 하나님을 닮은 삶과 그분께 영광 돌리는 목적을 강조해요.','오늘 나와 다른 사람의 존엄을 어떻게 존중할 수 있을까요?'],
  [29,30,'사람과 동물에게 먹을 것이 주어져요. 창조 이야기는 생명을 만드시는 일에서 그 생명을 먹이고 돌보시는 일로 이어져요.','필요한 것을 채워주신 일에 무엇을 감사하고 싶나요?'],
  [31,31,'창조 전체를 돌아보며 매우 좋다고 선언하세요. 주석은 창조주의 선한 일을 바라보며 감사하고 그분을 찬양하도록 이끌어요.','오늘 좋은 것으로 바라보고 싶은 것은 무엇인가요?']
 ]},
 '1:32':{source:'ii.xxxii',background:'고향으로 돌아가는 야곱은 형 에서를 만날 일을 두려워해요. 준비와 기도를 거쳐 얍복 나루에서 밤새 씨름하고, 이스라엘이라는 이름을 받아요.',verses:[
  [1,2,'길에서 하나님의 사자들을 만나는 장면이 두려운 만남보다 먼저 나와요. 주석은 큰 시련 앞에서 주어진 보호의 격려로 읽어요.','걱정에 앞서 이미 받았던 도움이 있나요?'],

async function finishPrayer(prayer){const parent=records.find(r=>r.id===prayer.prayerFor);if(parent?.guided&&parent.take===2){parent.published=true;parent.journeyComplete=true;parent.prayerId=prayer.id;parent.completedAt=Date.now();await putRecord(parent);const first=records.find(r=>r.id===parent.baseline);if(first){first.journeyComplete=true;await putRecord(first);}if(syncReadingRecord(parent))saveLedger();resultId=parent.id;}else resultId=prayer.id;localPut('pilsa-last-completed',resultId);prayerFor=null;localPut('pilsa-prayer-for',null);go('done');localPut('pilsa-prayer-draft','');}

function closeEntry(animate=true){clearTimeout(entryTimer);clearTimeout(entryEndTimer);const splash=entrySplash;if(!splash)return;const finish=()=>{if(entrySplash!==splash)return;splash.remove();entrySplash=null;$('main').inert=false;document.body.classList.remove('entry-entering','entry-reveal');if(view==='today')$('main').focus({preventScroll:true});Water.refresh();};if(!animate){finish();return;}document.body.classList.remove('entry-entering');document.body.classList.add('entry-reveal');splash.classList.add('leaving');entryEndTimer=setTimeout(finish,settings.reduced||matchMedia('(prefers-reduced-motion: reduce)').matches?0:850);}
function playEntry(force=false){if(view!=='today'||entrySplash||!Bible.length||recording||starting)return;const key='semiqolon-entry-'+(account?.id||'guest');try{if(!force&&sessionStorage.getItem(key))return;sessionStorage.setItem(key,'shown');}catch{}const reduced=settings.reduced||matchMedia('(prefers-reduced-motion: reduce)').matches;const splash=document.createElement('button');splash.className='entry-splash';splash.setAttribute('aria-label','말씀 화면으로');splash.innerHTML=semiLogo('entry');entrySplash=splash;$('main').inert=true;document.body.classList.add('entry-entering');document.body.append(splash);splash.onclick=()=>closeEntry(!reduced);splash.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();closeEntry(!reduced);}};splash.focus({preventScroll:true});Water.entry();entryTimer=setTimeout(()=>closeEntry(!reduced),reduced?450:2000);}

let challengePlan=localGet('pilsa-challenge','psalms'),readingLedger={chapters:Object.create(null),sources:Object.create(null)},openReadingBooks=new Set([19]),bibleTools=false,biblePicker=null,bibleTurn='still';

function cleanPaletteRewards(values){return Array.isArray(values)?[...new Set(values.filter(key=>Object.hasOwn(PALETTES,key)&&PALETTES[key].mission))]:[];}
function paletteAvailable(key){return Object.hasOwn(PALETTES,key)&&(!PALETTES[key].mission||unlockedPalettes.includes(key));}

const chapterVerses=(b,c)=>Bible.find(x=>x.id===Number(b))?.chapters[String(Number(c))]||[];
const readVerses=(b,c)=>readingLedger.chapters[`${b}:${c}`]||[];
const chapterDone=(b,c)=>{const vs=chapterVerses(b,c);return vs.length>0&&vs.every(v=>readVerses(b,c).includes(v.v));};
function cleanLedger(raw){const out={chapters:Object.create(null),sources:Object.create(null)};if(!raw||typeof raw!=='object')return out;for(const [key,values] of Object.entries(raw.chapters||{})){if(!/^\d{1,2}:\d{1,3}$/.test(key)||!Array.isArray(values))continue;const [b,c]=key.split(':').map(Number),valid=new Set(chapterVerses(b,c).map(v=>v.v));if(valid.size)out.chapters[`${b}:${c}`]=[...new Set(values.filter(n=>Number.isInteger(n)&&valid.has(n)))].sort((a,b)=>a-b);}for(const [id,vs] of Object.entries(raw.sources||{})){if(id.length<=80&&Array.isArray(vs))out.sources[id]=[...new Set(vs.filter(n=>Number.isInteger(n)&&n>=1&&n<=176||typeof n==='string'&&/^\d{1,2}:\d{1,3}:\d{1,3}$/.test(n)&&(()=>{const [b,c,v]=n.split(':').map(Number);return chapterVerses(b,c).some(x=>x.v===v);})()))];}return out;}
function saveLedger(){localPut('pilsa-reading-ledger',readingLedger);syncPaletteRewards();}
function recordReadVerses(r){if(r.unsaved||r.kind!=='read'||!r.book||!r.chapter)return [];const vs=chapterVerses(r.book,r.chapter);if(!vs.length)return [];const done=(r.guided&&r.published&&r.journeyComplete)||r.reading?.complete||r.accuracy>=.9||(r.audio&&r.voiceMetrics?.status==='ready'&&r.verse);if(r.verse)return done&&vs.some(v=>v.v===r.verse)?[r.verse]:[];if(done)return vs.map(v=>v.v);const lit=new Set(r.reading?.lit||[]),found=[];let offset=0;for(const v of vs){const len=norm(v.t).length;let count=0;for(let i=offset;i<offset+len;i++)if(lit.has(i))count++;if(len&&count/len>=.9&&lit.has(offset)&&lit.has(offset+len-1))found.push(v.v);offset+=len;}return found;}
function syncReadingRecord(r){if(r.unsaved)return false;if(r.continuous){const prior=new Set(readingLedger.sources[r.id]||[]);let changed=false;for(const p of r.passages||[]){const key=`${p.book}:${p.chapter}`,source=`${key}:${p.verse}`;if(!p.completed||(r.voiceMetrics?.status!=='ready'&&!r.metrics)||prior.has(source)||!chapterVerses(p.book,p.chapter).some(v=>v.v===p.verse))continue;readingLedger.chapters[key]=[...new Set([...readVerses(p.book,p.chapter),p.verse])].sort((a,b)=>a-b);prior.add(source);changed=true;}if(changed)readingLedger.sources[r.id]=[...prior];return changed;}const found=recordReadVerses(r),prior=new Set(readingLedger.sources[r.id]||[]),fresh=found.filter(n=>!prior.has(n));if(!fresh.length)return false;const key=`${r.book}:${r.chapter}`;readingLedger.chapters[key]=[...new Set([...readVerses(r.book,r.chapter),...fresh])].sort((a,b)=>a-b);readingLedger.sources[r.id]=[...new Set([...prior,...fresh])];return true;}
function planStats(plan){const books=Bible.filter(plan.books);let total=0,done=0,verses=0;for(const b of books)for(const c of Object.keys(b.chapters)){total++;if(chapterDone(b.id,c))done++;verses+=readVerses(b.id,c).length;}return {books,total,done,verses,percent:total?Math.round(done/total*100):0};}
function renderChallenges(){if(!Bible.length)return loadingView();const plan=PLANS.find(p=>p.id===challengePlan)||PLANS[0],stats=planStats(plan);return `<div class="page-head"><div class="eyebrow">ONE CHAPTER, ONE QUIET DAY</div><h1>챌린지</h1></div><div class="challenge-plans" aria-label="성경읽기 챌린지">${PLANS.map(p=>{const s=planStats(p);return `<button class="challenge-plan ${p.id===plan.id?'active':''}" data-plan="${p.id}" aria-pressed="${p.id===plan.id}">${icon(p.icon)}<strong>${p.name}</strong><small>${p.caption}</small><span class="plan-meter"><i style="width:${s.percent}%"></i></span><span>${s.done} / ${s.total}장</span></button>`;}).join('')}</div>${paletteRewardHTML(plan)}<section class="reading-sheet"><div class="sheet-head"><div><span class="eyebrow">나의 성경읽기표</span><h2>${plan.name}</h2><p>${stats.done} / ${stats.total}장 · ${stats.verses.toLocaleString()}절에 머물렀어요</p></div><button class="primary" data-action="continue-challenge">${icon('book')} ${stats.done===stats.total?'다시 펼치기':'이어서 읽기'}</button></div><div class="sheet-progress" role="progressbar" aria-label="${plan.name} 읽기 진행" aria-valuemin="0" aria-valuemax="${stats.total}" aria-valuenow="${stats.done}"><i style="width:${stats.percent}%"></i></div><p class="sheet-help">장 번호를 눌러 한 장 전체 또는 한 절씩 체크할 수 있어요.<br>완료한 낭독은 자동으로 남아요.</p><div class="sheet-legend"><span><i class="complete"></i> 읽었어요</span><span><i class="partial"></i> 읽는 중</span><span><i></i> 기다리는 말씀</span></div>${stats.books.map(b=>`<details class="reading-book" data-reading-book="${b.id}" ${openReadingBooks.has(b.id)?'open':''}><summary><strong>${b.name}</strong><span>${Object.keys(b.chapters).filter(c=>chapterDone(b.id,c)).length} / ${Object.keys(b.chapters).length}장 ${icon('chevron')}</span></summary><div class="chapter-grid">${Object.keys(b.chapters).map(c=>{const count=readVerses(b.id,c).length,done=chapterDone(b.id,c);return `<button class="chapter-check ${done?'complete':count?'partial':''}" data-check-sheet="${b.id}:${c}" aria-label="${b.name} $ function renderBible(){if(!Bible.length)return loadingView();const bk=Bible.find(x=>x.id===book),prev=adjacentChapter(-1),next=adjacentChapter(1);return `<section class="bible-full"><header class="bible-header"><button class="icon-btn" data-nav="today" aria-label="성경 닫기">${icon('back')}</button><nav class="row bible-location" aria-label="말씀 · 장 · 절 선택">${[['book',bk.name,'말씀'],['chapter',chapterLabel(book,chapter),'장'],['verse',selSet().size>1?selSet().size+'절 선택':selectedVerse?selectedVerse+'절':'전체','절']].map(([step,label,name])=>`<button id="bible-pick-${step}" data-bible-pick="${step}" aria-label="${name} 선택 · ${label}" aria-haspopup="dialog" aria-controls="bible-picker" aria-expanded="false"><span>${label}</span>${icon('chevron')}</button>`).join('')}</nav><button class="icon-btn" data-action="bible-tools" aria-expanded="${bibleTools}" aria-label="말씀 검색과 책갈피">${icon('search')}</button></header>${bibleTools?`<div class="bible-tools"><label class="searchbox">${icon('search')}<input id="bible-search" type="search" aria-label="성경 검색" placeholder="단어 또는 시편 23:2" value="${esc(query)}"></label><button class="text-btn" data-action="bible-saved">${icon('bookmark')} 새긴 말씀</button></div>`:''}<div id="bible-content">${query?searchHTML(query):testament==='saved'?savedBibleHTML():bibleBody()}</div><footer class="bible-footer"><button class="bible-neighbor" data-action="prev-chapter" aria-label="이전 장${prev?' · '+prev.name+' '+chapterLabel(prev.book,prev.chapter):''}" ${prev?'':'disabled'}>${icon('back')}<span>${prev?prev.name+' '+chapterLabel(prev.book,prev.chapter):'처음 말씀'}</span></button><div class="bible-reading-actions">${bibleReadingActions()}</div><button class="bible-neighbor" data-action="next-chapter" aria-label="다음 장${next?' · '+next.name+' '+chapterLabel(next.book,next.chapter):''}" ${next?'':'disabled'}><span>${next?next.name+' '+chapterLabel(next.book,next.chapter):'마지막 말씀'}</span>${icon('chevron')}</button></footer><button id="home-menu-toggle" class="home-menu-z function cloudQueueRecord(r){if(!cloudReady()||!r||r.unsaved||r.discarded)return;cloudQueue.add(r.id);clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudFlush,3000);}
async function cloudFlush(){if(cloudBusy||!cloudReady())return;cloudBusy=true;const map=cloudMap();let n=0;
 try{for(const id of [...cloudQueue]){cloudQueue.delete(id);const r=records.find(x=>x.id===id);if(!r||r.unsaved)continue;await SemiCloud.pushRecord(r,!!r.audio&&!map[id]?.audio);map[id]={audio:!!r.audio||!!map[id]?.audio,at:Date.now()};localPut('pilsa-cloud-sync',map);n++;}if(n)localPut('pilsa-cloud-last',Date.now());}
 catch(e){console.warn('cloud backup',e?.code||e?.message);cloudError(e,true);}
 finally{cloudBusy=false;if(cloudQueue.size){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudFlush,15000);}if(view==='settings')render();}}
function cloudForget(id){const map=cloudMap();if(map[id]){delete map[id];localPut('pilsa-cloud-sync',map);}if(cloudReady())SemiCloud.removeRecord(id).catch(()=>{});}
function cloudStateChanged(key){if(!CLOUD_STATE_KEYS.includes(key)||!cloudReady())return;clearTimeout(cloudStateTimer);cloudStateTimer=setTimeout(cloudPushState,5000);}
function cloudStateSnapshot(){const o={};for(const k of CLOUD_STATE_KEYS){try{const v=localStorage.getItem(k);if(v!=null)o[k]=v;}catch{}}return o;}
async function cloudPushState(){if(!cloudReady())return;try{await SemiCloud.pushState(cloudStateSnapshot());localPut('pilsa-cloud-last',Date.now());}catch(e){console.warn('cloud state',e?.code||e?.message);}}
// 로그인 직후: 클라우드에만 있는 기록은 내려받고, 이 기기에만 있는 기록은 올린다. 이 기기가 비어 있으면 설정·날씨 기록도 받아온다
async function cloudRestore(){cloudRestoring=true;let got=0;
 // 이 기기에서 이 계정의 설정을 받아 온 적이 있으면 다시 받지 않는다(새로고침이 반복되지 않게)
 try{const flag='pilsa-cloud-restored-'+cloudUser.uid,done=(()=>{try{return localStorage.getItem(flag)==='1';}catch{return true;}})(),fresh=!done&&!records.length&&!localGet('pilsa-care-days',[]).length,st=await SemiCloud.pullState();try{localStorage.setItem(flag,'1');}catch{}
  if(st&&fresh){for(const [k,v] of Object.entries(st.data||{}))if(CLOUD_STATE_KEYS.includes(k))try{localStorage.setItem(k,v);}catch{}}
  const remote=await SemiCloud.listRecords(),have=new Set(records.map(r=>r.id)),map=cloudMap();
  for(const r of remote){map[r.id]={audio:!!r.cloudAudio,at:Date.now()};if(have.has(r.id))continue;const {cloudAudio,...rec}=r;if(cloudAudio){try{rec.audio=await SemiCloud.fetchAudio(cloudAudio);}catch{}}await putRecord(rec);syncReadingRecord(rec);got++;}
  localPut('pilsa-cloud-sync',map);if(got)saveLedger();
  cloudRestoring=false;for(const r of records)if(!remote.some(x=>x.id===r.id))cloudQueueRecord(r);if(!st||!fresh)cloudPushState();
  if(st&&fresh){toast('클라우드의 기록을 가져왔어요.');setTimeout(()=>location.reload(),900);return;}
  if(got)toast(`클라우드에서 기록 ${got}개를 가져왔어요.`);}
 catch(e){console.warn('cloud restore',e?.code||e?.message);cloudError(e,true);}
 finally{cloudRestoring=false;render();}}
function cloudOnUser(u){const was=cloudUser?.uid;cloudUser=u;if(u&&u.uid!==was){cloudRestore();if(view==='login')enterToday();}else if(['settings','login'].includes(view))render();}
function cloudError(e,quiet){const c=e?.code||'';const msg=c==='auth/unauthorized-domain'?'이 주소는 아직 로그인 허용 목록에 없어요. 관리자 설정이 필요해요.':c==='auth/operation-not-allowed'?'이 로그인 방식은 아직 준비 중이에요.':c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request'?'':c==='permission-denied'||c==='storage/unauthorized'?'클라우드 보관이 아직 열려 있지 않아요. 관리자 설정이 필요해요.':c==='auth/network-request-failed'?'인터넷 연결을 확인해 주세요.':quiet?'':'로그인하지 못했어요. 잠시 뒤 다시 해 주세요.';if(msg)toast(msg);}

function voiceDays(){const map={},day=t=>dayKey(new Date(t)),get=k=>map[k]||(map[k]={day:k,care:0,scale:0,checks:0,m:null,w:null,comp:[]});
 for(const d of careDays()){const x=get(d.day);if(d.m&&!x.m){x.m=d.m;x.w=d.w;}if(d.done)x.care++;}
 for(const r of records)if(r.kind==='vowel'){const x=get(day(r.ts));x.checks++;if(!x.m&&r.care)x.m=r.care;}
 for(const t of localGet('pilsa-train-log',[])){const x=get(day(t.ts));x.scale++;if(t.scores)x.comp.push(trainComp(t.scores));}
 return map;}
function voiceCondition(x){if(!x?.m)return null;{const e=careDays().find(d=>d.day===x.day&&d.m&&!d.noisy),z=e?healthZone(e):null;if(z){const Z=HEALTH_Z[z];return {w:Z.w,t:Z.t,line:Z.line};}}let w=x.w;if(!w||['noisy','miss'].includes(w)){const dev=localGet('pilsa-care-dev',null),base=VoiceCare.baseline(careDays().filter(d=>(!dev||d.dev===dev)&&d.day!==x.day));w=VoiceCare.judge(x.m,base).w;}
 const C={sun:{t:'좋음',line:'성대가 고르게 울리고 있어요. 평소처럼 연습해요.'},partly:{t:'조금 지침',line:'평소와 조금 달라요. 오늘은 작게, 짧게 연습해요.'},cloud:{t:'쉬어가는 날',line:'평소와 많이 달라요. 오늘은 목을 아끼고 쉬어 주세요.'},learn:{t:'익히는 중',line:'내 평소 목소리를 익히는 중이에요. 며칠 더 재면 비교해 드려요.'}};
 return C[w]?{w,...C[w]}:null;}

 const f=(v,d=1)=>Number.isFinite(v)?v.toFixed(d):'—',chg=(a,b,good,unit,d=1)=>{if(!Number.isFinite(a)||!Number.isFinite(b))return '';const x=a-b;if(Math.abs(x)<(d?0.05:1))return '<small>그대로</small>';const better=good>0?x>0:x<0;return `<small class="${better?'up':'down'}">${x>0?'+':''}${x.toFixed(d)}${unit} ${better?'좋아짐':'나빠짐'}</small>`;};

function detectLivePitch(input,sampleRate){const step=Math.max(1,Math.floor(sampleRate/8000)),rate=sampleRate/step,n=Math.floor(input.length/step),x=new Float32Array(n);let mean=0,power=0;for(let i=0;i<n;i++){let sum=0;for(let j=0;j<step;j++)sum+=input[i*step+j];x[i]=sum/step;mean+=x[i];}mean/=n;for(let i=0;i<n;i++){x[i]-=mean;power+=x[i]*x[i];}if(Math.sqrt(power/n)<.006)return null;const lo=Math.floor(rate/800),hi=Math.ceil(rate/65),w=Math.min(384,n-hi-2);if(w<160)return null;const d=new Float32Array(hi+2);for(let t=1;t<=hi+1;t++){let sum=0;for(let j=0;j<w;j++){const a=x[j]-x[j+t];sum+=a*a;}d[t]=sum;}let run=0;d[0]=1;for(let t=1;t<=hi+1;t++){run+=d[t];d[t]=run?d[t]*t/run:1;}let best=-1;for(let t=lo;t<=hi;t++){if(d[t]<.15){while(t<hi&&d[t+1]<d[t])t++;best=t;break;}}if(best<0)return null;const a=d[best-1],b=d[best],z=d[best+1],den=a-2*b+z,hz=rate/(best+(den?.5*(a-z)/den:0));return hz>=65&&hz<=800?hz:null;}
function matchingPitch(hz,target){return Number.isFinite(hz)&&Number.isFinite(target)&&target>0&&Math.abs(1200*Math.log2(hz/target))<=50;}
function stopTuning(update=false){tuningEpoch++;const t=tuning;tuning=null;if(t){clearInterval(t.timer);try{t.osc?.stop();}catch{}t.stream?.getTracks().forEach(x=>{x.onended=null;x.stop();});t.source?.disconnect();t.an?.disconnect();t.ac?.close().catch(()=>{});}Water.quiet();if(update&&view==='tuning'){if($('target-play'))$('target-play').disabled=false;const button=$('tuning-mic');if(button){button.innerHTML=icon('record');button.setAttribute('aria-label','목표음 따라 부르기 시작');}if($('tuning-guide'))$('tuning-guide').textContent='잠시 멈췄어요. 준비되면 다시 시작하세요.';}}
async function startTuning(){if(tuning||recording||starting)return;if(!await recordingConsent()||view!=='tuning')return;stopGoalTone();voiceProfile={...(voiceProfile||{}),direction:voiceProfile?.direction||'ease',targetHz:goalTarget(),targetSource:'chosen'};localPut('pilsa-voice-profile',voiceProfile);const epoch=++tuningEpoch,t={starting:true,phase:'tone',target:goalTarget(),hold:0,matched:false,last:0};tuning=t;try{t.ac=new (window.AudioContext||window.webkitAudioContext)();await t.ac.resume();prepareCapture();t.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:false,autoGainControl:false}});if(tuning!==t||epoch!==tuningEpoch||view!=='tuning'){t.stream.getTracks().forEach(x=>x.stop());await t.ac.close().catch(()=>{});return;}t.an=t.ac.createAnalyser();t.an.fftSize=4096;t.an.smoothingTimeConstant=0;t.data=new Float32Array(4096);t.source=t.ac.createMediaStreamSource(t.stream);t.source.connect(t.an);t.starting=false;t.stream.getTracks()[0].onended=()=>stopTuning(true);$('pitch-orbit').dataset.phase='tone';$('tuning-label').textContent='목표음을 들어보세요';$('tuning-guide').textContent='듣고 나서 아—';$('target-read').disabled=true;$('target-play').disabled=true;$('tuning-mic').innerHTML=icon('stop');$('tuning-mic').setAttribute('aria-label','음높이 연습 멈추기');t.timer=setInterval(()=>tuningTick(t),70);await playTarget();}catch{if(tuning===t)stopTuning();if(view==='tuning'){$('tuning-guide').textContent='마이크를 허용한 뒤 다시 시작해 주세요.';toast('내 음을 들으려면 마이크가 필요해요.');}}}
function tuningTick(t){if(tuning!==t||t.starting)return;const now=t.ac.currentTime,dt=Math.min(.12,Math.max(0,now-(t.last||now)));t.last=now;if(t.phase==='tone'||now<(t.listenAfter||0))return;t.an.getFloatTimeDomainData(t.data);const hz=detectLivePitch(t.data,t.ac.sampleRate),rms=Math.sqrt(t.data.reduce((a,b)=>a+b*b,0)/t.data.length);Water.voice(t,rms);$('live-hz').innerHTML=(hz?Math.round(hz):'—')+'<small>Hz</small>';if(t.phase==='match'){const cents=hz?1200*Math.log2(hz/t.target):0;$('pitch-cursor').style.left=(50+Math.max(-44,Math.min(44,cents/6)))+'%';const match=matchingPitch(hz,t.target);t.hold=match?t.hold+dt:0;if(!t.matched){if(t.hold>=.9){t.matched=true;voiceProfile.targetHz=t.target;voiceProfile.matchedHz=t.target;voiceProfile.matchedAt=Date.now();localPut('pilsa-voice-profile',voiceProfile);$('pitch-orbit').dataset.phase='matched';$('tuning-label').textContent='이 높이를 찾았어요';$('tuning-guide').textContent='맞았어요. 말씀으로 이어가요.';$('target-read').disabled=false;}else{const text=!hz?'아—로 따라 해주세요.':match?'잠시 유지해 주세요.':cents<0?'조금 높게':'조금 낮게';if($('tuning-guide').textContent!==text)$('tuning-guide').textContent=text;}}}}
async function playTarget(){const t=tuning;if(!t||t.starting)return;try{if(t.osc){t.osc.onended=null;t.osc.stop();t.osc.disconnect();t.gain?.disconnect();}await t.ac.resume();if(tuning!==t)return;t.target=goalTarget();t.phase='tone';t.hold=0;t.matched=false;$('target-read').disabled=true;$('base-hz').textContent=voiceReferenceHz()?Math.round(voiceReferenceHz())+' Hz':'—';$('target-hz').textContent=Math.round(t.target)+' Hz';$('target-hz').dataset.hz=t.target;$('target-play').disabled=false;$('pitch-orbit').dataset.phase='tone';$('tuning-label').textContent='목표음을 들어보세요';$('tuning-guide').textContent='듣고 나서 아—';const osc=t.ac.createOscillator(),gain=t.ac.createGain(),now=t.ac.currentTime;osc.setPeriodicWave(clearToneWave(t.ac));osc.frequency.value=t.target;gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.26,now+.04);gain.gain.setValueAtTime(.26,now+1.1);gain.gain.linearRampToValueAtTime(0,now+1.35);osc.connect(gain);gain.connect(t.ac.destination);t.osc=osc;t.gain=gain;osc.onended=()=>{osc.disconnect();gain.disconnect();if(tuning!==t)return;t.osc=null;t.phase='match';t.listenAfter=t.ac.currentTime+.45;$('pitch-orbit').dataset.phase='match';$('tuning-label').textContent='따라 해보세요';};osc.start();osc.stop(now+1.4);}catch{stopTuning(true);}}
function voiceReferenceHz(){const r=records.find(r=>r.id===voiceProfile?.baselineRecordId&&r.metrics?.pitchMean)||records.find(r=>r.kind==='read'&&r.metrics?.pitchMean);return r?.metrics?.pitchMean||voiceProfile?.referenceHz||null;}
function goalTarget(){return Math.round(Math.max(65,Math.min(600,Number(voiceProfile?.targetHz)||Number(voiceProfile?.referenceHz)||220)));}
function setGoalHz(value){if(!Number.isFinite(value)||value<=0)return;const hz=Math.round(Math.max(65,Math.min(600,value)));voiceProfile={...(voiceProfile||{}),direction:voiceProfile?.direction||'ease',targetHz:hz,targetSource:'chosen'};delete voiceProfile.matchedHz;delete voiceProfile.matchedAt;localPut('pilsa-voice-profile',voiceProfile);if($('goal-range'))$('goal-range').value=hz;if($('goal-hz'))$('goal-hz').value=hz;stopGoalTone();}
function stopGoalTone(){const t=goalTone;goalTone=null;if(t){try{t.osc.stop();}catch{}t.osc.disconnect();t.ac.close().catch(()=>{});}}
async function previewGoalTone(){if(recording||starting)return;stopGoalTone();const ac=new (window.AudioContext||window.webkitAudioContext)(),osc=ac.createOscillator(),gain=ac.createGain(),t={ac,osc};goalTone=t;try{await ac.resume();if(goalTone!==t){await ac.close().catch(()=>{});return;}const now=ac.currentTime;playbackMode();osc.setPeriodicWave(clearToneWave(ac));osc.frequency.value=goalTarget();gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.26,now+.04);gain.gain.setValueAtTime(.26,now+1.1);gain.gain.linearRampToValueAtTime(0,now+1.35);osc.connect(gain);gain.connect(ac.destination);osc.onended=()=>{gain.disconnect();if(goalTone===t)stopGoalTone();};osc.start();osc.stop(now+1.4);}catch{if(goalTone===t)stopGoalTone();toast('다시 눌러 목표음을 들어주세요.');}}
function readAtTarget(){const t=tuning;if($('target-read')?.disabled||!voiceProfile?.matchedHz)return;localPut('pilsa-welcome-done',true);const target=t?.matched?t.target:voiceProfile.matchedHz,direction=voiceProfile.direction;stopTuning();newReading({...todays(),guided:true,targetPitch:target,voiceGoal:direction});}

function nextPassage(p){const vs=chapterVerses(p.book,p.chapter),at=vs.findIndex(v=>v.v===p.verse),b=Bible.find(x=>x.id===p.book);if(at<0||!b)return null;if(at+1<vs.length)return verseInfo(p.book,p.chapter,vs[at+1].v);const cs=Object.keys(b.chapters).map(Number),ci=cs.indexOf(p.chapter);if(ci+1<cs.length)return verseInfo(b.id,cs[ci+1],chapterVerses(b.id,cs[ci+1])[0].v);const next=Bible[Bible.findIndex(x=>x.id===b.id)+1];if(!next)return null;const c=Number(Object.keys(next.chapters)[0]);return verseInfo(next.id,c,chapterVerses(next.id,c)[0].v);}
function startBibleReading(v){if(!v)return;const first=verseInfo(v.book,v.chapter,v.verse||chapterVerses(v.book,v.chapter)[0]?.v);if(first)newReading({...first,continuous:true});}
function makePassage(s,start=0){return {book:s.book,chapter:s.chapter,verse:s.verse,ref:s.ref,text:s.text,start,end:null,voiceSeconds:0,completed:false};}
function closePassage(s,end){const p=s.passages?.at(-1);if(!p||p.end!==null)return;p.end=Math.max(p.start,end);p.completed=p.voiceSeconds>=.35&&p.end-p.start>=.65;}
function continuousSummary(s){const ps=s.passages||[],heard=ps.filter(p=>p.completed),shown=heard.length?heard:ps,first=shown[0],last=shown.at(-1);if(!first)return {ref:s.ref,text:s.text};const same=first.book===last.book&&first.chapter===last.chapter;return {ref:shown.length===1?first.ref:same?`${Bible.find(b=>b.id===first.book).name} ${chapterLabel(first.book,first.chapter)} ${first.verse}–${last.verse}절`:`${first.ref} — ${last.ref}`,text:shown.map(p=>p.text).join(' ')};}
function advanceReading(at){const r=recording,s=r?.session,p=s?.passages?.at(-1);if(!s?.continuous||r.stopping||!p||p.voiceSeconds<.35)return;const next=nextInSession(s);if(!next)return;const now=r.ac.currentTime-r.captureAt,elapsed=Number.isFinite(at)?Math.min(now,at):now;if(elapsed-p.start<.65)return;r.autoNext=null;closePassage(s,elapsed);Object.assign(s,next);s.reading={lit:[],cursor:0,complete:false};s.passages.push(makePassage(s,elapsed));session=s;render();document.querySelector('[data-action="next-verse"]')?.focus({preventScroll:true});}
// 이어 읽기: 음성인식이 절 끝을 들으면 그 뒤 첫 숨 쉬는 틈(무음)을 경계로 다음 절로 넘긴다.
function verseEndWord(s,words){const tail=norm(s.text).slice(-6);for(let i=words.length-1;i>=0;i--){const w=norm(words[i].text||'');if(w&&tail.includes(w.slice(-2)))return words[i];}return null;}
function armAutoNext(r,result,words){const s=r?.session;if(!s?.continuous||r.stopping||r.autoNext||!result||!nextInSession(s))return;const total=norm(s.text).length,lit=new Set(result.lit||[]);if(!(lit.has(total-1)||lit.has(total-2))||lit.size/Math.max(1,total)<.6)return;const now=r.ac.currentTime-r.captureAt,w=verseEndWord(s,words);r.autoNext={verse:`${s.book}:${s.chapter}:${s.verse}`,after:w?Math.min(now,w.end??w.start+.35):now-.4,armed:now};}
function tickAutoNext(r,t,silent){if(silent){if(!r.silence)r.silence={start:t,end:null};}else if(r.silence){r.silence.end=t;if(r.silence.end-r.silence.start>=.18)(r.pauses||(r.pauses=[])).push(r.silence);if(r.pauses?.length>40)r.pauses.shift();r.silence=null;}const a=r.autoNext,s=r.session;if(!a)return;if(a.verse!==`${s.book}:${s.chapter}:${s.verse}`){r.autoNext=null;return;}const open=r.silence&&t-r.silence.start>=.25?r.silence:null,pause=[...(r.pauses||[]),...(open?[open]:[])].find(p=>(p.end??t)>=a.after&&p.start>=a.after-.3);if(pause){r.autoNext=null;advanceReading(Math.max(a.after,(pause.start+(pause.end??t))/2));return;}if(t-a.armed>1.6){r.autoNext=null;advanceReading(Math.min(t,a.after+.25));}}
function openScriptReading(){const d=$('dialog'),draft=localGet('pilsa-script-draft',{title:'',text:''});d.onclose=null;d.classList.remove('reading-check-dialog');d.innerHTML=`<div class="dialog-body script-dialog"><h2>원고 읽기</h2><p class="small muted">대표기도문·설교문·낭독할 글을 붙여 넣고 소리 내어 연습해요. 원고는 이 기기에만 저장돼요.</p><input id="script-title" maxlength="40" placeholder="제목 (예: 주일 대표기도)" value="${esc(draft.title||'')}"><textarea id="script-text" maxlength="4000" rows="9" placeholder="여기에 원고를 붙여 넣거나 적어 주세요">${esc(draft.text||'')}</textarea><div class="row"><button class="secondary" data-action="close-dialog">닫기</button><button class="primary" data-action="start-script">${icon('record')} 이 원고 읽기</button></div><p class="small muted">한 번에 최대 5분까지 녹음돼요.</p></div>`;if(!d.open)d.showModal();$('script-text').focus();}

function renderWelcomeResult(r,waiting){return `<div class="focus-shell welcome-result"><div class="page-head"><span class="eyebrow">나의 첫 목소리</span><h1>${waiting?'목소리 분석 중':'내 목소리'}</h1><p>${waiting?'목소리는 안전하게 남겼어요. 잠시만 기다려주세요.':esc(r.voiceMetrics?BetaVoice.summary(r):voiceOneLine(r))}</p></div>${waiting?'<div class="status-banner"><span class="loading"></span>높이와 소리의 결을 살펴보고 있어요.</div>':metricCards(r)}${!waiting&&!r.voiceMetrics?'<div class="coach-card"><p>녹음은 간직했어요. 연결이 돌아오면 다시 살펴볼 수 있어요.</p><button class="text-btn" data-action="reanalyze">다시 살펴보기</button></div>':''}${audioHTML(r,'처음 만난 내 목소리')}<div class="focus-actions"><button class="primary" data-action="finish-welcome" ${waiting?'disabled':''}>오늘의 말씀 읽기 ${icon('arrow')}</button><button class="secondary" data-nav="bible">성경 이어 읽기</button><button class="text-btn" data-nav="journal">내 기록</button></div></div>`;}

function voiceOverview(){const latest=records.find(r=>r.kind==='read'&&r.audio),m=latest?.metrics;return `<section class="voice-overview"><div class="row between"><span class="eyebrow">나의 목소리</span><span class="small muted">${latest?dateText(latest.ts)+' 기준':'첫 목소리를 기다려요'}</span></div><h2>${esc(voiceOneLine(latest))}</h2>${m?.summaryVersion===12&&m.pitchBands&&Number.isFinite(m.pitchMean)?`<div class="voice-facts"><span>평균 높이 <strong>${Math.round(m.pitchMean)} Hz</strong></span><span>소리의 결 <strong>${m.stability==='steady'?'비교적 안정':m.stability==='variable'?'조금 불규칙':'측정 보류'}</strong></span></div>`:''}${latest?`<button class="text-btn" data-voice-record="${esc(latest.id)}">자세히 보기 ${icon('arrow')}</button>`:'<button class="text-btn" data-action="start-welcome">첫 목소리 알아보기 '+icon('arrow')+'</button>'}</section>`;}
function journalProgress(){if(!Bible.length)return '';const total=planStats(PLANS.find(p=>p.id==='bible')),seen=new Set(),recent=records.filter(r=>r.kind==='read'&&r.book&&(!r.guided||r.published)).filter(r=>{if(seen.has(r.book))return false;seen.add(r.book);return true;}).slice(0,3);return `<section class="journal-progress"><div class="section-label"><h2>읽기 현황</h2><button class="text-btn" data-nav="challenge">읽기표 ${icon('arrow')}</button></div><div class="reading-total"><div class="row between"><h3>성경 1독</h3><span>${total.done} / ${total.total}장</span></div><div class="plan-meter" role="progressbar" aria-label="성경 통독 완료 장" aria-valuemin="0" aria-valuemax="${total.total}" aria-valuenow="${total.done}"><i style="width:${total.percent}%"></i></div><p>${total.verses.toLocaleString()}절 읽음</p></div>${recent.length?`<h3 class="subtle-heading">이어서 읽기</h3><div class="continuing-books">${recent.map(r=>{const last=r.passages?.filter(p=>p.completed).at(-1),v=last?nextPassage(last)||verseInfo(last.book,last.chapter,last.verse):verseInfo(r.book,r.chapter,r.verse);return `<button data-reference="${v.book}:${v.chapter}:${v.verse||0}"><span>${esc(v.ref)}<small>최근 기록 · ${esc(r.ref)}</small></span>${icon('arrow')}</button>`;}).join('')}</div>`:''}<h3 class="subtle-heading">챌린지</h3><div class="journal-plans">${PLANS.filter(p=>p.id===challengePlan||planStats(p).verses>0).map(p=>{const st=planStats(p);return `<button data-plan="${p.id}"><span><strong>${p.name}</strong><small>${st.done} / ${st.total}장 · ${st.verses}절</small></span><span class="mini-progress">${st.percent}% ${icon('chevron')}</span></button>`;}).join('')}</div></section>`;}
function passageAudioHTML(r){if(!r.continuous||!r.passages?.length)return '';const read=r.passages.filter(p=>p.completed);return `<details class="record-passages"><summary>함께 읽은 ${read.length}절 · 구절별 듣기</summary><div>${r.passages.map((p,i)=>`<button data-passage-audio="${i}"><span>${p.completed?icon('check'):icon('wave')}${esc(p.ref)}</span><small>${duration(p.start)}</small></button>`).join('')}</div><p class="small muted">‘다음’ 또는 녹음 종료로 마친 절을 표시했어요. 읽기표에서 수정할 수 있어요.</p></details>`;}
function newReading(v,kind='read',baseline=null){if(recording||starting){toast('녹음 중인 목소리로 먼저 돌아갈게요.');go('reading');return;}session={...v,kind,attempt:crypto.randomUUID(),reading:{lit:[],cursor:0,complete:false},take:baseline?2:1,baseline:baseline?.id||null,group:baseline?.group||crypto.randomUUID()};go('reading');}
function renderReading(){if(!session){session={...todays(),kind:'read',take:1,group:crypto.randomUUID(),attempt:crypto.randomUUID(),reading:{lit:[],cursor:0,complete:false}};}const s=recording?.session||session,isPray=['prayer','memo'].includes(s.kind),vowel=s.kind==='vowel',active=!!recording,busy=starting||recording?.stopping;return `<div class="focus-shell reading-immersive" aria-label="목소리 녹음">${!active&&!starting?`<div class="reading-utilities"><button class="icon-btn" data-nav="${s.onboarding?'welcome':s.continuous?'bible':s.kind==='memo'?'journal':isPray?'prayer':'today'}" aria-label="돌아가기">${icon('back')}</button>${!vowel&&!s.continuous?`<button class="icon-btn" data-action="import-audio" aria-label="녹음 파일로 남기기">${icon('download')}</button>`:''}</div>`:''}<section class="water-card focus-card ${s.continuous?'bible-turn':''}" ${s.continuous?'data-turn="forward"':''}>${isPray?(active?'<div class="quiet-prompt space-only" aria-hidden="true"></div>':`<h1 class="quiet-prompt">${s.kind==='memo'?'마음을 담아요':'오늘의 기도'}</h1>`):vowel?`<p class="verse-text">아—</p>${!active?'<p class="vowel-hint">편안한 높이로 5초</p>':''}`:`<p class="verse-text ${s.text.length>160?'long':''}" id="reading-verse">${readingMarkup(s)}</p><p class="verse-ref">${esc(s.ref)}</p>${s.targetPitch&&!active?`<p class="target-reading-note">기억할 시작음 ${Math.round(s.targetPitch)} Hz<br>말의 높낮이는 편안하게 이어가세요.</p>`:''}`}</section>${!active&&!starting&&s.kind!=='vowel'?DeviceSpeech.browserHelp()+DeviceSpeech.hint(true):''}<div class="record-area"><div class="continuous-controls"><button class="record-button ${active?'recording':''}" data-action="toggle-record" aria-label="${recording?.stopping?'목소리 저장 중':starting?'마이크 준비 중':active?'녹음 마치기':'녹음 시작'}" ${busy?'disabled':''}>${icon(active?'stop':'record')}</button>${s.continuous&&active&&nextInSession(s)?`<button class="secondary next-verse" data-action="next-verse" ${busy||(s.passages?.at(-1)?.voiceSeconds||0)<.35?'disabled':''}>다음 ${icon('arrow')}</button>`:''}</div>${s.continuous?`<p class="continuous-hint">${active?'':s.onboarding?'':(DeviceSpeech.enabled&&settings.transcribe?'읽으면 다음 절로 저절로 넘어가요 · 최대 20분':'다음을 누르며 이어 읽어요 · 설정에서 문장 인식을 준비하면 저절로 넘어가요')}</p>`:''}<p id="bible-speech-status" class="small muted" aria-live="off"></p><div id="record-timer" class="timer" ${!active?'hidden':''}>${active?duration((Date.now()-recording.started)/1000):'00:00'}</div><span class="sr-only" role="status">${recording?.stopping?'목소리를 저장하고 있어요':starting?'마이크를 준비하고 있어요':active?'녹음 중':''}</span></div><input type="file" id="audio-file" accept="audio/*" hidden></div>`;}

function pitchComparison(hz,mean){const steps=12*Math.log2(hz/mean);return Math.abs(steps)<=1?'비슷해요':steps>0?'높아요':'낮아요';}
function metricCards(r){return BetaVoice.details(r);}
function validResonance(x){return !!x&&x.version===1&&x.profile==='touchingvoice-a-20260913'&&['male','female'].includes(x.preset)&&['ready','short','uncertain','clipped','bandwidth'].includes(x.status)&&Number.isInteger(x.frames)&&x.frames>=0&&x.frames<=31000&&Number.isFinite(x.voicedSeconds)&&x.voicedSeconds>=0&&x.voicedSeconds<=1240&&(x.status==='ready'?['nas','oro','aes','src'].every(k=>Number.isFinite(x.levels?.[k])&&x.levels[k]>=0&&x.levels[k]<=100)&&['upperFocus','middleFocus','lowerFocus','frictionFocus'].every(k=>Number.isFinite(x.features?.[k])&&x.features[k]>=-120&&x.features[k]<=0):x.levels===null&&x.features===null);}
function resonanceFeedback(r){const m=r?.metrics,x=m?.resonance;if(m?.silent||m?.uncertain||m?.clipped||!validResonance(x)||x.status!=='ready')return null;const {nas,oro,aes,src}=x.levels,spread=Math.max(nas,oro,aes)-Math.min(nas,oro,aes);if(spread>=30){if(nas>=oro&&nas>=aes)return {title:'둥근 울림도 더해봐요.',tip:'‘으—’ 한 번, 그 느낌으로 다시 읽어요.'};if(aes>=nas&&aes>=oro)return {title:'밝은 울림도 더해봐요.',tip:'‘에—’ 한 번, 그 느낌으로 다시 읽어요.'};return {title:'울림을 넓혀봐요.',tip:'‘에—아—으—’를 편하게 번갈아 내봐요.'};}if(src>=70||src<=20)return {title:'소리의 결도 느껴봐요.',tip:'‘하—아—’를 번갈아 내며 편한 소리를 찾아요.'};return {title:'여러 울림을 함께 써봐요.',tip:'‘에—아—으—하—’를 힘주지 않고 내봐요.'};}
function tonePractice(r){const feedback=resonanceFeedback(r),raw=r?.metrics?.resonance,x=validResonance(raw)?raw:null,ready=x?.status==='ready',rows=[['nas','높은 울림','고음 · 밝은 소리'],['oro','말소리','중음 · 평소 말하는 소리'],['aes','깊은 울림','저음 · 둥글고 풍성한 소리'],['src','소리의 결','또렷함 · 숨 섞임']];return `<div class="tone-practice resonance-guide"><div class="row between"><h3>01 · 목소리의 울림</h3><span class="small muted">${ready?'이번 녹음의 참고 반응':'네 가지 소리'}</span></div><div class="resonance-rows">${rows.map(([key,label,hint])=>`<div class="resonance-row"><div><strong>${label}</strong><small>${hint}</small></div>${ready?`<div class="resonance-meter"><span class="resonance-track" role="img" aria-label="${label}: ${x.levels[key]<30?'적게':x.levels[key]>70?'많이':'중간 정도'} 잡힘"><i style="width:${x.levels[key]}%"></i></span><small>${x.levels[key]<30?'적게':x.levels[key]>70?'많이':'중간'}</small></div>`:'<span class="muted" aria-label="측정 전">—</span>'}</div>`).join('')}</div>${feedback?`<p class="resonance-practice">${esc(feedback.tip)}</p>`:''}${!ready?`<p class="resonance-status">${!x?'이 녹음의 울림도 살펴볼까요?':x.status==='bandwidth'?'이 파일은 높은 소리가 잘려 있어요.':x.status==='clipped'?'소리가 너무 크게 녹음됐어요.':'또렷한 목소리가 조금 더 필요해요.'}</p>`:''}${!x&&r?.audio?'<button class="text-btn" data-action="refresh-resonance">울림 살펴보기</button>':''}<details class="resonance-method"><summary>소리 느낌 알아보기</summary><p>높은 울림(상인두) · 앵앵하면 둥근 소리도 더해요.<br>말소리(중인두) · 밝고 깊은 소리도 함께 써요.<br>깊은 울림(하인두) · 웅웅하면 밝은 소리도 더해요.<br>소리의 결(성대마찰) · 또렷함과 숨 섞임을 느껴요.</p><p>한 가지 소리만 쓰지 않도록 돕는 연습이에요. 막대는 각각의 참고 반응으로, 점수나 사용 비율이 아니에요.</p></details></div>`;}
function coaching(r){const m=r?.metrics;if(!m)return {title:'목소리는 잘 남아 있어요.',tip:'편안한 마음으로 내 목소리를 한 번 들어보세요.',why:'정밀 분석을 마치지 못했어요. 다시 분석하거나 기도로 이어갈 수 있어요.'};if(m.silent||m.uncertain)return {title:'조금 더 또렷하게 읽어주세요.',tip:'휴대폰을 30cm 앞에 두고 조용한 곳에서 다시 읽어보세요.',why:'분명한 말소리가 충분하지 않아 목소리를 판단하지 않았어요.'};if(m.clipped)return {title:'소리가 마이크에 조금 크게 닿았어요.',tip:'마이크와 조금 거리를 두고 편안한 크기로 읽어보세요.',why:'소리가 잘린 부분이 있어 이번 수치로는 변화를 판단하기 어려워요.'};const feedback=resonanceFeedback(r);if(feedback)return {...feedback,why:'터칭보이스의 소리 표본을 참고한 연습 안내예요.'};if(m.stability==='variable')return {title:'힘을 덜어도, 목소리는 충분히 닿아요.',tip:'휴대폰을 30cm 앞에 두고, 편안한 크기로 다시 읽어보세요.',why:'이번 녹음에는 소리가 고르지 않은 부분이 있었어요. 조용한 곳에서 한 번 더 들어볼까요?'};return {title:'오늘의 목소리, 그대로 간직해요.',tip:'숨을 편안히 들이쉬고, 마음에 닿는 말씀을 한 번 더 읽어보세요.',why:'내 목소리를 다시 듣고, 편안하게 이어지는 느낌을 기억해보세요.'};}
function detailsHTML(r){const m=r.metrics;const fmt=(x,u='')=>x==null?'측정하지 않음':Number(x).toFixed(2)+u;return `<details class="details"><summary>목소리를 어떻게 살펴보나요?</summary><p>터칭보이스의 상인두·중인두·하인두·성대마찰 소리 표본에서 찾은 주파수 특징을 비교해요. 네 막대는 각각 따로 반응해요. 합계 100%나 똑같은 길이가 목표는 아니에요. 실제 신체 위치·근육 발달·호흡량을 측정한 값은 아니에요.</p>${validResonance(m?.resonance)?`<p>분석 기준: ${m.resonance.preset==='female'?'여성':'남성'} ‘아—’ 표본 · 2026.09.13. ${m.resonance.voicedSeconds.toFixed(1)}초의 또렷한 목소리를 참고했어요. 소수의 표본으로 만든 연습용 기준으로, 사람·모음·마이크에 따라 달라져요.</p><button class="text-btn" data-action="refresh-resonance">현재 기준으로 다시 살펴보기</button>`:''}<p>별도의 음높이 분포는 기본주파수(F0)를 150Hz 미만, 150–250Hz 미만, 250Hz 이상으로 나눈 말한 시간의 비율이에요. 합계가 100%가 되도록 반올림하며, 이 수치로 울림의 균형을 평가하지 않아요.</p><p>음높이는 한국어 낭독 연구(표화영 외, 2002)의 20–39세 성인 120명 평균인 남성 120.8Hz·여성 217.1Hz와 비교해요. ±1반음 이내는 비슷하다고 표현해요. 모든 연령의 기준이나 목표 음높이는 아니에요. <a href="https://www.dbpia.co.kr/journal/articleDetail?nodeId=NODE00148121" target="_blank" rel="noopener">참고 연구</a></p><p>안정성은 목소리가 잡힌 구간의 소리 규칙성(HNR)을 참고해요. 15dB 이상은 비교적 안정적, 5–15dB 미만은 고르지 않은 부분으로 표현하는 앱의 연습용 기준이에요. 임상적으로 검증한 판정은 아니며, 억양의 크기나 성대 건강을 평가하지 않아요. 짧거나 불분명한 녹음은 판단을 보류해요. <a href="https://praat.org/manual/Harmonicity.html" target="_blank" rel="noopener">측정 방법</a></p>${m?`<div style="overflow-x:auto"><dl><dt>음높이의 가운데 (F0)</dt><dd>${fmt(m.pitch,' Hz')}</dd><dt>높낮이 폭</dt><dd>${fmt(m.rangeST,' 반음')}</dd><dt>끝에서 작아진 정도</dt><dd>${fmt(m.endDrop,' dB')}</dd><dt>읽는 속도</dt><dd>${fmt(r.rate,' 음절/초')}</dd><dt>목소리 구간의 규칙성 (HNR)</dt><dd>${fmt(m.voicedHNR??m.hnr,' dB')}</dd><dt>모음의 울림 (포먼트 F1 · F2 · F3)</dt><dd>${m.formants?m.formants.map(v=>v==null?'—':Math.round(v)).join(' · ')+' Hz':'측정하지 않음'}</dd><dt>주기의 미세한 흔들림 (지터)</dt><dd>${fmt(m.jitter,' %')}</dd><dt>크기의 미세한 흔들림 (시머)</dt><dd>${fmt(m.shimmer,' %')}</dd></dl></div><p>${esc(m.engine||'브라우저 기본 분석')} · ${r.stt==='ok'?'Whisper '+esc(r.model||'turbo')+' 한국어 인식':r.stt==='browser'?'브라우저 인식':'글 옮기기 결과 없음'}</p>`:''}<p>낭독에는 억양과 자음이 섞여 있어 지터·시머로 안정도를 매기지 않아요. 아래 ‘목소리 더 알아보기’에서 편안한 ‘아—’를 녹음하면 두 값을 살펴볼 수 있어요. 포먼트는 모음·사람마다 달라 높고 낮음으로 좋고 나쁨을 나누지 않아요.</p></details>`;}
function renderResult(){const r=records.find(x=>x.id===resultId);if(!r)return '<div class="empty">기록을 찾지 못했어요.</div>';const base=records.find(x=>x.id===r.baseline),waiting=analyzing.has(r.id)&&!r.voiceMetrics;if(r.onboarding&&!localGet('pilsa-welcome-done',false))return renderWelcomeResult(r,waiting);return `<div class="focus-shell result-flow"><div class="focus-nav"><button class="icon-btn" data-nav="today" aria-label="오늘">${icon('back')}</button><span class="small muted">${esc(r.ref)}</span><button class="icon-btn" data-nav="journal" aria-label="기록">${icon('journal')}</button></div><details class="voice-disclosure"><summary><span>${icon('wave')} 내 목소리</span>${icon('chevron')}</summary><div class="voice-disclosure-body">${metricCards(r)}${audioHTML(r,'내 목소리')}${base?audioHTML(base,'처음 목소리'):''}</div></details>${base?BetaVoice.comparison(base,r):BetaVoice.advice(r)}${commentaryHTML(r)}<div class="focus-actions result-actions">${r.kind==='vowel'?`<button class="secondary" data-action="vowel">${icon('record')} 다시 측정하기</button><button class="primary" data-action="keep-result">${icon('check')} 저장하기</button>`:`<button class="secondary" data-action="read-again">${icon('record')} 다시 읽기</button><button class="secondary" data-action="share-take">${icon('share')} 공유하기</button><button class="primary" data-action="keep-result">${icon('check')} 저장하기</button>${!r.guided||r.take===2?`<button class="primary" data-action="pray-after">기도하기 ${icon('arrow')}</button>`:''}`}</div></div>`;}

function audioHTML(r,title){return r.audio?`<div class="audio-card"><div class="audio-info"><span class="audio-emblem">${icon('wave')}</span><span>${esc(title)}<small>${duration(r.duration||0)} · ${r.ts?new Date(r.ts).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):''}</small></span><span class="voice-kept">${r.unsaved?'저장 안 됨':'기기에 저장됨'}</span></div><audio controls preload="metadata" src="${audioURL(r)}" aria-label="${esc(title)} 다시 듣기"></audio></div>`:'';}
function comparisonHTML(a,b){let note='같은 말씀을 읽은 두 목소리를 번갈아 들어보세요.';if(a.metrics&&!a.metrics.silent&&!a.metrics.clipped&&b.metrics&&!b.metrics.silent&&!b.metrics.clipped&&a.accuracy>=.7&&b.accuracy>=.7){if(a.metrics.endDrop!=null&&b.metrics.endDrop!=null){const delta=a.metrics.endDrop-b.metrics.endDrop;note=delta>2?'이번에는 문장 끝에서 소리가 작아지는 정도가 줄었어요.':delta< -2?'이번에는 문장 끝이 더 작아졌어요. 두 목소리를 들으며 편안했던 쪽을 기억해보세요.':'끝맺음의 크기는 비슷하게 이어졌어요. 내 몸이 더 편안했던 순간을 떠올려보세요.';}}return `<div class="compare">${audioHTML(a,'처음 읽은 목소리')}${audioHTML(b,'다시 읽은 목소리')}</div><p class="record-note">${note}<br>같은 기기·거리에서도 작은 차이는 생길 수 있어요.</p>`;}
function renderVowelResult(r,waiting){return `<div class="focus-shell"><button class="text-btn" data-nav="journal">${icon('back')} 나의 기록</button><div class="feedback-title"><div class="completed-icon">${icon('record')}</div><h1>${waiting?'짧은 목소리를 살펴보고 있어요':'작은 소리 속, 나만의 결'}</h1><p>편안하게 이어낸 ‘아—’를 담았어요.</p></div>${audioHTML(r,'나의 아— 목소리')}${waiting?'<div class="loading"></div>':metricCards(r)+detailsHTML(r)}<div class="focus-actions"><button class="primary" data-action="vowel">${icon('record')} 한 번 더 담기</button><button class="secondary" data-nav="journal">기록에서 다시 듣기</button></div></div>`;}
function renderPrayer(){const draft=localGet('pilsa-prayer-draft',''),parent=prayerParent(),reflection=reflectionFor(parent).note?.[3];return `<div class="page-head"><div class="eyebrow">LET YOUR HEART SPEAK</div><h1>기도</h1><p>${parent?.guided?'두 번째 목소리를 담았어요. 기도로 오늘의 말씀을 마무리해요.':'어떤 마음이어도 괜찮아요. 당신의 이야기를 남겨주세요.'}</p></div>${parent?`<p class="verse-ref">${esc(parent.ref)}</p>`:''}<div class="prayer-layout"><section class="water-card"><div class="water-label">${icon('prayer')} 오늘 나의 기도</div><h2 class="prayer-prompt">오늘의 기도</h2><p class="context-text muted prayer-reflection">${esc(reflection||'오늘 하나님께 드리고 싶은 말을 남겨보세요.')}</p><button class="primary" data-action="record-prayer">${icon('record')} 목소리로 기도하기</button><p class="water-foot">침묵도 기도의 일부니까, 서두르지 않아요.</p></section><div class="stack"><section class="writing-card"><div class="eyebrow">WORDS FROM WITHIN</div><h3>글로 남겨도 좋아요</h3><textarea id="prayer-note" maxlength="10000" placeholder="하나님, 오늘 제 마음은…" aria-label="오늘의 기도 글">${esc(draft)}</textarea><button class="secondary full" data-action="save-prayer-note">${icon('check')} 아멘, 마음 남기기</button></section>${!parent?.guided?`<button class="text-btn" data-action="record-memo">${icon('record')} 자유로운 음성 메모 남기기</button>`:''}</div></div><p class="cloud-note">${icon('shield')} 나의 기도는 이 브라우저에 보관해요. 기도에는 평가나 점수를 매기지 않아요.</p>`;}

function editDistance(a,b){let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[b.length];}
function textAccuracy(a,b){a=norm(a);b=norm(b);return a&&b?Math.max(0,1-editDistance(a,b)/b.length):null;}
// Align a recognized window to nearby scripture, retaining only actually matched syllables.
// ponytail: bounded edit-distance alignment; use word timestamps if multilingual tracking is added.
function readingMatch(heard,target,cursor=0){
 const a=norm(heard).slice(-140),full=norm(target),start=Math.max(0,cursor-155),b=full.slice(start,cursor+150);
 if(a.length<3||!b.length)return [];
 const rows=[Uint16Array.from({length:b.length+1},()=>0)];
 for(let i=1;i<=a.length;i++){const row=new Uint16Array(b.length+1);row[0]=i;for(let j=1;j<=b.length;j++)row[j]=Math.min(rows[i-1][j]+1,row[j-1]+1,rows[i-1][j-1]+(a[i-1]===b[j-1]?0:1));rows.push(row);}
 let end=1;const expected=cursor-start+a.length*(cursor ? .25 : 1);for(let j=2;j<=b.length;j++)if(rows[a.length][j]<rows[a.length][end]||(rows[a.length][j]===rows[a.length][end]&&Math.abs(j-expected)<Math.abs(end-expected)))end=j;
 if(rows[a.length][end]/a.length>.34)return [];
 let i=a.length,j=end,found=[];while(i>0&&j>0){const same=a[i-1]===b[j-1];if(rows[i][j]===rows[i-1][j-1]+(same?0:1)){if(same)found.push(start+j-1);i--;j--;}else if(rows[i][j]===rows[i-1][j]+1)i--;else j--;}
 found.reverse();if(found.length<3||found.length/a.length<.66||found[0]>cursor+6)return [];
 return found;
}
function trackReading(s,heard){
 if(s.kind!=='read')return;
 const p=s.reading||(s.reading={lit:[],cursor:0,complete:false});if(p.lastHeard===norm(heard))return p;const found=readingMatch(heard,s.text,p.cursor);p.lastHeard=norm(heard);
 if(!found.length)return p;
 p.lit=[...new Set([...p.lit,...found])].sort((a,b)=>a-b);p.cursor=Math.max(p.cursor,found.at(-1)+1);
 const total=norm(s.text).length;p.ratio=p.lit.length/Math.max(1,total);
 p.complete=p.complete||p.ratio>=.90&&p.lit.includes(0)&&p.lit.includes(1)&&p.lit.includes(total-1)&&p.lit.includes(total-2);
 return p;
}

  else if(st.kind==='i1hold'){careGo(r,{phase:'go',step:'i1hold'});await careVoiced(r,CT(4),CT(9),({L,hz,v})=>Number.isFinite(r.hz)&&hz>r.hz*Math.pow(2,3/12)?'조금 낮게, 편한 음 근처에서':careLoud(r,L)?'조금 더 작게':v>0?`좋아요 · ${Math.max(0,Math.ceil(CT(4)-v))}초`:'편한 음, 작게 ‘이~’');}
  else if(st.kind==='i2'){careGo(r,{phase:'go',step:'i2'});careCap(r,true);let n=0,sil=1,on=false;await careListen(r,CT(6),({hz,dt})=>{if(hz){if(!on&&sil>=.08)n++;on=true;sil=0;}else{on=false;sil+=dt;}careUI(r,{progress:n/5,msg:n?`통통 · ${n}/5`:'짧게 ‘이’'});return n>=5&&sil>=.3;});careCheck(r);e.i2n=n;e.hf=VoiceCare.analyze(careCap(r,false),r.ac.sampleRate,{noise:r.noise}).hf;}

async function careStart(){if(Care.run||Train.state!=='idle'||recording||starting)return;if(!await recordingConsent()||view!=='train')return;const r={phase:'prep',step:'measure',chunks:[],nodes:[],capturing:false,stop:false,msg:'마이크를 준비하고 있어요'};Care.run=r;render();

// ───────── 목소리 건강 (훈련 뒤 분석 · 비진단 웰니스) ─────────
// 기준 문서: 앱반영_목소리건강_스크리닝_v1 · 터칭보이스_병원연결_원칙과_의료법 (2026-10-20)

// 환산: Praat CPPS ≈ 3.5 + 0.48 × 앱 값 (2026-10-03 스튜디오·아이폰 동시녹음 36개로 맞춤, r 0.67, 오차 ±0.6dB).
// 아이폰 건강 평균이 Praat 8.4라 '주의(8.5 미만)' 경계는 절대값으로 쓰지 않고, 박재홍 앵커(6.5)가 걸리는 '문제(7.0 미만)'만 안전망으로 쓴다.
// 병명은 말하지 않는다. 하루값으로는 병원을 안내하지 않는다. 측정값을 병원으로 보내지 않는다.
const HEALTH_SCALE={cpps:{healthy:8.5,problem:7.0},cal:{a:3.5,b:.48},loadDrop:1.5};
const HEALTH_Z={good:{t:'건강',w:'sun',line:'오늘 목소리가 또렷하고 안정적이에요.'},caution:{t:'주의',w:'partly',line:'오늘은 목소리가 조금 지쳐 있어요. 물 자주 드시고 무리한 발성은 피해보세요.'},rest:{t:'쉼 필요',w:'cloud',line:'오늘 목소리에 쉰 느낌이 있어요. 목을 충분히 쉬어주세요.'},learn:{t:'익히는 중',w:'learn',line:'내 평소 목소리를 익히는 중이에요. 7일 동안 재면 그때부터 평소와 비교해 드려요.'}};
const Z_RANK={good:0,learn:0,caution:1,rest:2};
const cppsPraat=v=>Number.isFinite(v)?HEALTH_SCALE.cal.a+HEALTH_SCALE.cal.b*v:null;
function healthLoad(e){return Number.isFinite(e?.after?.cpps)&&Number.isFinite(e?.m?.cpps)&&e.m.cpps-e.after.cpps>=HEALTH_SCALE.loadDrop;}
function healthZone(e){if(!e?.m||e.noisy)return null;let z={sun:'good',partly:'caution',cloud:'rest'}[e.w]||'learn';

// 추세(이 기기 기록만): 주의 = 최근 14일 측정의 60% 이상이 주의·쉼 필요, 2주 가까이 이어짐
// 진료 안내 = 최근 28일 60% 이상 + 4주 이어짐(미국 이비인후과 진료지침 4주) 또는 최근 14일 60% 이상 '쉼 필요' + 2주 이어짐

async function importBackup(file){if(!file)return;if(file.size>150*1024*1024){toast('150MB 이하의 백업을 선택해 주세요.');return;}try{const data=JSON.parse(await file.text());if(data.app!=='touchingvoice-pilsa'||data.version!==1||!Array.isArray(data.records)||data.records.length>5000)throw new Error('format');const clean=[];for(const item of data.records){if(typeof item.id!=='string'||item.id.length>80||!Number.isFinite(item.ts)||!['read','prayer','memo','note','vowel'].includes(item.kind)||['ref','text','heard','note'].some(k=>item[k]!=null&&(typeof item[k]!=='string'||item[k].length>100000)))throw new Error('record');const {audioBase64,...r}=item;if(r.continuous){if(r.kind!=='read'||!Array.isArray(r.passages)||r.passages.length>2000||!Number.isFinite(r.duration)||r.duration<=0)throw new Error('passages');let end=0;for(const p of r.passages){if(!p||!chapterVerses(p.book,p.chapter).some(v=>v.v===p.verse)||!Number.isFinite(p.start)||!Number.isFinite(p.end)||p.start<end||p.end<p.start||p.end>r.duration||typeof p.completed!=='boolean'||typeof p.ref!=='string'||p.ref.length>200||typeof p.text!=='string'||p.text.length>5000)throw new Error('passage');end=p.end;}}if(item.metrics!=null){if(typeof item.metrics!=='object')throw new Error('metrics');for(const k of ['jitter','shimmer','pitch','pitchMean','voicedHNR','hnr','endDrop','rangeST','duration','speechDuration'])if(item.metrics[k]!=null&&!Number.isFinite(item.metrics[k]))throw new Error('metrics');if(item.metrics.resonance!=null&&!validResonance(item.metrics.resonance))throw new Error('resonance');if(item.metrics.pitchBands!=null&&(['low','mid','high'].some(k=>!Number.isInteger(item.metrics.pitchBands[k])||item.metrics.pitchBands[k]<0||item.metrics.pitchBands[k]>100)||Object.values(item.metrics.pitchBands).reduce((a,b)=>a+b,0)!==100))throw new Error('pitchBands');if(item.metrics.stability!=null&&!['steady','variable'].includes(item.metrics.stability))throw new Error('stability');if(item.metrics.pitchRange!=null&&(!Number.isFinite( /* ---------------- 물 표면: 높이장 파동 ---------------- */
let GW = 229, GH = 500, CELL = 1.7, SPS = 100, DAMP = 0.99, VISC = 0.02, A, B, D, D2, HV = null, HA = 1, simCv = null, simCtx = null, img = null;
function initSim(){
  const oW = GW, oH = GH, oA = A, oB = B, oD = D;
  GW = Math.round(clamp(innerWidth / WQS[WQ].cell, 90, 640));          // 격자 한 칸 ≈ 화면 1.7px(품질 0)
  GH = Math.round(clamp(GW * innerHeight / Math.max(1, innerWidth), 150, 900));
  A = new Float32Array(GW * GH); B = new Float32Array(GW * GH);
  D = new Float32Array(GW * GH).fill(1); D2 = new Float32Array(GW * GH);
  if (oA && oA.length === oW * oH){                                   // 화면 크기가 바뀌어도 물결과 어둠을 그대로 옮겨 담는다
    const move = (src, dst) => {
      for (let y = 0; y < GH; y++){
        const fy = y * (oH - 1) / Math.max(1, GH - 1), y0 = Math.floor(fy), y1 = Math.min(oH - 1, y0 + 1), ty = fy - y0;
        for (let x = 0; x < GW; x++){
          const fx = x * (oW - 1) / Math.max(1, GW - 1), x0 = Math.floor(fx), x1 = Math.min(oW - 1, x0 + 1), tx = fx - x0;
          dst[y * GW + x] = (src[y0 * oW + x0] * (1 - tx) + src[y0 * oW + x1] * tx) * (1 - ty) + (src[y1 * oW + x0] * (1 - tx) + src[y1 * oW + x1] * tx) * ty;
        }
      }
    };
    move(oA, A); move(oB, B); move(oD, D);
  }
  CELL = innerWidth / GW;
  SPS = SPEED_PX / CELL / Math.SQRT1_2;                               // 격자 한 걸음에 물결은 0.7칸 간다
  DAMP = Math.exp(Math.log(0.75) / SPS);                              // 긴 물결은 멀리 간다(1초에 75%로)
  VISC = 0.02 * 1.667 / CELL;                                         // 짧은 물결일수록 빨리 잦아든다(물의 끈기)
  for (const b of BANDS) b.lam = Math.max(6, SPEED_PX / b.hz / CELL); // 그 대역의 파장(칸)
  if (gl) glSize(); else make2DSim();
}
function make2DSim(){ simCv = document.createElement("canvas"); simCv.width = GW; simCv.height = GH; simCtx = simCv.getContext("2d"); img = simCtx.createImageData(GW, GH); }
function step(){
  const g = GW, d = DAMP, a = A, b = B;
  for (let y = 1; y < GH - 1; y++){
    let i = y * g + 1;
    for (let x = 1; x < g - 1; x++, i++) b[i] = ((a[i - 1] + a[i + 1] + a[i - g] + a[i + g]) * 0.5 - b[i]) * d;
  }
  const last = (GH - 1) * g;                                          // 가장자리는 벽 대신 열린 물처럼(기울기 0)
  for (let x = 0; x < g; x++){ b[x] = b[x + g]; b[last + x] = b[last - g + x]; }
  for (let y = 0; y < GH; y++){ const i = y * g; b[i] = b[i + 1]; b[i + g - 1] = b[i + g - 2]; }
  const M = SPONGE.length;                                            // 가장자리 띠에서 물결을 삼켜 되튀지 않게 한다
  for (let y = 0; y < GH; y++){
    const row = y * g, fy = y < M ? SPONGE[y] : y >= GH - M ? SPONGE[GH - 1 - y] : 1;
    if (fy < 1){ for (let x = 0; x < g; x++){ const fx = x < M ? SPONGE[x] : x >= g - M ? SPONGE[g - 1 - x] : 1; b[row + x] *= fx < fy ? fx : fy; } }
    else { for (let x = 0; x < M; x++){ b[row + x] *= SPONGE[x]; b[row + g - 1 - x] *= SPONGE[x]; } }
  }

}
const SPONGE = Float32Array.from({ length: 18 }, (_, e) => 1 - 0.1 * Math.pow((18 - e) / 18, 2));
function soften(eps){
  const a = A, b = B, g = GW;
  for (let y = 1; y < GH - 1; y++){
    let i = y * g + 1;
    for (let x = 1; x < g - 1; x++, i++){
      a[i] += eps * (a[i - 1] + a[i + 1] + a[i - g] + a[i + g] - 4 * a[i]);
      b[i] += eps * (b[i - 1] + b[i + 1] + b[i - g] + b[i + g] - 4 * b[i]);
    }
  }

function emitRing(x, y, lam, amp){                                   // 바깥으로 퍼져 나가는 물결 고리 하나(파장 lam칸)
  const cx = x * GW, cy = y * GH, R0 = 0.5 * lam, sr = 0.28 * lam, k = 2 * Math.PI / lam, is2 = 1 / (sr * sr), R = R0 + 2 * sr, R2 = R * R;
  const rin = 0.1 * lam, rw = 0.25 * lam;                            // 한가운데는 비워 둔다(물결이 가운데로 모여 뾰족해지지 않게)
  const x0 = Math.max(1, Math.floor(cx - R)), x1 = Math.min(GW - 2, Math.ceil(cx + R));
  const y0 = Math.max(1, Math.floor(cy - R)), y1 = Math.min(GH - 2, Math.ceil(cy + R));
  for (let yy = y0; yy <= y1; yy++){
    const dy = yy - cy;
    for (let xx = x0; xx <= x1; xx++){
      const dx = xx - cx, d2 = dx * dx + dy * dy;
      if (d2 >= R2) continue;
      const i = yy * GW + xx, r = Math.sqrt(d2), u = r - R0, v = u + Math.SQRT1_2;   // 한 걸음 전에는 조금 안쪽에 있었다 → 바깥으로 간다

  }
}
function ring(x, y, lamPx, amp){ emitRing(x, y, Math.max(6, lamPx / CELL), amp); }   // lamPx: 파장(화면 px)
function clearAround(x, y, r, k){
  const cx = x * GW, cy = y * GH, R = r * GW;
  for (let yy = 0; yy < GH; yy++) for (let xx = 0; xx < GW; xx++){
    const d = Math.hypot(xx - cx, yy - cy);
    if (d < R){ const i = yy * GW + xx; D[i] *= 1 - k * (1 - d / R); }

const THR = 0.12;                                                    // 이보다 잔잔한 물결은 어둠을 건드리지 않는다
let dFrame = 0;
function updateDark(dt, cap, sweep, gain){
  const g = GW, n = g * GH;
  if (sweep > 0){
    const cx = GW * 0.5, cy = GH * 0.42, R = sweep * Math.max(GW, GH), k = Math.pow(0.02, dt);
    for (let yy = 0; yy < GH; yy++) for (let xx = 0; xx < GW; xx++){
      if (Math.hypot(xx - cx, yy - cy) < R) D[yy * GW + xx] *= k;
    }
  }
  if (gain > 0){                                                      // 목소리 물결이 지나간 자리는 맑아진다
    const c = CELL / 1.667, thr = THR * c, k = gain * dt / c;
    for (let y = 1; y < GH - 1; y++){
      let i = y * g + 1;
      for (let x = 1; x < g - 1; x++, i++){
        const m = Math.abs(A[i + 1] - A[i - 1]) + Math.abs(A[i + g] - A[i - g]) - thr;
        if (m > 0){ const v = D[i] - m * k; D[i] = v < 0 ? 0 : v; }
      }
    }
  }
  if (cap < 1) for (let i = 0; i < n; i++) if (D[i] > cap) D[i] = cap;
  if (++dFrame % 3 === 0){
    for (let y = 1; y < GH - 1; y++){ let i = y * g + 1; for (let x = 1; x < g - 1; x++, i++) D2[i] = (D[i] * 4 + D[i - 1] + D[i + 1] + D[i - g] + D[i + g]) * 0.125; }
    for (let y = 1; y < GH - 1; y++){ let i = y * g + 1; for (let x = 1; x < g - 1; x++, i++) D[i] = D2[i]; }
  }
}

/* ---------------- 그래픽 칩으로 그리기 ----------------
   높이를 부드럽게(3차) 이어서 한 화소마다 물결의 기울기를 구한다.
   → 잔잔할 때는 물빛 색만. 물결이 지나갈 때만 은은한 명암과 윤기, 먹이 풀리듯 번지는 어둠,
     유리 버튼 아래의 굴절, 테두리 스펙트럼 띠까지 한 번에 그린다. */
const EN = 48, edgeE = new Float32Array(EN), edgeB = new Uint8Array(EN);
const VS = "#version 300 es\nin vec2 aP;\nvoid main(){ gl_Position = vec4(aP, 0.0, 1.0); }";
const FS = `#version 300 es
precision highp float;
precision highp sampler2D;
uniform sampler2D uH, uD, uE;
uniform vec2 uRes, uSim;
uniform float uPx, uTime, uLight, uCs, uCompletion;
uniform vec3 uTop, uBot, uWhite, uGlowC;
uniform vec4 uGlow, uEdge;
uniform vec4 uFl[3];
uniform vec4 uLR[5];
uniform vec4 uLP[5];
out vec4 outC;

float hash(vec2 p){ p = fract(p * vec2(233.34, 851.73)); p += dot(p, p + 23.45); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int k = 0; k < 4; k++){ s += a * vnoise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return s / 0.9375; }

vec4 bsw(float t){ float t2 = t * t, t3 = t2 * t; return vec4(1.0 - 3.0 * t + 3.0 * t2 - t3, 4.0 - 6.0 * t2 + 3.0 * t3, 1.0 + 3.0 * t + 3.0 * t2 - 3.0 * t3, t3) / 6.0; }
float hC(vec2 uv){
  vec2 st = uv * uSim - 0.5, i = floor(st), f = st - i;
  vec4 wx = bsw(f.x), wy = bsw(f.y);
  vec2 g0 = vec2(wx.x + wx.y, wy.x + wy.y), g1 = vec2(wx.z + wx.w, wy.z + wy.w);
  vec2 p0 = (i - 0.5 + vec2(wx.y, wy.y) / g0) / uSim, p1 = (i + 1.5 + vec2(wx.w, wy.w) / g1) / uSim;
  return g0.y * (g0.x * texture(uH, p0).r + g1.x * texture(uH, vec2(p1.x, p0.y)).r)
       + g1.y * (g0.x * texture(uH, vec2(p0.x, p1.y)).r + g1.x * texture(uH, p1).r);
}

vec3 water(vec2 p, out float dk){
  vec2 uv = p / uRes, tx = 1.0 / uSim;
  float hl = hC(uv - vec2(tx.x, 0.0)), hr = hC(uv + vec2(tx.x, 0.0)), hu = hC(uv - vec2(0.0, tx.y)), hd = hC(uv + vec2(0.0, tx.y));
  vec2 g = vec2(hr - hl, hd - hu) * 0.5 * uCs;                        // 물결의 기울기
  vec3 col = mix(uTop, uBot, smoothstep(-0.15, 1.1, uv.y));          // 잔잔할 때는 물빛 색뿐
  // 물결이 지나갈 때만: 빛을 받는 쪽은 밝고 반대쪽은 그늘진다(색은 그대로, 밝기만)
  float tilt = clamp(dot(g, vec2(-0.55, -0.83)) * 2.2, -0.6, 0.6);
  col *= 1.0 + tilt * 0.9;
  vec3 n = normalize(vec3(-g * 6.0, 1.0)), Lh = normalize(vec3(-0.26, -0.36, 0.9));
  float nh = max(dot(n, Lh), 0.0);
  float sheen = max(pow(nh, 60.0) - pow(Lh.z, 60.0), 0.0) * 0.35 + max(pow(nh, 12.0) - pow(Lh.z, 12.0), 0.0) * 0.06;
  col += vec3(sheen);
  float clearLight = uLight;
  if (uCompletion >= 0.0){
    float reach = 1.24 * (1.0 - pow(1.0 - uCompletion, 2.0));
    float dist = length(p - uRes * vec2(0.5, 0.44)) / length(uRes * vec2(0.5, 0.56));
    clearLight = max(clearLight, 1.0 - smoothstep(reach - 0.22, reach + 0.02, dist));
  }
  if (clearLight > 0.001) col = mix(col, uWhite * (1.0 + tilt * 0.10) + vec3(sheen) * 0.3, clearLight);
  float d = texture(uD, uv).r;
  float e = d * (1.0 - d) * 4.0;
