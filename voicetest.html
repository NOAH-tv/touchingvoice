<style>
/* 글꼴: 라이브 루트의 Paperlogy(협회·결제 페이지와 같은 파일) */
@font-face{font-family:Paperlogy;src:url(Paperlogy-4Regular.woff2) format("woff2"),url(Paperlogy-4Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:Paperlogy;src:url(Paperlogy-5Medium.woff2) format("woff2"),url(Paperlogy-5Medium.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:Paperlogy;src:url(Paperlogy-6SemiBold.woff2) format("woff2"),url(Paperlogy-6SemiBold.ttf) format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:Paperlogy;src:url(Paperlogy-7Bold.woff2) format("woff2"),url(Paperlogy-7Bold.ttf) format("truetype");font-weight:700;font-display:swap}
:root{
  --bg:#F5EEE0;--bg2:#EDE3CF;--card:#FFFCF6;--fg:#22163F;--muted:#5A5070;--line:#E6DBC6;--line2:#D6C8AC;
  --pri:#43227D;--pri-fg:#FFFFFF;--gold:#A8925A;--ring:rgba(67,34,125,.28);--ok:#2F7D5B;--warn:#A35A2A;
  --shadow:0 1px 2px rgba(34,22,63,.05),0 10px 30px rgba(34,22,63,.08);
  --glass:rgba(255,252,246,.58);--glass-line:rgba(255,255,255,.75);--glass-hi:rgba(255,255,255,.85);
  --fam:#43227D;--fam-deep:#2E1660;--fam-ui:var(--fam);
  --r:20px;--r-sm:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#15111F;--bg2:#1B1628;--card:#201A31;--fg:#F3EDE1;--muted:#C3BBD7;--line:#2F2746;--line2:#3D3459;
  --pri:#BBA6F0;--pri-fg:#1A1230;--gold:#CDB57C;--ring:rgba(187,166,240,.35);--ok:#72CFA2;--warn:#E3A178;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --glass:rgba(32,26,49,.55);--glass-line:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.16);
  --fam-ui:color-mix(in oklab,var(--fam) 55%,#fff);color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#15111F;--bg2:#1B1628;--card:#201A31;--fg:#F3EDE1;--muted:#C3BBD7;--line:#2F2746;--line2:#3D3459;
  --pri:#BBA6F0;--pri-fg:#1A1230;--gold:#CDB57C;--ring:rgba(187,166,240,.35);--ok:#72CFA2;--warn:#E3A178;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --glass:rgba(32,26,49,.55);--glass-line:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.16);
  --fam-ui:color-mix(in oklab,var(--fam) 55%,#fff);color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font:500 16px/1.6 Paperlogy,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden;word-break:keep-all;overflow-wrap:anywhere}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(42% 30% at 88% 6%,color-mix(in oklab,var(--fam) 20%,transparent),transparent 70%),
             radial-gradient(48% 34% at 6% 96%,color-mix(in oklab,var(--gold) 24%,transparent),transparent 70%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}

/* 레이아웃 */
.view{max-width:440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;display:flex;flex-direction:column;gap:16px}
.view.with-tab{padding-block-end:calc(110px + env(safe-area-inset-bottom,0px))}
.view.enter{animation:viewIn .45s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;max-width:440px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--bg) 65%,color-mix(in oklab,var(--bg) 0%,transparent))}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--fg);flex:none}
.icon-btn:active{background:var(--bg2)}
.prog{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pri);border-radius:99px;transition:width .4s cubic-bezier(.2,.7,.2,1)}
.prog-n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right;margin-left:auto}

/* 타이포 */
.kicker{font-size:13px;letter-spacing:.12em;color:var(--gold);font-weight:700}
.display{font-size:31px;line-height:1.25;font-weight:700;letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance}
.title{font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
h2{font-size:18px;line-height:1.35;margin:0;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;margin:0;font-weight:700}
p{margin:0}
.lead{color:var(--muted);font-size:16px}
.muted{color:var(--muted)}
small,.small{font-size:14px;color:var(--muted)}
.fine{font-size:13px;color:var(--muted);line-height:1.55}
.num{font-variant-numeric:tabular-nums}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}

/* 컴포넌트 (shadcn 계열: 얇은 테두리·둥근 모서리·절제된 그림자) */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;border:1px solid var(--line2);background:var(--card);color:var(--fg);font-weight:600;font-size:16px;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.dot:focus-visible,.opt:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:none;box-shadow:0 0 0 4px var(--ring)}
.btn.pri{background:var(--pri);color:var(--pri-fg);border-color:transparent}
.btn.fam{background:var(--fam-deep);color:#fff;border-color:transparent}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}
.btn:disabled{opacity:.45}
.shine{background-image:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);background-size:250% 100%;animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%{background-position:120% 0}60%,100%{background-position:-120% 0}}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--card);white-space:nowrap}
.badge.solid{background:var(--fam-deep);border-color:transparent;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow)}
.err{color:var(--warn);font-size:14px;min-height:1em}
.bar{display:block;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--fam-ui);transition:width 1s cubic-bezier(.2,.7,.2,1)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
pre{white-space:pre-wrap;font-size:12px;background:var(--bg2);border-radius:12px;padding:12px;margin:8px 0;overflow-x:auto}

/* 움직임 (React Bits 계열: 흐림→선명, 튀어오름, 숫자 올라가기) */
.bi span{display:inline-block;opacity:0;animation:blurIn .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes blurIn{from{opacity:0;filter:blur(10px);transform:translateY(10px)}to{opacity:1;filter:none;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg)}30%{transform:rotate(6deg)}45%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}75%{transform:rotate(-1deg)}}
@keyframes pop{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.07);opacity:1}100%{transform:scale(1)}}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes drop{from{transform:translateY(-26px) scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes stamp{0%{transform:scale(2.3) rotate(-20deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-10deg)}}
@keyframes rise{0%{transform:translate(0,0) scale(.8);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx,0),-140px) scale(1.15);opacity:0}}
@keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.4);opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-14px) scale(1.04,.96)}55%{transform:translateY(0) scale(.97,1.03)}75%{transform:translateY(-4px)}}
.float{animation:float 3.6s ease-in-out infinite}
.wobble{animation:wobble 1.1s ease-in-out infinite}
.popin{animation:pop .7s cubic-bezier(.34,1.56,.64,1) both}
.bounce{animation:bounce .7s cubic-bezier(.34,1.56,.64,1)}
/* 화면 캡처용(?shot) — 움직임 끄고 최종 모습으로 */
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}.noanim .bi span{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* 첫 화면 */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.orb{align-self:center;width:min(260px,70vw);aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;position:relative;margin:4px 0}
.orb img{width:82%;border-radius:50%}
.fam-grid{display:flex;flex-direction:column;gap:14px}
.fam-row h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fam-row h3 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;min-width:0;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile img{border-radius:12px;width:100%;aspect-ratio:1;object-fit:cover}
.tile b{font-size:13px;line-height:1.2}
.tile span{font-size:10.5px;color:var(--muted);line-height:1.25;word-break:keep-all}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.steps3 b{display:block;font-size:20px}

/* 폼 */
.lbl{font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg2);padding:4px;border-radius:14px}
.seg button{border:0;background:transparent;border-radius:11px;min-height:42px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.inp{height:48px;border:1px solid var(--line2);border-radius:14px;background:var(--card);color:var(--fg);padding:0 14px;font:inherit;width:100%}
.inp:focus{outline:none;box-shadow:0 0 0 4px var(--ring);border-color:var(--pri)}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;min-height:38px;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--pri);border-color:transparent;color:var(--pri-fg)}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--pri);flex:none}

/* 질문 (MBTI식 한 화면 한 문항) */
.q-wrap{min-height:58dvh;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
.q{font-size:27px;line-height:1.35;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.likert{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-top:10px}
.dot{border-radius:50%;border:2.5px solid;background:transparent;cursor:pointer;flex:none;padding:0;transition:transform .15s,background .2s}
.dot:active{transform:scale(.9)}
.d0,.d6{width:48px;height:48px}.d1,.d5{width:40px;height:40px}.d2,.d4{width:32px;height:32px}.d3{width:24px;height:24px}
.d0,.d1,.d2{border-color:var(--pri)}.d3{border-color:var(--line2)}.d4,.d5,.d6{border-color:var(--gold)}
.d0.on,.d1.on,.d2.on{background:var(--pri)}.d3.on{background:var(--line2)}.d4.on,.d5.on,.d6.on{background:var(--gold)}
.scale-choice{flex:1;min-width:0;min-height:44px;border:1px solid var(--line2);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}.scale-choice[aria-pressed="true"]{background:var(--pri);color:var(--bg)}
.trait-ends{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}.trait-ends span:last-child{text-align:right}.axis meter{width:100%;accent-color:var(--pri)}
.likert-lab{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.likert-lab span:first-child{color:var(--pri)}.likert-lab span:last-child{color:var(--gold)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;text-align:left;font-size:18px;font-weight:600;transition:transform .15s,border-color .2s}
.opt:active{transform:scale(.98)}
.opt.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--ring)}
.opt i{font-style:normal;width:44px;height:44px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;font-size:20px;flex:none}

/* 녹음 */
.sentence{font-size:20px;line-height:1.75;font-weight:600;border-left:4px solid var(--fam-ui);padding:4px 0 4px 14px;text-wrap:pretty}
.mic-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.wave{width:100%;height:72px;max-width:100%}
.timer{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mic{position:relative;width:96px;height:96px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-fg);display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 30px color-mix(in oklab,var(--pri) 40%,transparent);transition:transform .15s}
.mic:active{transform:scale(.95)}
.mic::before,.mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--pri);opacity:0}
.mic.on{background:var(--warn);color:#fff}
.mic.on::before{border-color:var(--warn);animation:ping 1.6s ease-out infinite}
.mic.on::after{border-color:var(--warn);animation:ping 1.6s ease-out .8s infinite}
.mic-msg{font-size:14px;color:var(--muted);text-align:center;min-height:1.5em}
.file-alt{font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer}

/* 결과 */
.hero-card{border-radius:28px;padding:18px 18px 22px;color:#fff;background:linear-gradient(160deg,var(--fam),var(--fam-deep));display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;overflow:hidden;box-shadow:0 20px 50px color-mix(in oklab,var(--fam) 35%,transparent)}
.hero-card::after{content:"";position:absolute;inset:-40% -20% auto;height:70%;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);pointer-events:none}
.hc-top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill-g{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:99px;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hc-img{width:min(260px,72%);border-radius:24px;margin:8px 0 4px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.code{display:flex;gap:6px;justify-content:center}
.code span{width:48px;height:56px;border-radius:13px;display:grid;place-items:center;font-size:31px;font-weight:700;background:rgba(255,255,255,.95);color:var(--fam-deep);animation:drop .5s cubic-bezier(.34,1.56,.64,1) both}
.hc-name{font-size:32px;font-weight:700;margin:0;letter-spacing:-.02em}
.hc-tag{font-size:16px;font-weight:600;line-height:1.5;text-wrap:balance}
.hc-line{position:relative;display:inline-block;max-width:92%;margin:6px auto 2px;padding:9px 16px;border-radius:18px;background:#fff;color:var(--fam-deep);font-size:17px;font-weight:700;line-height:1.4;word-break:keep-all;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.hc-line::before{content:"";position:absolute;left:50%;top:-7px;width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.cmp img{width:76px;border-radius:16px;margin:0 auto 4px}
.cmp b{display:block;font-size:15px}
.axes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.axis{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:4px;min-width:0}
.axis-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.axis-top b{min-width:28px;height:28px;padding:0 9px;border-radius:9px;display:grid;place-items:center;background:var(--fam-deep);color:#fff;font-size:13px}
.axis strong{font-size:16px}
.axis p{font-size:13px;color:var(--muted);line-height:1.45}
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:150px;padding-top:6px;background:repeating-linear-gradient(to top,var(--line) 0 1px,transparent 1px 25px)}
.band{display:flex;flex-direction:column;align-items:center;gap:6px;height:144px;justify-content:flex-end}
.band i{display:block;width:70%;border-radius:10px 10px 4px 4px;background:var(--fam-ui);height:0;transition:height 1s cubic-bezier(.2,.7,.2,1)}
.band b{font-size:15px;font-variant-numeric:tabular-nums}
.band-lab{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;font-size:12px;color:var(--muted)}
.rmap{display:flex;flex-direction:column;gap:6px}
.rm-lab,.rm-notes{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.rm-lab span{font-size:13px;font-weight:700}.rm-notes small{font-size:11px;color:var(--muted)}
.rm-track{position:relative;height:46px;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2)}
.rm-track>i{display:block;border-right:1px solid var(--line)}.rm-track>i:nth-child(even){background:color-mix(in oklab,var(--fg) 4%,transparent)}.rm-track>i:nth-child(4){border-right:0}
.rm-band{position:absolute;top:12px;bottom:12px;border-radius:99px;background:color-mix(in oklab,var(--fam-ui) 45%,transparent)}
.rm-dot{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--fam-ui);box-shadow:0 0 0 3px rgba(255,255,255,.85)}
.rm-tick{position:absolute;top:6px;bottom:6px;border-left:1.5px dashed var(--muted);opacity:.7}
.big-num{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.ring{width:110px;height:110px;flex:none}
.ring .bg{fill:none;stroke:var(--line);stroke-width:9}
.ring .fg{fill:none;stroke:var(--fam-ui);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)}
.ring .tk{stroke:var(--gold);stroke-width:3;stroke-linecap:round}
.ring text{fill:var(--fg);font-size:22px;font-weight:700;text-anchor:middle;font-family:inherit}
.row{display:flex;align-items:center;gap:16px}
.cta{border:1.5px solid color-mix(in oklab,var(--fam-ui) 45%,var(--line));background:linear-gradient(160deg,color-mix(in oklab,var(--fam) 9%,var(--card)),var(--card))}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.list li::marker{color:var(--fam-ui)}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:6px 9px;font-size:12.5px;font-weight:600;cursor:pointer}
.picker button.on{background:var(--fam-deep);color:#fff;border-color:transparent}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg2);padding:4px;border-radius:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:5}
.tabs button{border:0;background:transparent;border-radius:11px;min-height:40px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.gap-row{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.gap-row:first-child{border-top:0}
.gap-bars{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.gap-bars div{display:grid;grid-template-columns:52px 1fr 28px;gap:6px;align-items:center}
.gap-bars .bar{height:8px}
.gap-bars .bar.self i{background:var(--gold)}
.tip{font-size:14px;margin-top:6px;line-height:1.5}
.target{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--bg2);font-size:14px}
.target b{font-size:18px}
.target.stack{display:block}.target.stack span{display:block;font-size:13.5px;font-weight:700;color:var(--pri);margin-bottom:6px;white-space:normal}.target.stack b{display:block;font-size:17px;line-height:1.55;word-break:keep-all}
.ap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ap div{display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-radius:12px;background:var(--bg2)}
.ap small{font-size:12px;color:var(--muted)}.ap b{font-size:18px}
.ap i{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.ap s{display:block;height:100%;background:var(--fam-ui);text-decoration:none}
.pbar{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 10px;border-radius:16px;background:var(--bg2);border:1px solid var(--line)}
.pbar .pb-btn{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-fg);display:grid;place-items:center;cursor:pointer}
.pbar .pb-btn svg{width:18px;height:18px;fill:currentColor}
.pbar .pb-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pbar .pb-lab{font-size:13.5px;font-weight:700}
.pbar .pb-track{height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.pbar .pb-track span{position:relative;flex:1;height:6px;border-radius:3px;background:var(--line)}
.pbar .pb-track i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--pri)}
.pbar .pb-t{flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 시트·토스트 */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(20,12,40,.42);animation:flash .01s}
.sheet-panel{position:relative;width:min(480px,100%);max-height:88dvh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:sheetUp .4s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line2);align-self:center}
.share-prev{width:min(260px,70%);margin:0 auto;border-radius:18px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 결과 공개 */
.reveal{min-height:78dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.rv-stage{position:relative;width:min(280px,78vw);aspect-ratio:1;max-width:100%}
.rv-stage img{position:absolute;inset:0;width:100%;border-radius:32px}

.rv-flash.go{animation:flash .7s ease-out}
.crack{animation:wobble .35s ease-in-out 3}
.wait-steps{display:flex;flex-direction:column;gap:8px;font-size:15px}
.wait-steps div{display:flex;gap:10px;align-items:center;color:var(--muted);transition:color .3s}
.wait-steps div.on{color:var(--fg);font-weight:600}
.wait-steps i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.wait-steps div.on i{background:var(--fam-ui)}
.sentence{transition:text-shadow .08s,border-color .3s;text-shadow:0 0 calc(var(--lv,0) * 26px) color-mix(in oklab,var(--gold) 85%,transparent)}
.sentence.kept{border-left-color:var(--gold)}
/* 11/4 대표: 코드 뜻은 2개씩 균형 있게(2×2) */
.cm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:100%;max-width:360px;margin:4px auto}
.cm span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:9px 8px;border-radius:14px;background:var(--bg2);color:var(--fg);text-align:center;line-height:1.3;word-break:keep-all}
.cm b{font-weight:700;font-size:17px}.cm em{font-style:normal;font-size:14px;opacity:.95}
.cm.on-dark span{background:rgba(255,255,255,.16);color:#fff}
.play-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.big-num.sm{font-size:30px;white-space:nowrap}.big-num.ok{color:var(--ok)}.big-num.no{color:var(--warn)}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.more-grid div{border:1px dashed var(--line2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fun2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fun2>div{display:flex;flex-direction:column;gap:2px;min-width:0}
/* 웹 테스트 전용 */
.friend{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:18px;border:1.5px dashed color-mix(in oklab,var(--fam-ui) 50%,var(--line2));background:var(--card);text-align:left}
.friend img{width:64px;border-radius:14px}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.price b{font-size:28px;letter-spacing:-.02em}
.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.biz{font-size:11.5px;color:var(--muted);line-height:1.7;text-align:center;padding-top:12px;border-top:1px solid var(--line);margin-top:4px}
.biz a{color:inherit}
.fine a{color:inherit}
.cond{display:flex;flex-direction:column;gap:6px}
.cond div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:8px 12px;border-radius:12px;background:var(--bg2)}
.cond b{font-size:13.5px;text-align:right}.cond b.ok{color:var(--ok)}.cond b.no{color:var(--warn)}

.ax-line{display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;align-items:center}
.ax-line small{grid-column:2}.ax-line.goal b{color:var(--fam-ui)}.ax-line.soft b{color:var(--gold)}
.megoal{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.megoal .av{width:92px;height:92px;border-radius:50%;margin:0 auto 6px;overflow:hidden;background:var(--bg2);box-shadow:var(--shadow);display:grid;place-items:center;font-size:34px;font-weight:700;color:var(--muted);border:3px solid var(--card-solid,#fff)}
.megoal .av img{width:100%;height:100%;object-fit:cover}.megoal .av.goal{box-shadow:0 0 0 3px var(--ring),var(--shadow)}
.fam-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);font-weight:600}
.fam-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 10px}
.rt{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--fg);min-width:0;font:inherit}
.rt span{width:100%;aspect-ratio:1;border-radius:22px;overflow:hidden;display:block;transition:transform .15s}
.rt:active span{transform:scale(.95)}.rt img{width:100%;height:100%;object-fit:cover}
.rt b{font-size:12.5px;line-height:1.2}.rt small{line-height:1.25;text-align:center;color:var(--muted)}
.rt.pick span{box-shadow:0 0 0 3px var(--pri),0 8px 24px color-mix(in oklab,var(--pri) 35%,transparent)}
.rt.me span{outline:2px dashed var(--gold);outline-offset:2px}
.sticky-cta{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.trial-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.trial-row small{grid-column:2}
.trial-row:first-child{border-top:0}.trial-row b{font-size:14.5px}.trial-row .num{font-weight:700}
.trial-row .ok{color:var(--ok)}.trial-row .no{color:var(--muted)}
.tips{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}.tips li b{color:var(--fam-ui)}
.win{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;padding-top:6px}
.tone{display:flex;flex-direction:column;gap:10px}
.tn{display:grid;grid-template-columns:84px minmax(0,1fr) 54px;gap:10px;align-items:center}
.tn span{display:flex;flex-direction:column;line-height:1.25}.tn b{font-size:14.5px}.tn small{font-size:11.5px}
.tn i{display:block;height:12px;border-radius:99px;background:var(--line);overflow:hidden}.tn s{display:block;height:100%;border-radius:99px;background:var(--fam-ui);text-decoration:none}
.tn em{font-style:normal;font-size:12.5px;color:var(--muted);text-align:right}
.rm-avg{position:absolute;top:3px;bottom:3px;width:0;border-left:2px dashed var(--gold);margin-left:-1px}
/* ===== 11/5 대표: 그라데이션 + 글래스(애플풍). 이 블록이 위 스타일을 덮어쓴다 ===== */
:root{--r:24px;--card:rgba(255,255,255,.6);--card-solid:#FFFCF6;--line:rgba(67,34,125,.10);--line2:rgba(67,34,125,.18);
  --glass-line:rgba(255,255,255,.8);--glass-hi:rgba(255,255,255,.95);--blur:saturate(180%) blur(22px);
  --shadow:0 1px 2px rgba(34,22,63,.04),0 10px 30px rgba(67,34,125,.10);
  --pri-grad:linear-gradient(135deg,#6B45BC,#43227D);--mesh1:rgba(196,170,255,.55);--mesh2:rgba(255,200,170,.42);--mesh3:color-mix(in oklab,var(--gold) 38%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#100C1A;--card:rgba(255,255,255,.07);--card-solid:#211A33;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);
  --glass-line:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.16);--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 36px rgba(0,0,0,.42);
  --pri-grad:linear-gradient(135deg,#DCCFFF,#A98BEA);--mesh1:rgba(108,62,214,.42);--mesh2:rgba(160,56,128,.28);--mesh3:color-mix(in oklab,var(--gold) 22%,transparent)}}
:root[data-theme=dark]{--bg:#100C1A;--card:rgba(255,255,255,.07);--card-solid:#211A33;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);
  --glass-line:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.16);--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 36px rgba(0,0,0,.42);
  --pri-grad:linear-gradient(135deg,#DCCFFF,#A98BEA);--mesh1:rgba(108,62,214,.42);--mesh2:rgba(160,56,128,.28);--mesh3:color-mix(in oklab,var(--gold) 22%,transparent)}
body{background:transparent}/* html 배경만 두어야 뒤 그라데이션이 보인다 */
#bgfx{inset:-15%;will-change:transform;animation:mesh 26s ease-in-out infinite alternate;background:
  radial-gradient(45% 35% at 82% 8%,color-mix(in oklab,var(--fam) 34%,transparent),transparent 70%),
  radial-gradient(42% 32% at 8% 26%,var(--mesh1),transparent 70%),
  radial-gradient(48% 36% at 92% 62%,var(--mesh3),transparent 70%),
  radial-gradient(46% 34% at 12% 92%,var(--mesh2),transparent 70%)}
@keyframes mesh{0%{transform:none}50%{transform:translate3d(3%,-2%,0) scale(1.06)}100%{transform:translate3d(-3%,2%,0) scale(1.1)}}
/* 유리 면 */
.card,.opt,.st-row,.tipcard,.friend,.inp,.seg,.chip,.badge,.chip-sm,.btn:where(:not(.pri,.fam,.ghost)){background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow)}
.badge,.chip-sm{box-shadow:inset 0 1px 0 var(--glass-hi)}
.card{border-radius:var(--r);padding:20px}
.seg button.on{background:var(--card-solid)}
.chip.on{background:var(--pri-grad);color:var(--pri-fg);border-color:transparent}
.top{background:color-mix(in oklab,var(--bg) 55%,transparent);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.sheet-panel{background:color-mix(in oklab,var(--card-solid) 84%,transparent);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border:1px solid var(--glass-line);border-bottom:0;box-shadow:0 -12px 40px rgba(20,10,40,.18)}
.sheet-bg{background:rgba(16,10,30,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.orb.glass{box-shadow:inset 0 1px 0 var(--glass-hi),0 30px 80px color-mix(in oklab,var(--pri) 22%,transparent)}
/* 버튼: 알약 모양, 주 버튼은 그라데이션 */
.btn{border-radius:999px;min-height:54px;font-weight:700;letter-spacing:-.01em}
.btn.sm{border-radius:999px}
.btn.pri{background:var(--pri-grad);border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 26px color-mix(in oklab,var(--pri) 36%,transparent)}
.btn.pri.shine{background-image:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%),var(--pri-grad);background-size:250% 100%,100% 100%}
.btn.ghost{color:var(--pri)}
.mic{background:var(--pri-grad)}
.prog i{background:var(--pri-grad)}
/* 결과 카드: 유리 테두리 */
.hero-card{border-radius:30px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.10),0 24px 60px color-mix(in oklab,var(--fam) 38%,transparent)}
.cm.on-dark span{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22)}
/* 16유형 칸: 이름 두 줄 고정 */
.card:has(.fam-grid){padding:18px 12px}
.tiles{gap:6px}
.tile{background:color-mix(in oklab,var(--card-solid) 50%,transparent);border:1px solid var(--glass-line);border-radius:18px;padding:4px 0 9px;box-shadow:inset 0 1px 0 var(--glass-hi)}
.tile img{width:calc(100% - 8px);border-radius:14px}
.tile span{font-size:11px;line-height:1.3;color:var(--fg);opacity:.85;width:100%}
.rt span{background:color-mix(in oklab,var(--card-solid) 50%,transparent);border:1px solid var(--glass-line)}
.rt small{font-size:10.5px;width:100%}
.ln{display:block;font-style:normal;white-space:nowrap;overflow:hidden}
.nw{white-space:nowrap}
/* 글자: 큰 제목은 촘촘하게, 줄은 고르게 */
.display{font-size:34px;line-height:1.18;letter-spacing:-.035em}
.title{font-size:26px;line-height:1.26;letter-spacing:-.03em}
.title-xl{letter-spacing:-.035em}
h2{font-size:19px;letter-spacing:-.02em}
.q{letter-spacing:-.03em}
.kicker{letter-spacing:.06em}
h1,h2,h3,.q,.lead,.title,.display,.title-xl{text-wrap:balance}
p,li,small,.fine,.muted{text-wrap:pretty}
.card :is(.inp,.seg,.chip,.btn:where(:not(.pri,.fam,.ghost))){-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 1px 0 var(--glass-hi),0 1px 3px rgba(34,22,63,.06)}
.hc-line{text-wrap:balance}
.list small.sub{display:block;font-size:14px;line-height:1.4;margin-top:1px}
/* 11/5 대표: 목소리 나이·호감도를 각각 박스로 — 두 문장이 섞여 읽히지 않게 */
.fun2{gap:10px}.fun2>div{background:color-mix(in oklab,var(--card-solid) 55%,transparent);border:1px solid var(--glass-line);border-radius:18px;padding:14px 14px 12px;box-shadow:inset 0 1px 0 var(--glass-hi);gap:4px}
</style>

<script>
/* 세미콜론 목소리 날씨 엔진 — semi-bible-beta/voice-care.js 원본 그대로(10/20 라이브판) */
/* 목소리 날씨 · 으·이·아 연습 — 기기 안에서만 재고 판정한다.

   의료기기가 아니다: 병명·진단을 말하지 않고, 병원으로 보내지 않는다.
   기획: 목소리날씨_으이아_연습기획_v1 (2026-10-06) */
const VoiceCare=(()=>{
 // ---------- 신호 처리 ----------
 function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t;}}
  for(let len=2;len<=n;len<<=1){const a=-2*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a),h=len>>1;for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let j=0;j<h;j++){const k=i+j,q=k+h,tr=cr*re[q]-ci*im[q],ti=cr*im[q]+ci*re[q];re[q]=re[k]-tr;im[q]=im[k]-ti;re[k]+=tr;im[k]+=ti;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t;}}}}
 // 앱과 같은 YIN(실시간 음높이)
 function pitch(input,sampleRate){const step=Math.max(1,Math.floor(sampleRate/8000)),rate=sampleRate/step,n=Math.floor(input.length/step),x=new Float32Array(n);let mean=0,power=0;for(let i=0;i<n;i++){let sum=0;for(let j=0;j<step;j++)sum+=input[i*step+j];x[i]=sum/step;mean+=x[i];}mean/=n;for(let i=0;i<n;i++){x[i]-=mean;power+=x[i]*x[i];}if(Math.sqrt(power/n)<.003)return null;const lo=Math.floor(rate/800),hi=Math.ceil(rate/65),w=Math.min(384,n-hi-2);if(w<160)return null;const d=new Float32Array(hi+2);for(let t=1;t<=hi+1;t++){let sum=0;for(let j=0;j<w;j++){const a=x[j]-x[j+t];sum+=a*a;}d[t]=sum;}let run=0;d[0]=1;for(let t=1;t<=hi+1;t++){run+=d[t];d[t]=run?d[t]*t/run:1;}let best=-1;for(let t=lo;t<=hi;t++){if(d[t]<.15){while(t<hi&&d[t+1]<d[t])t++;best=t;break;}}if(best<0)return null;const a=d[best-1],b=d[best],z=d[best+1],den=a-2*b+z,hz=rate/(best+(den?.5*(a-z)/den:0));return hz>=65&&hz<=800?hz:null;}
 const db=v=>10*Math.log10(v+1e-12);
 function rmsDb(x,from=0,to=x.length){let s=0;for(let i=from;i<to;i++)s+=x[i]*x[i];return db(s/Math.max(1,to-from));}
 function quantile(values,p){const a=values.filter(Number.isFinite).sort((a,b)=>a-b);if(!a.length)return null;const at=(a.length-1)*p,i=Math.floor(at);return a[i]+(a[Math.min(i+1,a.length-1)]-a[i])*(at-i);}
 const median=v=>quantile(v,.5);
 function concat(chunks){let n=0;for(const c of chunks)n+=c.length;const out=new Float32Array(n);let o=0;for(const c of chunks){out.set(c,o);o+=c.length;}return out;}
 // 16kHz 안팎으로 낮추기: 7kHz 저역 통과(63탭 윈도 sinc) 뒤 솎기 — 높은 배음이 접혀 들어와 고르기 값이 흔들리지 않게
 const FIR=new Map();
 function lowpass(sr,cut,taps=63){const key=sr+':'+cut;if(FIR.has(key))return FIR.get(key);const h=new Float32Array(taps),m=(taps-1)/2,fc=cut/sr;let sum=0;for(let i=0;i<taps;i++){const t=i-m,sinc=t===0?2*fc:Math.sin(2*Math.PI*fc*t)/(Math.PI*t),w=.42-.5*Math.cos(2*Math.PI*i/(taps-1))+.08*Math.cos(4*Math.PI*i/(taps-1));h[i]=sinc*w;sum+=h[i];}for(let i=0;i<taps;i++)h[i]/=sum;FIR.set(key,h);return h;}
 function decimate(x,sr){const f=Math.max(1,Math.floor(sr/16000));if(f===1)return {y:x,sr};const h=lowpass(sr,7000),T=h.length,m=(T-1)>>1,n=Math.floor(x.length/f),y=new Float32Array(n);for(let i=0;i<n;i++){const c=i*f;let s=0;for(let k=0;k<T;k++){const j=c+k-m;if(j>=0&&j<x.length)s+=h[k]*x[j];}y[i]=s;}return {y,sr:sr/f};}
 // 주변 소음: 20ms 덩어리의 중앙값(dBFS). 소리 내기 전 0.5초로 잰다
 function noiseDb(x,sr){const h=Math.round(sr*.02),v=[];for(let i=0;i+h<=x.length;i+=h)v.push(rmsDb(x,i,i+h));return median(v);}

 /* 한 구간을 잰다. 결과(숫자)는 사용자에게 보여 주지 않는다.
    voiced 유성 시간(초) · level 소리 크기(dBFS) · hz 음높이 중앙값 · cpps 고르기(dB, 기기 근사) ·
    breaks 음높이 끊김(9반음 이상 튐/유성 1초) · breath 숨 새는 소리(4–8kHz − 2–4kHz, dB) · hf 2–4kHz 세기(dB) */
 function analyze(pcm,sr,opt={}){
  const out={voiced:0,level:null,hz:null,cpps:null,breaks:null,breath:null,hf:null,frames:0};if(!pcm||pcm.length<sr*.3)return out;
  const {y,sr:sr2}=decimate(pcm,sr),N=1024,hop=Math.round(sr2*.01),half=N>>1,win=new Float32Array(N);for(let i=0;i<N;i++)win[i]=.5-.5*Math.cos(2*Math.PI*i/(N-1));
  const floor=Math.max(-62,(Number.isFinite(opt.noise)?opt.noise:-70)+6),pitches=[],levels=[],ceps=[];let prev=null,breaks=0,voicedFrames=0;
  const re=new Float64Array(N),im=new Float64Array(N);
  for(let at=0,k=0;at+N<=y.length;at+=hop,k++){const L=rmsDb(y,at,at+N);if(L<floor){prev=null;continue;}const hz=pitch(y.subarray(at,at+N),sr2);if(!hz){prev=null;continue;}
   voicedFrames++;pitches.push(hz);levels.push(L);if(prev&&Math.abs(12*Math.log2(hz/prev))>=9)breaks++;prev=hz;
   if(k%2)continue;// 고르기는 20ms마다
   for(let i=0;i<N;i++){re[i]=y[at+i]*win[i];im[i]=0;}fft(re,im);
   const spec=new Float64Array(N);for(let i=0;i<=half;i++){const v=db(re[i]*re[i]+im[i]*im[i]);spec[i]=v;if(i&&i<half)spec[N-i]=v;}
   for(let i=0;i<N;i++){re[i]=spec[i];im[i]=0;}fft(re,im);const c=new Float32Array(half);for(let i=0;i<half;i++)c[i]=db(re[i]*re[i]+im[i]*im[i]);ceps.push(c);}
  out.frames=voicedFrames;out.voiced=voicedFrames*hop/sr2;if(!voicedFrames)return out;
  out.level=median(levels);out.hz=median(pitches);out.breaks=out.voiced>0?breaks/out.voiced:null;
  // CPPS: 7프레임(시간)·3칸(켑스트럼) 평균 → 60–600Hz 봉우리와 회귀선 사이의 높이
  if(ceps.length>=7){const qLo=Math.ceil(sr2/600),qHi=Math.min(half-2,Math.floor(sr2/60)),fLo=Math.ceil(sr2/1000),vals=[];
   for(let f=3;f<ceps.length-3;f++){const s=new Float32Array(half);for(let t=f-3;t<=f+3;t++){const c=ceps[t];for(let i=0;i<half;i++)s[i]+=c[i]/7;}
    const sm=new Float32Array(half);for(let i=1;i<half-1;i++)sm[i]=(s[i-1]+s[i]+s[i+1])/3;
    let n=0,sx=0,sy=0,sxx=0,sxy=0;for(let q=fLo;q<=qHi;q++){n++;sx+=q;sy+=sm[q];sxx+=q*q;sxy+=q*sm[q];}const b=(n*sxy-sx*sy)/(n*sxx-sx*sx),a=(sy-b*sx)/n;
    let pk=qLo;for(let q=qLo;q<=qHi;q++)if(sm[q]>sm[pk])pk=q;vals.push(sm[pk]-(a+b*pk));}
   out.cpps=median(vals);}
  // 숨 새는 소리: 원래 표본률에서(8kHz까지 있어야 함)
  if(sr>=16000){const M=2048,w2=new Float32Array(M);for(let i=0;i<M;i++)w2[i]=.5-.5*Math.cos(2*Math.PI*i/(M-1));const r2=new Float64Array(M),i2=new Float64Array(M),hop2=Math.round(sr*.03),br=[],hf=[];
   for(let at=0;at+M<=pcm.length;at+=hop2){const L=rmsDb(pcm,at,at+M);if(L<floor)continue;const hz=pitch(pcm.subarray(at,at+M),sr);if(!hz)continue;for(let i=0;i<M;i++){r2[i]=pcm[at+i]*w2[i];i2[i]=0;}fft(r2,i2);
    const band=(lo,hi)=>{let s=0,n=0;for(let j=Math.ceil(lo*M/sr);j<=Math.floor(hi*M/sr)&&j<=M/2;j++){s+=r2[j]*r2[j]+i2[j]*i2[j];n++;}return db(s/Math.max(1,n));};const mid=band(2000,4000);br.push(band(4000,8000)-mid);hf.push(mid);}
   out.breath=median(br);out.hf=median(hf);}
  return out;}

 // ---------- 기준선과 날씨 ----------
 const LEARN_DAYS=7,FLOOR={cpps:.4,breaks:.05,breath:1},CPPS_DROP=.6;
 function stat(v,floor){const m=median(v);if(m==null)return null;const mad=median(v.filter(Number.isFinite).map(x=>Math.abs(x-m)));return {med:m,spread:Math.max(floor,1.4826*(mad||0))};}
 // days: 이 기기에서 잰 날들(최신 먼저). 처음 7일 + 그 뒤 맑은 날, 최근 28개로 기준선
 function baseline(days){const ok=days.filter(d=>d.m&&!d.noisy);const learn=ok.slice(-LEARN_DAYS),later=ok.slice(0,Math.max(0,ok.length-LEARN_DAYS)).filter(d=>d.w==='sun'),use=[...later,...learn].slice(0,28),pick=k=>use.map(d=>d.m[k]).filter(Number.isFinite);
  return {count:ok.length,ready:ok.length>=LEARN_DAYS,cpps:stat(pick('cpps'),FLOOR.cpps),breaks:stat(pick('breaks'),FLOOR.breaks),breath:stat(pick('breath'),FLOOR.breath),top:stat(use.map(d=>d.top).filter(Number.isFinite),.5)};}
 // 임시 문턱(검증 전): 고르기 0.6dB 이상 하락 또는 지표 1개가 흔들림 폭(2σ) 밖 = 조금 다름, 2개 이상 = 많이 다름
 function judge(m,base){if(!base?.ready)return {w:'learn',flags:{}};const f={};
  if(base.cpps&&Number.isFinite(m.cpps)){const drop=base.cpps.med-m.cpps;f.cpps=drop>=CPPS_DROP||drop>2*base.cpps.spread;}
  if(base.breaks&&Number.isFinite(m.breaks))f.breaks=m.breaks-base.breaks.med>Math.max(2*base.breaks.spread,FLOOR.breaks);
  if(base.breath&&Number.isFinite(m.breath))f.breath=m.breath-base.breath.med>Math.max(2*base.breath.spread,FLOOR.breath);
  const n=Object.values(f).filter(Boolean).length;return {w:n>=2?'cloud':n===1?'partly':'sun',flags:f};}
 // 4주 카드(식약처 검토 전이라 화면에는 쓰지 않음): 최근 28일 측정한 날의 절반 이상이 많이 다름, 첫 흐린 날이 3주 이상 전
 function referral(days,now=Date.now()){const recent=days.filter(d=>now-d.ts<28*864e5&&d.m&&!d.noisy),cloud=recent.filter(d=>d.w==='cloud');return recent.length>=8&&cloud.length*2>=recent.length&&now-Math.min(...cloud.map(d=>d.ts))>=21*864e5;}

 // ---------- 날씨별 처방(으·이·아 6동작) ----------
 // kind: u1 으 고르게 · u2 으 길게 · i1 이 작게 올라가기 · i1hold 이 편한 음 근처 · i2 이 통통 끊기 · a1 으~아/이~아 열기 · a2 아 길게
 function plan(w,flags={},base=null,todayHz=null){const sun=w==='sun'||w==='learn',steps=[];let u1=w==='cloud'?3:2;if(flags.cpps||flags.breaks)u1=Math.min(3,u1+1);
  steps.push({kind:'u1',reps:u1});if(sun)steps.push({kind:'u2'});
  const capTop=w==='partly'&&base?.top?.med?base.top.med*Math.pow(2,-1/12):null;
  if(w==='cloud')steps.push({kind:'i1hold',soft:!!flags.breath});else steps.push({kind:'i1',reps:2,cap:capTop,soft:!!flags.breath});
  if(sun)steps.push({kind:'i2'});
  steps.push({kind:'a1',variants:w==='cloud'?['으','이'].slice(0,1):['으','이']});if(sun)steps.push({kind:'a2'});return steps;}

 return {analyze,noiseDb,concat,baseline,judge,referral,plan,median,quantile,pitch,LEARN_DAYS};
})();
if(typeof module!=='undefined')module.exports=VoiceCare;

<script>
(()=>{
"use strict";

   녹음 결과를 기기에서 제공하고, 원하는 사람만 Big Five를 진행한다. 개발용 전송은 녹음별 선택 동의를 확인한다. */

/* 11/5 대표: 직업 이름은 정한 자리에서만 줄을 바꾼다(앞|뒤). 좁은 칸은 두 줄 고정, 넓은 곳은 그 자리에서만 끊김 */

const nmParts=c=>{const n=TYPES[c][1],a=NBR[c];return a&&n.startsWith(a+" ")?[a,n.slice(a.length+1)]:[n]};

function glue(root){if(!root)return;const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=tw.nextNode()){const t=n.nodeValue;if(/[가-힣] /.test(t)){let u=t,p;do{p=u;u=u.replace(/(^|[\s(“"'‘])([가-힣]) (?=[가-힣0-9])/g,"$1$2\u00a0")}while(u!==p);if(u!==t)n.nodeValue=u}}}

function bindMic({maxSec,minSec=1.5,onDone,onDemo}){const mic=$("#mic"),msg=$("#micmsg"),tm=$("#timer"),cv=$("#wave"),g=cv.getContext("2d");let t0=0,lv=[];

  <p class="small" style="text-align:center">평소 중심 <b>${noteName(s.f0)} (${Math.round(s.f0)}Hz)</b> · 말하면서 <b>${noteName(lo)}~${noteName(hi)}</b> 사이를 오르내렸어요<br><small>점선 = ${S.age>0&&S.age<13?"또래":S.sex==="m"?"남자":S.sex==="f"?"여자":""} 평균 높이(${noteName((S.age>0&&S.age<13?REF_KID:REF_F0[S.sex]||REF_F0.x))})</small></p>
  <div class="target stack"><span>소리 균형</span><b>${regLine(r)}</b></div>
  <small>좋은 목소리는 저음과 중저음이 반반쯤 받쳐 주고, 말하면서 위아래로 넓게 움직여요</small></section>`}
/* 11/5 새 경계로 다시 잼(저·중저·중고·고 %): 좋은 목소리 = 기업가(남) 44·42·10·5 · 개발자(남) 39·46·10·6 · 리더(여) 30·58·8·5 · 배우(여) 46·43·7·5 → 저음과 중저음이 반반쯤.
   일반인 자기소개 남 25명 65·22·8·4 · 여 28명 56·33·7·5 → 저음 쪽으로 가라앉음. F#5 노래 0·12·13·75.
   중저음 몫 q = 중저/(저+중저)가 0.2→0.45에서 점수가 차고, 중저음이 70% 넘게 몰리거나 중고+고음이 30% 넘으면 깎는다 */
function regScore(r){const[l,m,u,h]=r,q=m/((l+m)||1);let s=lin(q,0.2,0.45);if(m>70)s=Math.min(s,1-lin(m,70,90));if(u+h>30)s=Math.min(s,1-lin(u+h,30,55));return cl(s,0,1)}
const regKind=r=>{const[l,m,u,h]=r,q=m/((l+m)||1);return u+h>30?"high":m>70?"stuck":q<0.35?"low":"even"};
const regLine=r=>({even:"저음이 받쳐 주고 중저음이 살아 있는, 고르게 퍼진 목소리예요",low:"저음 쪽으로 가라앉아 있어요 — 억양을 조금 더 띄우면 중저음까지 퍼져요",stuck:"중저음 한 곳에 몰려 있어요 — 억양을 위아래로 넓히고 문장 끝은 편하게 내려놓아 보세요",high:"중고음·고음 쪽이 많아요 — 말할 때 목에 힘이 들어가 있을 수 있어요"})[regKind(r)];
const balanceLine=b=>({even:"낮은 성분과 높은 성분이 고르게 퍼져 있어요",low:"낮은 성분(울림·몸통) 쪽으로 쏠려 있어요",high:"높은 성분(선명함·공기감) 쪽으로 쏠려 있어요"})[bandBalance(b).kind];
const balanceRatio=b=>{const h=Math.round(bandBalance(b).hi);return`낮은 성분 ${100-h} : 높은 성분 ${h} · 기준(트레이너 목소리) 약 66 : 34`};
/* 목소리 호감도 — 10/29 대표: '이성 호감도' 대신 모두 '목소리 호감도'. 성별 방향 높이는 빼고,
   소리 균형(대표 기준·좋은 목소리 녹음으로 보정, 가장 크게) + 숨결 · 고르기 · 여유·억양(근거조사 v1 B장, 계명대 일반 호감 연구) */
/* 11/4 대표: 목소리 호감도 = 적당한 호흡 + 안정적인 발음 + 소리 비중(저·중·고 비율, 원래 4대역 그대로).
   호흡 = '아—' 길이 · 숨이 새지도 누르지도 않는 정도(맑기 15dB 근처) · 문장 중 쉼표에서 쉬었는지
   발음 = 모음 공간(F1 폭×F2 폭, 입·혀 움직임) · 음절 대비(또렷이 끊기는 정도) · 고르기(떨림·크기)
   ⚠️ 발음 기준(ART_REF·음절 대비 범위)은 임시값 — 원음(대표·여성 강사) 녹음으로 다시 맞출 것 */
/* 11/5 대표: 발음은 '목소리 좋은 여배우'(목소리 학습 샘플 C) 기준 — 테스트와 같은 계산으로 18초 4토막 모음 공간 809·1056·1040·1066(중앙 약 1,050), 음절 대비 약 11dB → 만점.
   남자는 성도 길이 차이로 ×0.72. 보통 사람(240~650)이 0점 근처로 몰리지 않게 (내 값/기준)^0.6 — 예: 아내 녹음 347 → 모음 0.51(예전 0) */
const ART_REF={m:760,f:1050,x:900};
function attrScore(m){const s=m.s,v=m.v,bb=bandBalance(s.bands),aref=ART_REF[S.sex]||ART_REF.x;
 const pz=s.pauses==null?1:s.pauses===0?0.6:s.pauses>3?0.7:1;
 const breath=0.4*lin(v.mpt,4,mptRef())+0.4*(1-cl(Math.abs(v.hnr-15)/8,0,1))+0.2*pz;
 const steady=1-0.6*lin(v.trem,.2,.6)-0.4*lin(s.dbsd,3,9);
 const artic=s.vspace==null?0.5+0.5*steady:0.5*Math.pow(cl(s.vspace/aref,0,1),0.6)+0.3*(s.sylc==null?0.6:lin(s.sylc,4,11))+0.2*steady;
 const rg=s.regs4,parts={breath:cl(breath,0,1),artic:cl(artic,0,1),balance:rg?0.5*regScore(rg)+0.5*bb.score:bb.score};
 const W={breath:.35,artic:.30,balance:.35},NAME={breath:"호흡",artic:"발음",balance:"소리 비중"};
 let sum=0;Object.keys(W).forEach(k=>sum+=W[k]*parts[k]);const pct=Math.round(55+42*cl(sum,0,1));
 const weak=Object.keys(W).sort((a,b)=>parts[a]-parts[b])[0];
 const TIP={breath:v.mpt<mptRef()*0.6?"숨을 먼저 깊게 채우고, '아—'를 한 음으로 길게 이어 보세요":v.hnr<12?"소리를 앞으로 모아 숨이 새지 않게 말해 보세요":v.hnr>19?"첫마디에 숨을 살짝 섞어 부드럽게 시작해 보세요":"쉼표에서 한 번 숨을 쉬고 이어 말해 보세요",
  artic:"입을 조금 더 크게 열고, 모음 하나하나를 또렷하게 말해 보세요",
  balance:(rg?regKind(rg)==="high":bb.kind==="high")?"어깨와 턱 힘을 빼고 가슴 울림을 느끼며 편하게 말해 보세요":rg&&regKind(rg)==="stuck"?"문장 끝을 편하게 내려놓으며 말해 보세요":rg&&regKind(rg)==="low"?"질문하듯 억양을 조금 더 띄우고, 숨을 살짝 섞어 부드럽게 말해 보세요":"입을 조금 더 열고, '음~' 허밍으로 찾은 코끝 울림을 살려 소리를 앞으로 보내 보세요"};
 return{pct,label:"목소리 호감도",tip:TIP[weak],line:pct>=88?"듣는 사람이 끌리는 목소리예요":pct>=75?"부드럽고 호감 가는 목소리예요":"편안한 목소리예요 — 연습하면 더 올라가요",parts,names:NAME,W}}
function ageBand(a){const d=Math.floor(a/10)*10,r=a-d;return d+"대 "+(r<4?"초반":r<7?"중반":"후반")}
function weakest(sc){const w=[["breath",sc.breath,"숨"],["clear",sc.clear,"맑기"],["tune",sc.tune,"억양 폭"],["steady",sc.steady,"크기 안정"]];w.sort((a,b)=>a[1]-b[1]);return w}
function pr(d,w){const map={"억양":"tune","음색":"clear","속도":"breath","높이":"steady"},k=map[d.ax];for(let i=0;i<w.length;i++)if(w[i][0]===k)return 4-i;return 0}

/* ===== 내 목소리 컨디션 — '아—' 한 번을 세미콜론 voice-care 엔진으로 재서 일반 기준과 비교한다.
   앱의 '목소리 날씨'는 7일 동안 쌓은 내 기준과 비교하지만, 웹은 한 번뿐이라 일반 기준(임시값)을 쓴다. 진단 아님·숫자는 숨김.
   임시 기준 근거: 이 엔진으로 잰 건강한 '아—' CPPS 약 14~17(목 긁은 소리 12.3), 음높이 끊김 건강 0.1 안팎(쉰 목소리 0.3~0.45) ===== */
const COND_TH={cpps:13,breaks:.25,mpt:7};
function condMeasure(x22){try{const fr=[];frameDb(x22,SR,441,441,v=>fr.push(v));const nd=Math.min(pct(fr,0.05),-45),c=VoiceCare.analyze(REC.r2.x,REC.r2.sr,{noise:nd});
 return{cpps:c.cpps,breaks:c.breaks,voiced:c.voiced,snr:c.level-nd}}catch(e){return null}}
function condOf(m){const c=m.c;if(!c)return null;if(!(c.voiced>=1.5)||!(c.snr>=18))return{w:"noisy",items:[]};
 const it=[["소리의 고르기",Number.isFinite(c.cpps)&&c.cpps<COND_TH.cpps,"맑고 고르게 울려요","조금 거칠게 들려요"],
  ["음높이 이어짐",Number.isFinite(c.breaks)&&c.breaks>COND_TH.breaks,"끊김 없이 이어져요","중간중간 끊겨요"],
  ["숨 길이",m.v.mpt<COND_TH.mpt,"충분히 길어요","짧았어요"]],n=it.filter(i=>i[1]).length;
 return{w:n>=2?"cloud":n?"partly":"sun",items:it}}
const COND_TXT={sun:["맑음","목소리가 맑고 고르게 이어져요. 지금 상태를 잘 지켜 주세요."],
 partly:["구름 조금","조금 지쳐 있거나 녹음 환경의 영향일 수 있어요. 물 한 잔 마시고 편하게 말해 보세요."],
 cloud:["흐림","목이 지쳐 있는 것 같아요. 오늘은 큰 소리와 긴 말을 줄이고 목을 쉬어 주세요."],
 noisy:["다시 재 볼까요","주변 소리가 크거나 '아—'가 짧아서 컨디션을 재지 못했어요. 조용한 곳에서 다시 해 보세요."]};
function wIcon(k,s=48){const C="#C9C1D8",C2="#A79DB9",sun=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#E9B949"/>`+[0,45,90,135,180,225,270,315].map(a=>{const t=a*Math.PI/180;return`<line x1="${x+(r+4)*Math.cos(t)}" y1="${y+(r+4)*Math.sin(t)}" x2="${x+(r+9)*Math.cos(t)}" y2="${y+(r+9)*Math.sin(t)}" stroke="#E9B949" stroke-width="3.5" stroke-linecap="round"/>`}).join(""),
 cloud=(x,y,c)=>`<g fill="${c}"><circle cx="${x}" cy="${y}" r="9"/><circle cx="${x+12}" cy="${y-5}" r="12"/><circle cx="${x+25}" cy="${y+1}" r="8"/><rect x="${x-3}" y="${y}" width="31" height="10" rx="5"/></g>`;
 const body={sun:sun(32,32,11),partly:sun(25,24,9)+cloud(24,42,C),cloud:cloud(10,30,C2)+cloud(22,42,C),
  learn:`<path d="M32 52V30" stroke="#5E9E6E" stroke-width="3.5" stroke-linecap="round"/><path d="M32 36c-11 0-15-7-15-14 9 0 15 5 15 14z" fill="#7CB88A"/><path d="M32 31c0-9 6-14 15-14 0 8-5 14-15 14z" fill="#7CB88A"/>`,
  noisy:`<g fill="none" stroke="${C2}" stroke-width="3.5" stroke-linecap="round"><path d="M12 26q5-6 10 0t10 0t10 0t10 0"/><path d="M12 38q5-6 10 0t10 0t10 0t10 0"/></g>`,
  none:`<circle cx="32" cy="32" r="18" fill="none" stroke="${C2}" stroke-width="3" stroke-dasharray="4 6"/>`}[k]||"";
 return`<svg viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true">${body}</svg>`}
function condCard(){const k=condOf(S.m);if(!k)return"";const t=COND_TXT[k.w];
 return`<section class="card"><div class="sec-h"><h2>내 목소리 컨디션</h2><small>'아—' 녹음 기준</small></div>
 <div class="row" style="gap:14px">${wIcon(k.w,64)}<div style="min-width:0"><b style="font-size:20px">${t[0]}</b><p class="small" style="margin-top:2px">${t[1]}</p></div></div>
 ${k.items.length?`<div class="cond">${k.items.map(i=>`<div><span>${i[0]}</span><b class="${i[1]?"no":"ok"}">${i[1]?i[3]:i[2]}</b></div>`).join("")}</div>`:""}
 ${k.w==="cloud"?`<details><summary>이럴 땐 진료를 받아 보세요</summary><p class="small" style="margin-top:6px">목소리가 3주 넘게 쉬어 있거나, 말할 때 아프거나, 삼키기 힘들거나, 숨이 차면 이비인후과 진료를 받아 보세요.</p></details>`:""}
 <small>'아—' 한 번을 일반 기준과 비교한 결과라 녹음 환경에 따라 달라질 수 있어요. 진단이 아니에요.</small></section>`}

/* ===== 11/5 대표: 결과 → ③ 원하는 목소리 정하기 → ④ 1분 체험 → 앱(지금은 대기예약) =====
   APP_LINK에 앱 주소를 넣으면 대기예약 대신 '앱 받기'로 바뀐다 */
const APP_LINK="";
const TO_TIP={L:"문장 끝을 편하게 내려놓고 조금 낮게 — 반음 1~2개만",H:"첫마디를 밝게 띄우고 조금 높게 — 반음 1~2개만",A:"한 문장을 한 호흡에, 조금 더 빠르고 힘 있게",U:"쉼표마다 숨 한 번 쉬고 천천히",D:"소리를 앞으로 모아 또렷하게, 끝까지 힘 있게",B:"첫마디에만 숨을 살짝 섞어 부드럽게",T:"질문하듯, 노래하듯 오르내림을 크게",F:"결론 말하듯 한 높이로 차분하게"};
function axisPlan(my,to){return my.split("").map((a,i)=>{const b=to[i],o={i,ax:AX_N[i],from:a,to:b};if(a===b)return{...o,st:"same"};

 const tr=el.querySelector(".pb-track"),seek=e=>{const R=tr.getBoundingClientRect();a.currentTime=cl((e.clientX-R.left)/R.width,0,1)*dur;ui()};
 tr.onpointerdown=e=>{seek(e);try{tr.setPointerCapture(e.pointerId)}catch(_){}tr.onpointermove=seek};tr.onpointerup=tr.onpointercancel=()=>{tr.onpointermove=null};ui()}

/* 11/5 대표: 녹음 품질 기록 — 마이크가 실제로 받은 샘플레이트. 블루투스 이어폰(에어팟 등)은 16~24kHz라 48kHz로 저장해도 음질이 안 오른다 → 시트 '녹음 품질'에 남겨 거를 수 있게. 파일로 했으면 '파일' */

function copy(t){const ok=()=>toast("복사했어요");if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>toast("복사가 막혀 있어요. 길게 눌러 직접 복사해 주세요."));else toast("길게 눌러 직접 복사해 주세요.")}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
/* 한 줄 설명은 쉼표 뒤나 "—" 앞에서 두 줄로 고르게 끊는다(줄 끝에 "—"가 걸리지 않게) */
function tagSplit(t){const w=t.split(" ");let best=null,bm=1e9;for(let i=1;i<w.length;i++){if(!(w[i-1].endsWith(",")||w[i]==="—"))continue;const a=w.slice(0,i).join(" "),b=w.slice(i).join(" "),m=Math.max(a.length,b.length);if(m<bm){bm=m;best=[a,b]}}return best||[t]}
async function makeCard(){const J=S.J,T=TYPES[J.code],F=FAM[J.code.slice(0,2)],c=document.createElement("canvas");c.width=1080;c.height=1920;const g=c.getContext("2d"),ff="Paperlogy,'Apple SD Gothic Neo',sans-serif";

 try{await Promise.all(["700 80px","600 40px","500 40px"].map(x=>document.fonts.load(x+" Paperlogy")))}catch(e){}
 const rr=(x,y,w,h,r)=>{g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)},fnt=(wt,px)=>{g.font=`${wt} ${px}px ${ff}`};
 const gr=g.createLinearGradient(169,-61,911,1981);gr.addColorStop(0,F[2]);gr.addColorStop(1,F[3]);g.fillStyle=gr;g.fillRect(0,0,1080,1920);
 g.save();g.translate(540,-96);g.scale(1,672/756);const hl=g.createRadialGradient(0,0,0,0,0,756);hl.addColorStop(0,"rgba(255,255,255,.22)");hl.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=hl;g.fillRect(-756,-756,1512,1512);g.restore();
 g.textAlign="center";g.textBaseline="middle";
 const pills=[...document.querySelectorAll(".hero-card .hc-top .pill-g")].map(e=>e.textContent.trim()).filter(Boolean);if(!pills.length)pills.push(F[0]+" · "+F[1]);
 let pp=37,pw,tot;const pm=()=>{fnt(600,pp);pw=pills.map(t=>g.measureText(t).width+66);tot=pw.reduce((a,b)=>a+b,0)+22*(pills.length-1)};pm();while(tot>980&&pp>26){pp-=1;pm()}
 let x=540-tot/2;pills.forEach((t,i)=>{rr(x,56,pw[i],78,39);g.fillStyle="rgba(255,255,255,.16)";g.fill();g.strokeStyle="rgba(255,255,255,.3)";g.lineWidth=3;g.stroke();g.fillStyle="#fff";g.fillText(t,x+pw[i]/2,97);x+=pw[i]+22});
 const im=await loadImg(img.char(J.code)),iz=620,ix=230,iy=164;g.save();g.shadowColor="rgba(0,0,0,.25)";g.shadowBlur=70;g.shadowOffsetY=30;rr(ix,iy,iz,iz,66);g.fillStyle="#F5EEE0";g.fill();g.restore();g.save();rr(ix,iy,iz,iz,66);g.clip();g.drawImage(im,ix,iy,iz,iz);g.restore();
 const tw=132,th=152,tg=18,tx=540-(4*tw+3*tg)/2,ty=iy+iz+32;fnt(700,84);J.code.split("").forEach((l,i)=>{rr(tx+i*(tw+tg),ty,tw,th,34);g.fillStyle="rgba(255,255,255,.95)";g.fill();g.fillStyle=F[3];g.fillText(l,tx+i*(tw+tg)+tw/2,ty+th/2+4)});
 g.fillStyle="#fff";let np=90;fnt(700,np);{const w=g.measureText(T[1]).width;if(w>980){np=Math.floor(np*980/w);fnt(700,np)}}const ny=ty+th+80;g.fillText(T[1],540,ny);
 const lines=tagSplit(T[2]);let tp=44;for(;;){fnt(600,tp);if(Math.max(...lines.map(t=>g.measureText(t).width))<=980||tp<=32)break;tp-=2}
 const ly=ny+90;lines.forEach((t,i)=>g.fillText(t,540,ly+i*66));
 const cy=ly+(lines.length-1)*66+64,cw=481,ch=158,cg=18;codeParts(J.code).forEach((p,i)=>{const cx=50+(i%2)*(cw+cg),y=cy+Math.floor(i/2)*(ch+cg);rr(cx,y,cw,ch,40);g.fillStyle="rgba(255,255,255,.16)";g.fill();g.fillStyle="#fff";fnt(700,48);g.fillText(p[0],cx+cw/2,y+56);fnt(500,38);g.globalAlpha=.95;g.fillText(p[1],cx+cw/2,y+111);g.globalAlpha=1});
 {const t="“"+LINES[J.code]+"”";let bp=46;fnt(700,bp);let w=g.measureText(t).width;if(w>880){bp=Math.floor(bp*880/w);fnt(700,bp);w=g.measureText(t).width}const by=cy+2*ch+cg+44,bw=w+96,bh=112,bx=540-bw/2;
  g.save();g.shadowColor="rgba(0,0,0,.12)";g.shadowBlur=40;g.shadowOffsetY=16;rr(bx,by,bw,bh,56);g.fillStyle="#fff";g.fill();g.restore();g.beginPath();g.moveTo(518,by+2);g.lineTo(540,by-20);g.lineTo(562,by+2);g.fillStyle="#fff";g.fill();g.fillStyle=F[3];g.fillText(t,540,by+bh/2+3)}
 g.fillStyle="#fff";fnt(700,46);g.fillText("너는 어떤 목소리야?",540,1832);fnt(500,30);g.globalAlpha=.8;g.fillText("터칭보이스 목소리 유형 테스트 · touchingvoice.app",540,1884);g.globalAlpha=1;
 return c}

/* 11/4 대표: 한글 읽기(라디티)와 알파벳 한 글자(L 낮은) 대신 영어 단어로 보여 준다 (단어는 기획서 v2 축 정의) */
const EN={L:"Low",H:"High",A:"Active",U:"Unhurried",D:"Dry",B:"Breathy",T:"Tuneful",F:"Firm"};
const enName=c=>c.split("").map(l=>EN[l]).join("-");
function codeParts(c){const near=S.J&&S.J.code===c&&Math.abs(S.J.stRel)<1;return c.split("").map((l,i)=>[EN[l],i===0&&near?(l==="H"?"평균보다 조금 높은":"평균보다 조금 낮은"):LET[l].nm])}
const codeMean=c=>codeParts(c).map(p=>`${p[0]} ${p[1]}`).join(" · ");
const codeKo=c=>c.split("").map(l=>LET[l].nm).join(" · ");
const codeShort=c=>`${c[0]==="L"?"낮고":"높고"} ${c[1]==="A"?"빠른":"여유로운"} · ${c[2]==="D"?"또렷한":"숨결 섞인"} · ${c[3]==="T"?"선율 있는":"한결같은"}`;
const codeMeanHTML=(c,cls="")=>`<div class="cm ${cls}">${codeParts(c).map(p=>`<span><b>${p[0]}</b><em>${p[1]}</em></span>`).join("")}</div>`;

{const qf=(Q.get("f")||"").toUpperCase(),qd=(Q.get("demo")||"").toUpperCase();if(TYPES[qf]){S.friend=qf;save()}
