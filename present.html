<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Find Your True Voice · 터칭보이스</title>
<!-- 11/25 대표: 발표용 한 화면 — 목소리 검사(voicetest.html?present)를 폰 모양 틀에 띄우고, 결과 ④에서 '앱으로 바로 이어 하기'를 누르면 앱(apptest.html)으로 넘어간다.
     검사 결과는 같은 도메인 기기 저장(tv_handoff)으로 앱에 넘긴다. 좁은 화면(폰)에서는 틀 없이 검사로 바로 간다. -->
<style>
@font-face{font-family:Paperlogy;src:url(Paperlogy-5Medium.woff2) format("woff2"),url(Paperlogy-5Medium.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:Paperlogy;src:url(Paperlogy-7Bold.woff2) format("woff2"),url(Paperlogy-7Bold.ttf) format("truetype");font-weight:700;font-display:swap}
:root{--plum:#43227D;--cream:#F5EEE0;--gold:#A8925A}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Paperlogy,'Apple SD Gothic Neo',sans-serif;color:var(--cream);background:radial-gradient(120% 90% at 15% 10%,#6B3FB0 0%,var(--plum) 45%,#1c0f38 100%);display:flex;align-items:center;justify-content:center;gap:clamp(32px,6vw,96px);padding:24px;overflow:hidden}
.side{max-width:440px}
.brand{font-size:14px;letter-spacing:.42em;color:var(--gold);font-weight:700}
h1{font-size:clamp(40px,4.6vw,68px);line-height:1.05;margin:14px 0 10px;font-weight:700;color:#fff}
.sub{font-size:clamp(18px,1.6vw,24px);line-height:1.5;margin:0 0 28px;opacity:.92}
ol{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:12px;font-size:clamp(15px,1.3vw,19px)}
ol li{display:flex;gap:12px;align-items:center}
ol b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(245,238,224,.14);border:1px solid rgba(245,238,224,.3);font-size:14px;flex:none}
button{font:inherit;font-size:14px;color:var(--cream);background:transparent;border:1px solid rgba(245,238,224,.35);border-radius:999px;padding:10px 18px;cursor:pointer}
button:hover{background:rgba(245,238,224,.1)}
.phone{height:min(90vh,860px);aspect-ratio:400/860;border-radius:52px;padding:12px;background:#0d0716;box-shadow:0 40px 90px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.08);flex:none}
.phone iframe{width:100%;height:100%;border:0;border-radius:40px;background:#140b26;display:block}
@media (max-width:820px){.side{display:none}body{padding:0}.phone{height:100%;width:100%;aspect-ratio:auto;border-radius:0;padding:0}.phone iframe{border-radius:0}}
</style>
</head>
<body>
<section class="side">
  <div class="brand">TOUCHING VOICE</div>
  <h1>Find Your<br>True Voice</h1>
  <p class="sub">당신 목소리의 모든 가능성을<br>3분 만에 찾아 드려요.</p>
  <ol>
    <li><b>1</b>목소리 검사 · 문장 읽기와 '아—'</li>
    <li><b>2</b>지금 내 목소리 · 가능성 %</li>
    <li><b>3</b>이런 목소리도 가능해요</li>
    <li><b>4</b>남은 %를 앱에서 하루 3분</li>
  </ol>
  <button id="restart" type="button">처음부터 다시</button>
</section>
<div class="phone"><iframe id="vt" title="목소리 검사" src="voicetest.html?present" allow="microphone; autoplay; clipboard-write; web-share"></iframe></div>
<script>
document.getElementById("restart").onclick=()=>{try{localStorage.removeItem("tv_voicetest_web_v2");localStorage.removeItem("tv_handoff")}catch(e){}document.getElementById("vt").src="voicetest.html?present&t="+Date.now()};
</script>
</body>
</html>
