  tvTrack("Lead",{content_name:"app_waitlist"});R.waitlisted=phone.slice(0,3)+"-****-"+phone.slice(-4);save();vTeaser();toast("알림 신청했어요")}}

/* 결제는 됐는데 '레포트 열기' 화면을 놓친 경우: 이 기기의 주문번호 + 기기 열쇠로 되찾는다 */

 api({op:"preview",sc:7,a:R.a,v:voiceSum(),nick:R.nick!=null?R.nick:(VT.name||"")}).then(j=>{if(j.ok)return vReport(j);if(j.error==="not_test"){R.preview=false;save();return vTeaser()}/* 실제 결제로 바뀐 뒤에는 결제 화면으로 */vError("레포트를 만들지 못했어요.")}).catch(()=>vError("인터넷 연결을 확인하고 다시 열어 주세요."))}
/* ===== 레포트(결제 후) — 문장은 전부 서버가 준다 ===== */
function openReport(){show(`<div class="card center" style="margin-top:20vh"><div class="spin"></div><p>레포트를 불러오고 있어요…</p></div>`);
 if(!API_URL)return vError("레포트 서버가 아직 연결되지 않았어요.");
 api({op:"report",token:R.token}).then(j=>{if(j.ok){REPORT=j;vReport(j)}else{if(j.error==="not_found"||j.error==="bad_token"){R.token="";save()}vError(j.error==="server"?"잠시 문제가 생겼어요.":"레포트를 찾지 못했어요. 결제한 지 1년이 지났거나 주소가 잘못됐어요.")}})
  .catch(()=>vError("인터넷 연결을 확인하고 다시 열어 주세요."))}
function vError(msg){show(`<div class="card center" style="margin-top:14vh"><h2>레포트를 열지 못했어요</h2><p>${esc(msg)}</p>

<p class="small">결제했는데 열리지 않으면 고객센터 010-9947-3682 로 알려 주세요.</p></div>${BIZ}`)}
const P=a=>(a||[]).map(t=>`<p>${esc(t)}</p>`).join("");
function secHtml(s,i){let h=`<span class="num">${String(i+1).padStart(2,"0")}</span><h2>${esc(s.title)}</h2>`;
 if(s.value!=null)h+=`<div class="gauge" style="--v:${+s.value}"><b>${+s.value}</b></div><p class="headline" style="text-align:center">${esc(s.label)}</p><span class="badge">${esc(s.badge)}</span>`;
 if(s.headline)h+=`<p class="headline">${hl(s.headline)}</p>`;
 if(s.lead)h+=`<p class="small" style="font-size:14.5px">${esc(s.lead)}</p>`;
 if(s.bars)h+=bars(s.bars);
 if(s.parts)h+=bars(s.parts);
 h+=P(s.paras);
 if(s.items)h+=s.items.map(x=>`<div class="item"><h3>${esc(x.h)}${x.tag?`<span class="tag ${x.tag==="다른 점"?"d":x.tag==="사이"?"m":""}">${esc(x.tag)}</span>`:""}</h3><p>${esc(x.t)}</p>${x.tip?`<div class="tip">${esc(x.tip)}</div>`:""}</div>`).join("");
 if(s.scene)h+=`<h3>이런 장면, 있지 않았나요?</h3><p class="scene">${esc(s.scene)}</p>`;
 if(s.scripts)h+=`<h3>이렇게 말해 보세요</h3>`+s.scripts.map(t=>`<div class="say">“${esc(t)}”</div>`).join("");
 if(s.tips)h+=`<h3 style="margin-top:6px;font-size:18px">${esc(s.tipsTitle)}</h3>`+s.tips.map((x,k)=>`<div class="item"><h3>${k+1}. ${esc(x.h)}</h3><p>${esc(x.t)}</p></div>`).join("");
 if(s.safe)h+=`<p class="small">${esc(s.safe)}</p>`;
 if(s.cta&&/^https:\/\/touchingvoice\.app\//.test(s.cta.url))h+=`<a class="btn pri block" href="${esc(s.cta.url)}">${esc(s.cta.label)}</a><p class="small" style="text-align:center">${esc(s.cta.note)}</p>`;
 if(s.box)h+=`<ul class="inc small">${s.box.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;
 return `<section class="card">${h}</section>`}
function vReport(D){setFam(D.code);if(!D.test&&R.token&&R.tracked!==R.token){tvTrack("Purchase",{value:+PRICE.replace(/\D/g,""),currency:"KRW"});R.tracked=R.token;save()}/* 결제 레포트를 이 기기에서 처음 열 때 한 번만 */
 show(`<div><div class="kicker">목소리 × 성격 레포트</div><h1 class="title">${D.nick?esc(D.nick)+" 님의":"나의"}<br>목소리 × 성격 레포트</h1></div>
${heroCard(D.code,D.sex,"내 목소리 유형")}
${D.sections.map(secHtml).join("")}
<div class="card noprint"><div class="row"><button class="btn" id="pdf">PDF로 저장</button><button class="btn" id="png">이미지로 저장</button></div>
<p class="small">새로고침하면 결과가 사라져요. 남겨 두려면 PDF나 이미지로 저장해 주세요.</p>
${R.token?`<button class="btn ghost" id="link">레포트 주소 복사</button>`:""}</div>
<a class="btn block" href="voicetest.html?${R.preview?"free":"paid"}&hear" onclick="tvEvent('목소리다시듣기')">달라진 내 목소리 다시 듣기</a>
<a class="btn block" href="voicetest.html?${R.preview?"free":"paid"}=new" onclick="tvEvent('다시검사')">처음부터 다시 검사하기</a>
${BIZ}`);
 $("#pdf").onclick=()=>window.print();
 $("#png").onclick=()=>{tvEvent("결과저장");return saveImage(D).catch(()=>toast("이미지를 만들지 못했어요"))};
 if($("#link"))$("#link").onclick=()=>{const u=location.origin+location.pathname+"#t="+R.token;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast("주소를 복사했어요"),()=>prompt("주소를 복사해 주세요",u))}}

/* ===== 이미지로 저장 — 11/16 대표: PDF처럼 레포트 전체를 긴 이미지 한 장으로(1080 너비, 크림 바탕·흰 카드) =====
   두 번 돈다: 한 번은 높이만 재고, 한 번은 그린다. 아이폰 캔버스 한계(약 1,600만 화소) 넘으면 통째로 줄인다 */
async function makeFull(D){const f=FAM[(D.code||"").slice(0,2)]||FAM.LA,ff="Paperlogy,'Apple SD Gothic Neo',sans-serif",ACC=f[0],INK="#2A2035",MUT="#6B6280",GOLD="#A8925A",CREAM="#F5EEE0";
 try{await Promise.all(["700 40px","600 40px","500 40px"].map(x=>document.fonts.load(x+" Paperlogy")))}catch(e){}
 let im=null;try{im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=charImg(D.code,D.sex)})}catch(e){}
 const W=1080,X0=40,CWc=W-80,IP=48,X=X0+IP,CW=CWc-2*IP,F=(w,px)=>`${w} ${px}px ${ff}`;
 const run=(g,draw,H)=>{let y=0;const hs=[];
  const wrap=(t,font,mw)=>{g.font=font;const out=[];String(t==null?"":t).split("\n").forEach(par=>{let line="";par.split(" ").forEach(wd=>{const tl=line?line+" "+wd:wd;if(g.measureText(tl).width<=mw){line=tl;return}if(line)out.push(line);if(g.measureText(wd).width<=mw){line=wd;return}let cur="";for(const ch of wd){if(g.measureText(cur+ch).width>mw){out.push(cur);cur=ch}else cur+=ch}line=cur});if(line)out.push(line)});return out};
  const T=(t,w,px,color,lh,x=X,mw=CW)=>{const ls=wrap(t,F(w,px),mw);if(draw){g.font=F(w,px);g.fillStyle=color;ls.forEach((l,k)=>g.fillText(l,x,y+lh*k+px))}y+=ls.length*lh};
  const box=(x,yy,w,h,r,fill)=>{if(!draw)return;g.beginPath();if(g.roundRect)g.roundRect(x,yy,w,h,r);else g.rect(x,yy,w,h);g.fillStyle=fill;g.fill()};
  const boxed=(t,w,px,color,lh,fill)=>{const n=wrap(t,F(w,px),CW-48).length,h=n*lh+32,t0=y;box(X,t0,CW,h,22,fill);y+=16;T(t,w,px,color,lh,X+24,CW-48);y=t0+h};
  if(draw){const bg=g.createLinearGradient(0,0,W,600);bg.addColorStop(0,f[0]);bg.addColorStop(1,f[1]);g.fillStyle=CREAM;g.fillRect(0,0,W,g.canvas.height);g.fillStyle=bg;g.fillRect(0,0,W,600)}
  y=60;T("터칭보이스 · 목소리 × 성격 레포트",700,30,"rgba(255,255,255,.8)",40,64,W-128);
  if(draw&&im){g.save();g.beginPath();if(g.roundRect)g.roundRect(64,140,240,240,56);else g.rect(64,140,240,240);g.clip();g.drawImage(im,64,140,240,240);g.restore()}
  y=170;T((D.code||"").split("").join(" "),700,34,"rgba(255,255,255,.85)",48,340,W-404);T(D.typeName,700,58,"#fff",70,340,W-404);if(D.nick)T(D.nick+" 님의 레포트",500,32,"rgba(255,255,255,.85)",44,340,W-404);
  y=Math.max(y,390)+36;T(D.headline,700,44,"#fff",58,64,W-128);y=Math.max(y,600)+40;
  (D.sections||[]).forEach((s,i)=>{const top=y;if(H)box(X0,top,CWc,H[i],40,"#fff");y+=IP;
   T(String(i+1).padStart(2,"0"),700,26,GOLD,38);T(s.title,700,44,INK,58);y+=8;
   if(s.value!=null){T(String(s.value),700,120,ACC,130);T(s.label,600,34,INK,46);if(s.badge)T(s.badge,500,26,MUT,38);y+=10}
   if(s.headline){T(s.headline,700,40,ACC,54);y+=6}
   if(s.lead){T(s.lead,500,30,MUT,44);y+=6}
   const bars=list=>list.forEach(b=>{y+=10;if(draw){g.font=F(600,30);g.fillStyle=INK;g.fillText(b.nm,X,y+32);const bx=X+210,bw=CW-210-80;box(bx,y+10,bw,24,12,"#EEE8F3");box(bx,y+10,Math.max(24,bw*b.v/100),24,12,ACC);g.font=F(700,30);g.fillStyle=INK;g.textAlign="right";g.fillText(String(b.v),X+CW,y+32);g.textAlign="left"}y+=48;if(b.t)T(b.t,500,28,MUT,42)});
   if(s.bars)bars(s.bars);if(s.parts)bars(s.parts);
   (s.paras||[]).forEach(p=>{y+=12;T(p,500,31,INK,50)});
   (s.items||[]).forEach(it=>{y+=22;T(it.h+(it.tag?"  · "+it.tag:""),700,33,INK,48);T(it.t,500,30,INK,48);if(it.tip){y+=8;boxed(it.tip,500,28,ACC,42,"#F3EEF8")}});
   if(s.scene){y+=18;T("이런 장면, 있지 않았나요?",700,32,INK,46);T(s.scene,500,30,MUT,48)}
   if(s.scripts){y+=18;T("이렇게 말해 보세요",700,32,INK,46);s.scripts.forEach(t=>{y+=8;boxed("“"+t+"”",600,30,INK,46,"#F7F2E7")})}
   if(s.tips){y+=22;T(s.tipsTitle||"",700,36,INK,50);s.tips.forEach((x,k)=>{y+=10;T((k+1)+". "+x.h,700,32,INK,46);T(x.t,500,30,INK,48)})}
   if(s.safe){y+=12;T(s.safe,500,26,MUT,38)}
   if(s.cta){y+=16;T("→ "+s.cta.label,700,30,ACC,44);T(s.cta.url.replace(/^https:\/\//,""),500,26,MUT,38)}
   if(s.box){y+=10;s.box.forEach(t=>T("· "+t,500,28,INK,42))}
   y+=IP;hs.push(y-top);y+=32});
  y+=8;T("touchingvoice.app",500,26,MUT,38,64,W-128);y+=56;return{h:Math.ceil(y),hs}};
 const m=run(document.createElement("canvas").getContext("2d"),false),k=Math.min(1,Math.sqrt(16e6/(W*m.h))),c=document.createElement("canvas");
 c.width=Math.floor(W*k);c.height=Math.floor(m.h*k);const g=c.getContext("2d");g.scale(k,k);run(g,true,m.hs);return c}
async function saveImage(D){const c=await makeFull(D),blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.92)),f=new File([blob],"touchingvoice_report.jpg",{type:"image/jpeg"});
 if(/iP(hone|ad|od)/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){toast("나오는 창에서 '이미지 저장'을 눌러 주세요");try{await navigator.share({files:[f]})}catch(e){}return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast("이미지를 저장했어요")}

 if(!HAS_VOICE)return location.replace("voicetest.html?paid");/* 11/16: 목소리 결과가 없으면 하나로 이어진 검사부터 */
 done()?(R.preview?openPreview():vTeaser()):vQuiz()})();
window.addEventListener("pageshow",e=>{if(e.persisted)claim()});
window.addEventListener("hashchange",()=>{if(/t=[0-9a-f]{64}/.test(location.hash))location.reload()});/* 같은 탭에서 레포트 주소(#t=)로 바뀌면 다시 읽는다 */
</script>
