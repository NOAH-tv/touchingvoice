/* ===== 이미지로 저장 — 11/16 대표: PDF처럼 레포트 전체를 긴 이미지 한 장으로(1080 너비, 크림 바탕·흰 카드) =====
   두 번 돈다: 한 번은 높이만 재고, 한 번은 그린다. 아이폰 캔버스 한계(약 1,600만 화소) 넘으면 통째로 줄인다 */
async function makeFull(D){const f=FAM[(D.code||"").slice(0,2)]||FAM.LA,ff="Paperlogy,'Apple SD Gothic Neo',sans-serif",ACC=f[0],INK="#2A2035",MUT="#6B6280",GOLD="#A8925A",CREAM="#F5EEE0";
 try{await Promise.all(["700 40px","600 40px","500 40px"].map(x=>document.fonts.load(x+" Paperlogy")))}catch(e){}
 let im=null;try{im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=charImg(D.code,D.sex)})}catch(e){}
 const W=1080,X0=40,CWc=W-80,IP=48,X=X0+IP,CW=CWc-2*IP,F=(w,px)=>`${w} ${px}px ${ff}`;
 const run=(g,draw,H)=>{let y=0;const hs=[];
  const wrap=(t,font,mw)=>{g.font=font;const out=[];String(t==null?"":t).split("\n").forEach(par=>{let line="";par.split(" ").forEach(wd=>{const tl=line?line+" "+wd:wd;if(g.measureText(tl).width<=mw){line=tl;return}if(line)out.push(line);if(g.measureText(wd).width<=mw){line=wd;return}let cur="";for(const ch of wd){if(g.measureText(cur+ch).width>mw){out.push(cur);cur=ch}else cur+=ch}line=cur});if(line)out.push(line)});return out};
  const T=(t,w,px,color,lh,x=X,mw=CW)=>{const ls=wrap(t,F(w,px),mw);if(draw){g.font=F(w,px);g.fillStyle=color;ls.forEach((l,k)=>g.fillText(l,x,y+lh*k+px))}y+=ls.length*lh};
  const box=(x,yy,w,h,r,fill)=>{if(!draw)return;g.beginPath();if(g.roundRect)g.roundRect(x,yy,w,h,r);else g.rect(x,yy,w,h);g.fillStyle=fill;g.fill()};
  const boxed=(t,w,px,color,lh,fill)=>{const n=wrap(t,F(w,px),CW-48).length,h=n*lh+32,t0=y;box(X,t0,CW,h,22,fill);y+=16;T(t,w,px,color,lh,X+24,CW-48);y=t0+h};
  if(draw){const bg=g.createLinearGradient(0,0,W,600);bg.addColorStop(0,f[0]);bg.addColorStop(1,f[1]);g.fillStyle=CREAM;g.fillRect(0,0,W,g.canvas.height);g.fillStyle=bg;g.fillRect(0,0,W,600)}
  y=60;T("Touching Voice · Voice × Personality Result",700,30,"rgba(255,255,255,.8)",40,64,W-128);
  if(draw&&im){g.save();g.beginPath();if(g.roundRect)g.roundRect(64,140,240,240,56);else g.rect(64,140,240,240);g.clip();g.drawImage(im,64,140,240,240);g.restore()}
  y=170;T((D.code||"").split("").join(" "),700,34,"rgba(255,255,255,.85)",48,340,W-404);T(D.typeName,700,58,"#fff",70,340,W-404);if(D.nick)T(D.nick+"'s result",500,32,"rgba(255,255,255,.85)",44,340,W-404);
  y=Math.max(y,390)+36;T(D.headline,700,44,"#fff",58,64,W-128);y=Math.max(y,600)+40;
  (D.sections||[]).forEach((s,i)=>{const top=y;if(H)box(X0,top,CWc,H[i],40,"#fff");y+=IP;
   T(String(i+1).padStart(2,"0"),700,26,GOLD,38);T(s.title,700,44,INK,58);y+=8;
   if(s.value!=null){T(String(s.value),700,120,ACC,130);T(s.label,600,34,INK,46);if(s.badge)T(s.badge,500,26,MUT,38);y+=10}
   if(s.headline){T(s.headline,700,40,ACC,54);y+=6}
   if(s.lead){T(s.lead,500,30,MUT,44);y+=6}
   const bars=list=>list.forEach(b=>{y+=10;if(draw){g.font=F(600,30);g.fillStyle=INK;g.fillText(b.nm,X,y+32);const bx=X+210,bw=CW-210-80;box(bx,y+10,bw,24,12,"#EEE8F3");box(bx,y+10,Math.max(24,bw*b.v/100),24,12,ACC);g.font=F(700,30);g.fillStyle=INK;g.textAlign="right";g.fillText(String(b.v),X+CW,y+32);g.textAlign="left"}y+=48;if(b.t)T(b.t,500,28,MUT,42)});
   if(s.bars)bars(s.bars);if(s.parts)bars(s.parts);
   (s.paras||[]).forEach(p=>{y+=12;T(p,500,31,INK,50)});
   (s.items||[]).forEach(it=>{y+=22;T(it.h+(it.tag?"  · "+it.tag:""),700,33,INK,48);T(it.t,500,30,INK,48);if(it.tip){y+=8;boxed(it.tip,500,28,ACC,42,"#F3EEF8")}});
   if(s.scene){y+=18;T("Ever had a moment like this?",700,32,INK,46);T(s.scene,500,30,MUT,48)}
   if(s.scripts){y+=18;T("Try saying it like this",700,32,INK,46);s.scripts.forEach(t=>{y+=8;boxed("“"+t+"”",600,30,INK,46,"#F7F2E7")})}
   if(s.tips){y+=22;T(s.tipsTitle||"",700,36,INK,50);s.tips.forEach((x,k)=>{y+=10;T((k+1)+". "+x.h,700,32,INK,46);T(x.t,500,30,INK,48)})}
   if(s.safe){y+=12;T(s.safe,500,26,MUT,38)}
   if(s.cta){y+=16;T("→ "+s.cta.label,700,30,ACC,44);T(s.cta.url.replace(/^https:\/\//,""),500,26,MUT,38)}
   if(s.box){y+=10;s.box.forEach(t=>T("· "+t,500,28,INK,42))}
   y+=IP;hs.push(y-top);y+=32});
  y+=8;T("touchingvoice.app",500,26,MUT,38,64,W-128);y+=56;return{h:Math.ceil(y),hs}};
 const m=run(document.createElement("canvas").getContext("2d"),false),k=Math.min(1,Math.sqrt(16e6/(W*m.h))),c=document.createElement("canvas");
 c.width=Math.floor(W*k);c.height=Math.floor(m.h*k);const g=c.getContext("2d");g.scale(k,k);run(g,true,m.hs);return c}
async function saveImage(D){const c=await makeFull(D),blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.92)),f=new File([blob],"touchingvoice_result.jpg",{type:"image/jpeg"});
 if(/iP(hone|ad|od)/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){toast("In the window that opens, tap 'Save Image'");try{await navigator.share({files:[f]})}catch(e){}return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast("Image saved")}

 done()?vTeaser():vQuiz()})();

window.addEventListener("hashchange",()=>{if(/t=[0-9a-f]{64}/.test(location.hash))location.reload()});/* 같은 탭에서 레포트 주소(#t=)로 바뀌면 다시 읽는다 */
</script>
