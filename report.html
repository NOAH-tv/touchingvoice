<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>발성심리보고서 · 터칭보이스</title><link rel="stylesheet" href="./style.css"><style>body{background:#10091c}.report-app{max-width:1440px;margin:auto;padding:24px}.report-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}.report-head img{width:160px;height:auto}.report-grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px}.report-controls{padding:24px;border:1px solid #533570;border-radius:18px;background:linear-gradient(140deg,#2e1749,#180f27);align-self:start}.report-controls h1{font-size:24px;margin-bottom:16px}.report-controls label{margin-top:16px}.report-controls textarea{min-height:85px}.report-controls .button{margin-top:10px;width:100%}.report-preview{width:100%;height:calc(100dvh - 115px);min-height:600px;border:1px solid #684a7e;border-radius:18px;background:#f5eee0}#status{padding:12px 0;color:#d4c4e6;white-space:pre-wrap;font-size:13px}#status.error{color:#ffc0cb}.report-actions{display:flex;gap:10px;flex-wrap:wrap}.report-actions .button{width:auto;flex:1}#issuedLink{font-size:11px;overflow-wrap:anywhere;display:block;margin:15px 0;color:#d7bdff}.report-history{margin-top:20px;border-top:1px solid #5a3b70;padding-top:12px}.report-history button{width:100%;margin:5px 0;text-align:left}.recipient .report-grid{display:block}.recipient .report-preview{height:calc(100dvh - 140px)}.recipient #author{display:none}.report-controls .checkbox-label{display:flex;font-size:12px;gap:10px}.delivery-note{font-size:11px;color:#c8b5db;margin-top:12px}@media(max-width:850px){.report-grid{grid-template-columns:1fr}.report-app{padding:14px}.report-preview{min-height:700px}.report-head img{width:120px}.report-head{flex-wrap:wrap}}[hidden]{display:none!important}</style></head><body><main class="report-app"><header class="report-head"><img src="./tv_logo_beige.png" alt="터칭보이스"><div class="report-actions"><button id="back" class="button secondary">← 코칭 화면으로</button><button id="print" class="button primary" disabled>인쇄 / PDF 저장</button></div></header><div id="status" role="status" aria-live="polite">보고서를 준비하고 있습니다.</div><div class="report-grid"><section id="author" class="report-controls" hidden><p class="eyebrow">PERSONALITY × VOICE</p><h1>발성심리보고서</h1><p id="studentLabel"></p><label for="kind">보고서 종류</label><select id="kind"><option value="detailed">상세 보고서 · 코칭 계획 포함</option><option value="summary">요약 보고서</option></select><label for="observation">지도사 관찰 · 해석</label><textarea id="observation" maxlength="3000" placeholder="성향 검사와 발성을 함께 살펴본 의견"></textarea><label for="plan">개인별 훈련 계획</label><textarea id="plan" maxlength="3000" placeholder="이번 수업의 연습 과제와 목표"></textarea><label for="followUp">재검사 계획</label><textarea id="followUp" maxlength="3000" placeholder="재검사 날짜·과제·비교할 변화"></textarea><button id="preview" class="button secondary">보고서 미리보기 갱신</button><label class="checkbox-label"><input type="checkbox" id="reviewed"><span>검사 대상과 보고서 내용을 확인했습니다.</span></label><button id="issue" class="button primary">보고서 발급 · 서버 보관</button><small>발급 당시 내용을 비공개 보관합니다. 전달 링크는 30일간 유효하며 아래에서 종료할 수 있습니다.</small><a id="issuedLink" hidden target="_blank" rel="noopener noreferrer"></a><div id="delivery" hidden><div class="report-actions"><button id="copy" class="button secondary">링크 복사</button><button id="download" class="button secondary">보고서 파일 저장</button></div><button id="smsDraft" class="button secondary">문자 앱에서 보내기</button><button id="bridge" class="button secondary">맥 문자 브리지 연결 확인</button><button id="smsSend" class="button primary" hidden>맥 문자로 발송</button><label class="checkbox-label"><input id="recipientConfirmed" type="checkbox"><span id="recipientLabel">수신번호와 전달할 보고서를 확인했습니다.</span></label><p class="delivery-note">문자 앱 열기는 발송 완료가 아닙니다. 맥 브리지 발송 접수도 수신자의 수신 확인을 의미하지 않습니다.</p><p id="deliveryStatus" class="delivery-note"></p><button id="revoke" class="button ghost">이 보고서 링크 종료</button></div><div class="report-history"><h3>이 검사의 발급 이력</h3><div id="history"></div></div></section><iframe id="document" class="report-preview" title="발성심리보고서" sandbox="allow-same-origin allow-modals" referrerpolicy="no-referrer"></iframe></div></main><script type="module">
import {config} from './config.js';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.hash.slice(1)),token=params.get('token'),examId=params.get('exam'),branchId=params.get('branch');
let activeUserId='',call,signIn,issued=null,html='',phone='',busy=false,requestId=null,payloadKey='',currentKey='',bridgeReady=false,reports=[];
const labels={not_sent:'미발송',draft_opened:'문자 앱 열기 요청 · 전송 여부 미확인',sending:'발송 요청 중 · 결과 확인 전',accepted:'맥 Messages 발송 접수 · 수신 확인 아님',uncertain:'발송 결과 불확실 · 중복 발송 차단'};
const status=(message,error=false)=>{$('status').textContent=message;$('status').classList.toggle('error',error);};
async function safely(fn){if(busy)return;busy=true;const buttons=[...document.querySelectorAll('#author button')];buttons.forEach(b=>b.disabled=true);try{await fn();}catch(e){status(e.message||'요청을 완료하지 못했습니다.',true);}finally{busy=false;buttons.forEach(b=>b.disabled=false);syncDelivery();}}
function showHTML(content){html=content;$('document').srcdoc=content;$('print').disabled=true;}
$('document').onload=()=>{$('print').disabled=!html;};
$('print').onclick=()=>{if(html){$('document').contentWindow.focus();$('document').contentWindow.print();}};
$('back').onclick=()=>{if(window.opener&&!window.opener.closed)window.close();else location.href='./portal.html';};
async function publicRead(t){const reader=activeUserId;const response=await fetch(config.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'report.public',payload:{token:t}}),credentials:'omit',cache:'no-store',signal:AbortSignal.timeout(45000)});const result=await response.json();if(!token&&(!reader||reader!==activeUserId))throw new Error('로그인이 변경되어 보고서 조회를 중단했습니다.');if(!result.ok)throw new Error(result.error?.message||'보고서를 불러오지 못했습니다.');return result.data;}
function payload(){return {examId,kind:$('kind').value,observation:$('observation').value.trim(),plan:$('plan').value.trim(),followUp:$('followUp').value.trim()};}
function syncDelivery(){const ready=!!issued?.url&&issued.status==='issued'&&Date.parse(issued.expiresAt)>Date.now();$('delivery').hidden=!issued;$('issuedLink').hidden=!ready;if(ready){$('issuedLink').href=issued.url;$('issuedLink').textContent=issued.url;}else $('issuedLink').removeAttribute('href');$('deliveryStatus').textContent=issued?(issued.status==='revoked'?'링크 종료됨':labels[issued.deliveryStatus]||'발송 상태 확인 필요'):'';const validPhone=/^0\d{8,10}$/.test(phone.replace(/\D/g,''));$('recipientLabel').textContent=(validPhone?phone+' · ':'학생 연락처 미등록 · ')+'수신번호와 전달할 보고서를 확인했습니다.';const locked=['sending','accepted','uncertain'].includes(issued?.deliveryStatus);$('smsDraft').disabled=busy||!ready||!validPhone||locked;$('smsSend').disabled=busy||!ready||!validPhone||!bridgeReady||locked;$('copy').disabled=!ready;$('revoke').disabled=busy||!ready;}
function history(){const out=$('history');out.replaceChildren();for(const r of reports){const b=document.createElement('button');b.className='button ghost';b.textContent=`${r.kind==='summary'?'요약':'상세'} · ${String(r.issuedAt).slice(0,16).replace('T',' ')} · ${r.status==='revoked'?'링크 종료':labels[r.deliveryStatus]||'미발송'}`;b.onclick=()=>safely(async()=>{if(r.status!=='issued')throw new Error('종료된 링크입니다. 필요하면 새 보고서를 발급해 주세요.');const content=await publicRead(new URL(r.url).hash.slice(7));issued=r;showHTML(content.html);syncDelivery();status('발급 당시 보관된 보고서입니다.');});out.append(b);}if(!reports.length)out.textContent='아직 발급된 보고서가 없습니다.';}
async function preview(){const p=payload(),r=await call('report.preview',p,branchId);phone=r.phone||'';$('studentLabel').textContent=r.name;currentKey=JSON.stringify(p);reports=r.reports||[];issued=null;showHTML(r.html);history();syncDelivery();status('발급 전 미리보기입니다. 내용을 확인한 후 발급하세요.');}
$('preview').onclick=()=>safely(preview);
for(const id of ['kind','observation','plan','followUp'])$(id).oninput=()=>{issued=null;requestId=null;currentKey='';$('reviewed').checked=false;syncDelivery();status('내용이 변경되었습니다. 미리보기를 갱신해 주세요.');};
$('issue').onclick=()=>safely(async()=>{if(!$('reviewed').checked)throw new Error('대상자와 보고서를 확인한 뒤 확인 항목을 선택해 주세요.');const p=payload(),key=JSON.stringify(p);if(key!==currentKey)throw new Error('미리보기를 갱신하고 내용을 확인해 주세요.');if(payloadKey!==key){requestId=null;payloadKey=key;}requestId ||= crypto.randomUUID();status('보고서를 비공개 서버에 보관하고 있습니다.');issued=await call('report.issue',{...p,reviewed:true},branchId,{requestId,timeoutMs:120000});const content=await publicRead(new URL(issued.url).hash.slice(7));showHTML(content.html);reports=[issued,...reports.filter(r=>r.id!==issued.id)];history();syncDelivery();status('보고서가 발급·보관되었습니다. 링크 전달 또는 PDF 저장을 사용할 수 있습니다.');});
$('copy').onclick=()=>safely(async()=>{await navigator.clipboard.writeText(issued.url);status('보고서 링크를 복사했습니다.');});
$('download').onclick=()=>{if(!html)return;const a=document.createElement('a'),url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.href=url;a.download=`TouchingVoice-${issued?.id||'report'}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
function smsText(){return `[터칭보이스] ${issued.name}님의 발성심리보고서가 발급되었습니다.\n아래 링크에서 확인해 주세요.\n${issued.url}`;}
function confirmRecipient(){if(!issued||!$('recipientConfirmed').checked)throw new Error('수신번호와 보고서를 확인한 뒤 확인 항목을 선택해 주세요.');}
$('smsDraft').onclick=()=>safely(async()=>{confirmRecipient();const r=await call('report.delivery',{id:issued.id,status:'draft_opened',attemptId:crypto.randomUUID()},branchId);issued={...issued,...r};const text=smsText();try{await navigator.clipboard.writeText(text);}catch{}location.href='sms:'+r.phone+'&body='+encodeURIComponent(text);status('문자 앱 열기를 요청했습니다. 문자 앱에서 전송을 완료해 주세요.');});
$('bridge').onclick=()=>safely(async()=>{const r=await fetch('http://127.0.0.1:7793/ping',{signal:AbortSignal.timeout(2500)}),j=await r.json();bridgeReady=j.ok===true&&j.service==='tv-booth-sms-bridge';$('smsSend').hidden=!bridgeReady;if(!bridgeReady)throw new Error('맥 문자 브리지를 확인하지 못했습니다.');status('맥 문자 브리지가 연결되었습니다. 수신번호를 확인한 뒤 발송할 수 있습니다.');});
$('smsSend').onclick=()=>safely(async()=>{confirmRecipient();const attemptId=crypto.randomUUID();const prepared=await call('report.delivery',{id:issued.id,status:'sending',attemptId},branchId);issued={...issued,...prepared};let state='uncertain';try{const response=await fetch('http://127.0.0.1:7793/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:prepared.phone,text:smsText(),requestId:attemptId}),signal:AbortSignal.timeout(45000)});const j=await response.json();if(j.ok===true&&j.status==='sent')state='accepted';}catch{}try{issued={...issued,...await call('report.delivery',{id:issued.id,status:state,attemptId},branchId)};}catch{issued.deliveryStatus='uncertain';}status(state==='accepted'?'맥 Messages에서 발송을 접수했습니다. 수신 여부는 별도로 확인해 주세요.':'발송 결과를 확인하지 못했습니다. 문자 앱에서 확인하기 전에는 재전송하지 마세요.',state!=='accepted');});
$('revoke').onclick=()=>safely(async()=>{issued=await call('report.revoke',{id:issued.id},branchId);reports=reports.map(r=>r.id===issued.id?issued:r);history();status('전달 링크를 종료했습니다. 기존 발급 기록은 보관됩니다.');});
if(token){document.body.classList.add('recipient');$('back').hidden=true;try{const r=await publicRead(token);showHTML(r.html);status('발급된 보고서 · 링크 유효기간 '+String(r.expiresAt).slice(0,10));}catch(e){status(e.message,true);$('document').hidden=true;}}
else if(examId&&branchId){const api=await import('./api.js');call=async(...args)=>{const reader=activeUserId;const result=await api.call(...args);if(!reader||reader!==activeUserId)throw new Error('로그인이 변경되어 요청을 중단했습니다.');return result;};const auth=await import('./auth.js');signIn=auth.signIn;let initialized=false;await auth.initAuth(async user=>{if(activeUserId&&activeUserId!==user?.uid){initialized=false;issued=null;html='';$('document').srcdoc='';$('print').disabled=true;}$('reviewed').checked=false;activeUserId=user?.uid||'';if(!user){initialized=false;issued=null;html='';$('document').srcdoc='';$('print').disabled=true;$('author').hidden=true;status('보고서 발급은 승인된 강사 로그인이 필요합니다.');if(!$('loginReport')){const b=document.createElement('button');b.id='loginReport';b.className='button primary';b.textContent='Google 로그인';b.onclick=()=>safely(async()=>{await signIn('google');if(activeUserId)await preview();});$('status').after(b);}return;}if(initialized)return;initialized=true;$('loginReport')?.remove();$('author').hidden=false;await safely(preview);});}
else{status('코칭 스튜디오의 검사 결과에서 보고서 발급을 열어 주세요.',true);$('document').hidden=true;}
</script></body></html>
